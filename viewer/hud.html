<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flight Log HUD</title>
    <style>
      :root {
        color-scheme: dark;
        --font-scale: 1;
        --ink: #edf4ef;
        --muted: #b7c6bd;
        --line: #32443b;
        --green: #44d0a8;
      }

      * { box-sizing: border-box; }

      body {
        background: #0e1512;
        color: var(--ink);
        display: grid;
        font-family: "Avenir Next", "Gill Sans", "Trebuchet MS", sans-serif;
        gap: 8px;
        grid-template-rows: auto minmax(0, 1fr);
        margin: 0;
        min-height: 100vh;
        padding: 10px;
      }

      .hud-controls {
        align-items: center;
        display: flex;
        gap: 8px;
      }

      button {
        background: #17241e;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--ink);
        cursor: pointer;
        padding: 7px 12px;
      }

      button.active {
        background: var(--green);
        color: #07110d;
      }

      #hud-status {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      canvas {
        border: 1px solid var(--line);
        border-radius: 12px;
        display: block;
        height: 100%;
        min-height: 420px;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="hud-controls">
      <button id="hud-playback-toggle">Play</button>
      <span id="hud-status">等待主窗口数据…</span>
    </div>
    <canvas id="hud-canvas"></canvas>
    <script src="js/track-hud.js"></script>
    <script src="js/hud-window.js"></script>
  </body>
</html>
