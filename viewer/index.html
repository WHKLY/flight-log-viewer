<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flight Log Viewer</title>
    <link rel="stylesheet" href="css/base.css">
  </head>
  <body>
    <main class="app-shell">
      <aside id="left-sidebar" class="control-rail" aria-label="Flight log controls">
        <div id="dataset-summary" class="muted">Loading UI config...</div>
      </aside>

      <section class="workspace" aria-label="Analysis workspace">
        <header class="hero">
          <div>
            <p class="eyebrow">Configurable Workstation</p>
            <h2>Unified Source Schema</h2>
            <p class="meta">Right panels are generated from <code>ui/config/panels.json</code>.</p>
          </div>
          <button type="button" data-action="reload">Reload Data</button>
        </header>

        <section id="workspace-panels" class="workspace-panels" aria-label="Workspace panels"></section>
      </section>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
