<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flight Log Viewer</title>
    <link rel="stylesheet" href="css/base.css">
  </head>
  <body>
    <main class="app-shell">
      <aside id="left-sidebar" class="control-rail" aria-label="Flight log controls">
        <div id="dataset-summary" class="muted">Loading UI config...</div>
      </aside>

      <section class="workspace" aria-label="Analysis workspace">
        <header class="hero">
          <div>
            <p class="eyebrow">Configurable Workstation</p>
            <h2>Unified Source Schema</h2>
            <p class="meta">Right panels are controlled from the left sidebar.</p>
          </div>
          <button type="button" data-action="reload">Reload Data</button>
        </header>

        <section id="status-grid" class="status-grid workspace-panel" data-panel-id="overview"></section>

        <section class="panel wide workspace-panel" data-panel-id="source-registry">
          <div class="section-head">
            <h2>Source Registry</h2>
            <span id="source-count" class="badge">0</span>
          </div>
          <div id="source-list" class="card-grid"></div>
        </section>

        <section class="panel wide workspace-panel" data-panel-id="mission-sources">
          <div class="section-head">
            <h2>Mission Sources</h2>
            <span id="mission-count" class="badge">0</span>
          </div>
          <div id="mission-list" class="card-grid"></div>
        </section>

        <section class="two-column workspace-panel-group">
          <section class="panel workspace-panel" data-panel-id="mode-segments">
            <h2>Mode Segments</h2>
            <div id="mode-list" class="scroll-list"></div>
          </section>
          <section class="panel workspace-panel" data-panel-id="parameters">
            <h2>Parameters</h2>
            <div id="parameter-summary" class="stack"></div>
          </section>
        </section>

        <section class="panel wide workspace-panel" data-panel-id="signal-catalog">
          <div class="section-head">
            <h2>Signal Catalog</h2>
            <span id="signal-count" class="badge">0</span>
          </div>
          <div id="signal-list" class="scroll-list compact"></div>
        </section>
      </section>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
