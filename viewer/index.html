<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flight Log Viewer</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #17211d;
        --muted: #607068;
        --soft: #eef2ec;
        --paper: #f7f8f2;
        --panel: #ffffff;
        --line: #d7ded6;
        --green: #0f6a55;
        --blue: #246b93;
        --red: #a13d31;
        --gold: #9a6b16;
        --violet: #67509a;
        --shadow: 0 18px 52px rgba(23, 33, 29, 0.08);
        --canvas: #fbfcf8;
        --mode-text: #10211b;
        --mode-auto: rgba(245, 158, 11, 0.34);
        --mode-stabilize: rgba(36, 107, 147, 0.26);
        --mode-manual: rgba(161, 61, 49, 0.24);
        --mode-other: rgba(103, 80, 154, 0.22);
        --zero-line: rgba(161, 61, 49, 0.72);
        --mode-transition: rgba(23, 33, 29, 0.5);
        --custom-h-ref: rgba(154, 107, 22, 0.88);
        --custom-time-ref: rgba(36, 107, 147, 0.88);
        --inspector-time: rgba(18, 128, 106, 0.95);
      }

      * {
        box-sizing: border-box;
      }

      body {
        --font-scale: 1;
        margin: 0;
        background:
          radial-gradient(circle at 8% 0%, rgba(15, 106, 85, 0.14), transparent 28%),
          linear-gradient(120deg, rgba(36, 107, 147, 0.1), transparent 36%),
          linear-gradient(315deg, rgba(154, 107, 22, 0.13), transparent 40%),
          var(--paper);
        color: var(--ink);
        font-family: "Avenir Next", "Gill Sans", "Trebuchet MS", sans-serif;
        font-size: calc(15px * var(--font-scale));
      }

      body.font-compact {
        --font-scale: 0.9;
      }

      body.font-large {
        --font-scale: 1.14;
      }

      main {
        display: grid;
        gap: 14px;
        grid-template-columns: minmax(208px, 232px) minmax(0, 1fr);
        margin: 0 auto;
        max-width: 1500px;
        padding: 18px 16px 48px;
      }

      .control-panel {
        align-self: start;
        display: grid;
        gap: 12px;
        max-height: calc(100dvh - 36px);
        max-width: 232px;
        min-width: 0;
        overflow: auto;
        padding-right: 2px;
        position: sticky;
        scrollbar-width: thin;
        top: 18px;
        width: 100%;
      }

      .control-panel > *,
      .toolbar *,
      .inspector *,
      .metric * {
        min-width: 0;
        max-width: 100%;
      }

      .viewer-panel {
        min-width: 0;
      }

      main.controls-collapsed {
        grid-template-columns: 58px minmax(0, 1fr);
      }

      main.controls-collapsed .control-panel > :not(.control-strip) {
        display: none;
      }

      .control-strip {
        align-items: center;
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
        display: flex;
        gap: 8px;
        justify-content: space-between;
        padding: 8px;
      }

      .control-title {
        color: var(--muted);
        font-size: calc(12px * var(--font-scale));
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        writing-mode: vertical-rl;
      }

      main:not(.controls-collapsed) .control-title {
        writing-mode: horizontal-tb;
      }

      main.controls-collapsed .control-strip {
        flex-direction: column;
        justify-content: flex-start;
        min-height: 132px;
        overflow: visible;
        padding: 8px 6px;
      }

      main.controls-collapsed #toggle-controls {
        align-items: center;
        display: inline-flex;
        font-size: 18px;
        height: 40px;
        justify-content: center;
        min-width: 40px;
        padding: 0;
        width: 40px;
      }

      .view-tabs {
        align-items: center;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
        padding: 8px;
        position: sticky;
        top: 8px;
        z-index: 9;
      }

      .app-view[hidden] {
        display: none;
      }

      header {
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
        display: grid;
        gap: 8px;
        padding: 12px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(calc(21px * var(--font-scale)), 4vw, calc(30px * var(--font-scale)));
        letter-spacing: -0.03em;
      }

      h2 {
        font-size: calc(20px * var(--font-scale));
      }

      h3 {
        font-size: calc(15px * var(--font-scale));
      }

      p,
      td,
      th,
      li,
      label {
        color: var(--muted);
      }

      code {
        background: var(--soft);
        border-radius: 4px;
        padding: 2px 5px;
      }

      button {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--ink);
        cursor: pointer;
        font: inherit;
        padding: 7px 12px;
      }

      button.active {
        background: var(--green);
        border-color: var(--green);
        color: #fff;
      }

      .metrics {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin: 0;
      }

      .metric {
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px;
        box-shadow: var(--shadow);
      }

      .metric p {
        font-size: calc(11px * var(--font-scale));
      }

      .metric strong {
        display: block;
        color: var(--green);
        font-size: calc(16px * var(--font-scale));
        overflow: auto;
        scrollbar-width: thin;
        white-space: nowrap;
      }

      .notice,
      .toolbar,
      .inspector {
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: var(--shadow);
        margin-bottom: 0;
        padding: 12px;
      }

      .toolbar {
        display: grid;
        gap: 10px;
      }

      .toolbar-row,
      .mode-buttons,
      .chart-actions {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .range-text {
        color: var(--muted);
        font-size: calc(13px * var(--font-scale));
      }

      .layer {
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: var(--shadow);
        margin-top: 0;
        overflow: hidden;
      }

      .layer-head {
        align-items: center;
        display: grid;
        gap: 10px;
        grid-template-columns: 1fr auto auto;
        padding: 11px 14px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(90deg, rgba(15, 106, 85, 0.09), rgba(255, 255, 255, 0));
      }

      .layer-head p {
        font-size: calc(13px * var(--font-scale));
        max-width: 820px;
      }

      .layer-index {
        color: var(--muted);
        font-size: calc(12px * var(--font-scale));
        font-weight: 700;
      }

      .layer-toggle {
        padding: 5px 10px;
      }

      .layer.collapsed .layer-body {
        display: none;
      }

      .layer-body {
        display: grid;
        grid-template-columns: minmax(0, 1.7fr) minmax(240px, 0.45fr);
        gap: 14px;
        padding: 14px;
      }

      .panel {
        min-width: 0;
      }

      .panel + .panel {
        border-left: 1px solid var(--line);
        padding-left: 14px;
      }

      .chart-shell {
        position: relative;
      }

      canvas {
        display: block;
        width: 100%;
        height: 380px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--canvas);
        touch-action: none;
      }

      .small canvas {
        height: 310px;
      }

      #track-3d-chart {
        height: 460px;
      }

      .readout {
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid var(--line);
        border-radius: 8px;
        bottom: 8px;
        box-shadow: 0 8px 24px rgba(23, 33, 29, 0.08);
        color: var(--ink);
        font-size: 12px;
        left: 8px;
        max-width: min(92%, 680px);
        padding: 7px 8px;
        position: absolute;
      }

      .readout:empty {
        display: none;
      }

      header,
      .toolbar,
      .metric,
      .notice,
      .note,
      .readout,
      .inspector-card,
      .layer-head,
      td,
      th {
        overflow: auto;
        scrollbar-width: thin;
      }

      header { max-height: 150px; }
      .toolbar { max-height: 260px; }
      .metric { max-height: 84px; }
      .note { max-height: 210px; }
      .layer-head { max-height: 130px; }
      .readout { max-height: 140px; }

      td,
      th {
        max-width: 220px;
        white-space: nowrap;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        margin-top: 8px;
        font-size: calc(13px * var(--font-scale));
      }

      .chart-control-bar {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }

      .chart-control-bar button,
      .custom-controls button,
      .custom-controls select,
      .track-controls button,
      .track-controls input,
      .track-controls select {
        font-size: 12px;
        padding: 5px 9px;
      }

      .track-controls input[type="range"] {
        padding-left: 0;
        padding-right: 0;
        width: 100%;
      }

      .custom-controls select,
      .track-controls select,
      .track-controls input[type="number"] {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--ink);
      }

      .mission-source-row label {
        align-items: center;
        display: inline-flex;
        gap: 5px;
        white-space: nowrap;
      }

      .mission-source-row input[type="number"] {
        width: 92px;
      }

      .table-scroll {
        border: 1px solid var(--line);
        border-radius: 8px;
        max-height: 330px;
        overflow-x: scroll;
        overflow-y: auto;
        overscroll-behavior-inline: contain;
        scrollbar-gutter: stable;
        -webkit-overflow-scrolling: touch;
      }

      .table-scroll table {
        width: max-content;
        min-width: 100%;
      }

      .table-scroll td,
      .table-scroll th {
        overflow: visible;
      }

      .param-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        display: grid;
        gap: 6px;
        max-height: 260px;
        overflow: auto;
        padding: 8px;
        scrollbar-width: thin;
      }

      .param-row {
        display: grid;
        gap: 4px;
        grid-template-columns: minmax(96px, 0.9fr) minmax(0, 1.1fr);
        min-width: 260px;
      }

      .param-row code,
      .param-row span {
        overflow: auto;
        scrollbar-width: thin;
        white-space: nowrap;
      }

      .custom-controls,
      .track-controls {
        display: grid;
        gap: 8px;
      }

      .track-controls {
        background: var(--soft);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: var(--shadow);
        margin: 8px 0 12px;
        padding: 8px;
      }

      .playback-dock {
        align-items: center;
        background: var(--panel);
        background: color-mix(in srgb, var(--panel) 92%, var(--green) 8%);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: var(--shadow);
        display: grid;
        gap: 8px;
        grid-template-columns: auto minmax(180px, 1fr) auto;
        margin: 8px 0;
        padding: 8px;
        position: sticky;
        top: 62px;
        z-index: 6;
      }

      .playback-actions {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .playback-dock input[type="range"] {
        min-width: 0;
        width: 100%;
      }

      .playback-time {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .parameter-workspace {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
        display: grid;
        gap: 14px;
        padding: 16px;
      }

      .parameter-header {
        align-items: end;
        background: transparent;
        border: 0;
        box-shadow: none;
        display: flex;
        gap: 16px;
        justify-content: space-between;
        padding: 0;
      }

      .parameter-header label,
      .parameter-search {
        display: grid;
        gap: 5px;
      }

      .parameter-header select,
      .parameter-search input {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        font: inherit;
        min-width: min(420px, 70vw);
        padding: 8px 10px;
      }

      .parameter-summary {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .parameter-summary > div {
        background: var(--soft);
        border: 1px solid var(--line);
        border-radius: 9px;
        display: grid;
        gap: 4px;
        padding: 10px;
      }

      .parameter-summary strong {
        color: var(--green);
        font-size: 18px;
      }

      .parameter-diagnostics {
        display: grid;
        gap: 8px;
      }

      .parameter-issue,
      .parameter-ok {
        border: 1px solid var(--line);
        border-left: 4px solid var(--gold);
        border-radius: 8px;
        display: grid;
        gap: 3px;
        padding: 9px 11px;
      }

      .parameter-issue-error { border-left-color: var(--red); }
      .parameter-issue-warning { border-left-color: var(--gold); }
      .parameter-ok { border-left-color: var(--green); }

      .parameter-issue span,
      .parameter-ok,
      .parameter-result-count {
        color: var(--muted);
        font-size: 13px;
      }

      .parameter-filterbar {
        align-items: end;
        display: grid;
        gap: 10px;
        grid-template-columns: minmax(260px, 0.6fr) minmax(0, 1.4fr);
      }

      .parameter-categories {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .parameter-categories button {
        font-size: 12px;
        padding: 5px 9px;
      }

      .parameter-table {
        max-height: min(62vh, 720px);
      }

      .parameter-table td:nth-child(2),
      .parameter-table td:nth-child(3) {
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }

      .track-quickbar {
        align-items: center;
        display: flex;
        flex-wrap: nowrap;
        gap: 6px;
        overflow: auto;
        scrollbar-width: thin;
      }

      .track-quickbar button,
      .track-quickbar select {
        flex: 0 0 auto;
      }

      .track-section,
      .track-details {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 9px;
        min-width: 0;
      }

      .track-section {
        display: grid;
        gap: 7px;
        padding: 8px;
      }

      .track-details {
        overflow: hidden;
      }

      .track-details summary {
        cursor: pointer;
        font-weight: 700;
        list-style-position: inside;
        overflow: auto;
        padding: 8px;
        scrollbar-width: thin;
        white-space: nowrap;
      }

      .track-details[open] summary {
        border-bottom: 1px solid var(--line);
      }

      .track-details-body {
        display: grid;
        gap: 7px;
        padding: 8px;
      }

      .track-section-title {
        align-items: baseline;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: space-between;
      }

      .track-section-title strong {
        color: var(--ink);
      }

      .track-button-row {
        display: flex;
        flex-wrap: nowrap;
        gap: 6px;
        max-height: 86px;
        overflow: auto;
        scrollbar-width: thin;
      }

      .track-slider-row {
        display: grid;
        gap: 5px;
      }

      .track-controls .mode-buttons,
      .track-controls .chart-actions {
        gap: 6px;
        max-height: 92px;
        overflow: auto;
        scrollbar-width: thin;
      }

      .inspector {
        display: grid;
        gap: 10px;
      }

      .inspector-card {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        padding: 10px;
      }

      .inspector-head {
        align-items: center;
        display: flex;
        gap: 8px;
        justify-content: space-between;
      }

      .inspector-head h3,
      .inspector-card h3 {
        margin-bottom: 0;
      }

      .inspector-actions {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .inspector-actions button {
        font-size: calc(12px * var(--font-scale));
        padding: 5px 9px;
      }

      .inspector-grid {
        display: grid;
        gap: 6px;
      }

      .kv-grid {
        display: grid;
        gap: 6px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-top: 8px;
      }

      .kv {
        background: var(--soft);
        border-radius: 8px;
        padding: 7px;
      }

      .kv span {
        color: var(--muted);
        display: block;
        font-size: calc(11px * var(--font-scale));
      }

      .kv strong {
        color: var(--ink);
        display: block;
        overflow: auto;
        scrollbar-width: thin;
        text-overflow: clip;
        white-space: nowrap;
      }

      .track-3d-stage {
        position: relative;
      }

      .track-hud-overlay {
        background: transparent;
        border: 0;
        border-radius: 16px;
        height: calc(100% - 24px);
        max-width: 380px;
        min-height: 320px;
        pointer-events: none;
        position: absolute;
        right: 12px;
        top: 12px;
        width: min(38%, 380px);
        z-index: 3;
      }

      .track-hud-overlay.hidden {
        display: none;
      }

      .mission-status-strip {
        align-items: center;
        background: linear-gradient(135deg, rgba(15, 106, 85, 0.14), rgba(36, 107, 147, 0.11));
        border: 1px solid var(--line);
        border-radius: 10px;
        display: grid;
        gap: 8px;
        grid-template-columns: minmax(86px, auto) minmax(0, 1fr) minmax(120px, auto);
        margin: 12px 0 8px;
        overflow: auto;
        padding: 8px 10px;
        scrollbar-width: thin;
      }

      .mission-status-strip strong,
      .mission-status-strip span {
        overflow: auto;
        scrollbar-width: thin;
        white-space: nowrap;
      }

      .mission-status-strip .source {
        color: var(--muted);
        text-align: right;
      }

      .mission-status-strip.override {
        border-color: rgba(255, 77, 255, 0.55);
      }

      .inspector-row {
        align-items: start;
        border-top: 1px solid var(--line);
        display: grid;
        gap: 6px;
        grid-template-columns: minmax(82px, 0.9fr) minmax(0, 1.1fr);
        padding-top: 6px;
      }

      .inspector-row:first-child {
        border-top: 0;
        padding-top: 0;
      }

      .inspector-row small {
        color: var(--muted);
        grid-column: 1 / -1;
      }

      .mini-list {
        display: flex;
        flex-wrap: nowrap;
        gap: 5px;
        margin-top: 7px;
        overflow: auto;
        scrollbar-width: thin;
      }

      .mini-list code {
        font-size: calc(11px * var(--font-scale));
      }

      .inspector-collapsed .inspector-body {
        display: none;
      }

      .inspector-card.chain-collapsed .chain-body {
        display: none;
      }

      .chain-body {
        max-height: 360px;
        overflow: auto;
        padding-top: 8px;
        scrollbar-width: thin;
      }

      .inspector-row strong,
      .inspector-row span,
      .inspector-row small,
      .kv strong,
      .mini-list {
        overflow: auto;
        scrollbar-width: thin;
      }

      .inspector-row strong,
      .inspector-row span,
      .inspector-row small {
        white-space: nowrap;
      }

      .status-pill {
        border-radius: 999px;
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        margin-left: 4px;
        padding: 2px 6px;
        text-transform: uppercase;
      }

      .status-direct { background: rgba(15, 106, 85, 0.14); color: var(--green); }
      .status-derived { background: rgba(154, 107, 22, 0.18); color: var(--gold); }
      .status-missing { background: rgba(161, 61, 49, 0.14); color: var(--red); }

      .custom-controls label {
        display: grid;
        gap: 4px;
      }

      .wp-button {
        border-radius: 6px;
        padding: 4px 7px;
        text-align: left;
      }

      .wp-button.active {
        background: var(--gold);
        border-color: var(--gold);
        color: #1d1404;
      }

      .legend label {
        align-items: center;
        display: inline-flex;
        gap: 5px;
      }

      .swatch {
        border-radius: 2px;
        display: inline-block;
        height: 10px;
        width: 10px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 7px 4px;
        text-align: left;
        vertical-align: top;
      }

      th {
        color: var(--ink);
      }

      .stack {
        display: grid;
        gap: 10px;
        align-content: start;
      }

      .note {
        background: var(--soft);
        border-radius: 8px;
        padding: 10px;
        font-size: 13px;
      }

      .error {
        color: var(--red);
        background: #fff4f0;
        border: 1px solid #e6beb5;
        border-radius: 8px;
        padding: 12px;
      }


      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #edf4ef;
          --muted: #b7c6bd;
          --soft: #1d2a24;
          --paper: #0e1512;
          --panel: #121d18;
          --line: #32443b;
          --green: #44d0a8;
          --blue: #73c7f1;
          --red: #ff9387;
          --gold: #f2c36b;
          --violet: #c5b0ff;
          --shadow: 0 18px 52px rgba(0, 0, 0, 0.28);
          --canvas: #101914;
          --mode-text: #f7fff9;
          --mode-auto: rgba(245, 158, 11, 0.46);
          --mode-stabilize: rgba(56, 189, 248, 0.36);
          --mode-manual: rgba(248, 113, 113, 0.36);
          --mode-other: rgba(167, 139, 250, 0.34);
          --zero-line: rgba(255, 147, 135, 0.82);
          --mode-transition: rgba(247, 255, 249, 0.62);
          --custom-h-ref: rgba(242, 195, 107, 0.92);
          --custom-time-ref: rgba(115, 199, 241, 0.92);
          --inspector-time: rgba(68, 208, 168, 0.96);
        }

        body {
          background:
            radial-gradient(circle at 8% 0%, rgba(68, 208, 168, 0.14), transparent 28%),
            linear-gradient(120deg, rgba(115, 199, 241, 0.1), transparent 36%),
            linear-gradient(315deg, rgba(242, 195, 107, 0.12), transparent 40%),
            var(--paper);
        }

        header,
        .control-strip,
        .metric,
        .notice,
        .toolbar,
        .layer,
        .readout {
          background: rgba(18, 29, 24, 0.94);
        }

        button {
          background: #17241e;
          color: var(--ink);
        }
      }

      @media (max-width: 860px) {
        main {
          grid-template-columns: 1fr;
        }

        main.controls-collapsed {
          grid-template-columns: 1fr;
        }

        main.controls-collapsed .control-strip {
          flex-direction: row;
          justify-content: space-between;
          min-height: 0;
        }

        main.controls-collapsed .control-title {
          writing-mode: horizontal-tb;
        }

        .control-panel {
          max-height: none;
          overflow: visible;
          position: static;
        }

        .layer-head,
        .layer-body {
          display: grid;
          grid-template-columns: 1fr;
        }

        .track-3d-stage .readout {
          position: static;
          max-width: none;
        }

        .track-hud-overlay {
          position: static;
          width: 100%;
          max-width: none;
          height: 320px;
        }

        .playback-dock {
          grid-template-columns: 1fr;
          position: static;
        }

        .parameter-header,
        .parameter-filterbar {
          align-items: stretch;
          display: grid;
          grid-template-columns: 1fr;
        }

        .parameter-header select,
        .parameter-search input {
          min-width: 0;
          width: 100%;
        }

        .parameter-summary {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .panel + .panel {
          border-left: 0;
          border-top: 1px solid var(--line);
          padding-left: 0;
          padding-top: 14px;
        }

        canvas {
          height: 320px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <aside class="control-panel">
        <div class="control-strip"><span class="control-title">Controls</span><button id="toggle-controls" aria-label="收起控制栏" title="收起控制栏">Hide</button></div>
        <header>
          <h1>Flight Log Viewer</h1>
          <p>按控制层级查看日志、任务、参数和输出。</p>
        </header>
        <div class="metrics" id="metrics"></div>
        <div id="timeline-toolbar"></div>
        <div id="time-inspector"></div>
      </aside>
      <section class="viewer-panel">
        <nav class="view-tabs" aria-label="Viewer mode">
          <button class="active" data-view-mode="review">Review</button>
          <button data-view-mode="parameters">Parameters</button>
        </nav>
        <div id="app" class="app-view" data-app-view="review"></div>
        <div id="parameter-app" class="app-view" data-app-view="parameters" hidden></div>
      </section>
    </main>

    <script src="js/mission-playback.js"></script>
    <script src="js/playback-controller.js"></script>
    <script src="js/hud-session.js"></script>
    <script src="js/parameter-model.js"></script>
    <script src="js/parameter-view.js"></script>
    <script src="js/track-camera.js"></script>
    <script src="js/track-hud.js"></script>
    <script>
      const colors = {
        green: "#0f6a55",
        blue: "#246b93",
        red: "#a13d31",
        gold: "#9a6b16",
        violet: "#67509a",
        gray: "#7b8780",
        teal: "#12806a",
      };

      const fmt = new Intl.NumberFormat("en-US", { maximumFractionDigits: 3 });
      const motionMessageNames = [
        "IMU", "IMU2", "IMU3", "ACC", "ACC2", "ACC3", "GYR", "GYR2", "GYR3", "VIBE", "RATE",
        "XKF0", "XKF1", "XKF2", "XKF3", "XKF4", "XKF5", "XKFD", "XKFM", "XKFS", "XKT", "XKTV", "XKV1", "XKV2", "XKY0", "XKY1",
        "NKF0", "NKF1", "NKF2", "NKF3", "NKF4", "NKF5",
      ];
      const missionMessageNames = ["CMD", "MISE", "MAVC", "EV", "TERR", "ORGN"];
      const mavCmdNames = {
        16: "NAV_WAYPOINT",
        17: "NAV_LOITER_UNLIM",
        18: "NAV_LOITER_TURNS",
        19: "NAV_LOITER_TIME",
        20: "NAV_RETURN_TO_LAUNCH",
        21: "NAV_LAND",
        22: "NAV_TAKEOFF",
        82: "NAV_SPLINE_WAYPOINT",
        177: "DO_JUMP",
        178: "DO_CHANGE_SPEED",
        183: "DO_SET_SERVO",
        184: "DO_REPEAT_SERVO",
        189: "CONDITION_DISTANCE",
        201: "DO_SET_ROI",
        206: "DO_SET_CAM_TRIGG_DIST",
        600: "DO_SET_RESUME_REPEAT_DIST",
      };
      const state = {
        fullRange: { start: 0, end: 1 },
        range: { start: 0, end: 1 },
        activeMode: "all",
        hidden: {},
        hover: {},
        pinned: {},
        hRefs: {},
        timeRefs: [],
        highlightedWaypointIndex: null,
        highlightedWaypointRouteKey: null,
        trackPathMode: "window",
        trackModeFilter: "all",
        trackShowPath: true,
        trackShowWaypoints: true,
        trackMarkerScope: "window",
        trackHudVisible: true,
        activeView: "review",
        missionSourceMode: "auto",
        missionOverrideStart: "",
        missionOverrideEnd: "",
        missionOverrideSeq: "",
        localMissionOverrideRules: [],
        missionRouteVisibility: {},
        missionRouteViewMode: "current",
        inspectorTime: null,
        inspectorCollapsed: false,
        inspectorChainCollapsed: {},
        fontScale: "normal",
        parameterSourceMode: "auto",
        track3dView: { yaw: -0.72, pitch: -0.55, scale: null, panX: 0, panY: 0, userScaled: false },
        track3dOverheadLock: true,
        track3dViewMode: "free",
        track3dFixedView: { yaw: -0.72, pitch: -0.55 },
        track3dAircraftViewOffset: { yaw: 0, pitch: -0.55 },
        track3dTrackViewOffset: { yaw: 0, pitch: -0.55 },
        dragging: null,
        pinch: null,
        skipClick: null,
      };
      const charts = new Map();
      let modeData = { segments: [] };
      let missionSourceData = { sources: [] };
      let currentTaskData = { sources: [] };
      let missionOverrideData = { rules: [] };
      let inspectorContext = null;
      const playbackController = PlaybackController.create({
        getBounds: () => trackMarkerBounds(),
        getFallbackTime: () => state.range.end,
        onTime: (snapshot) => {
          syncTrackInspector(snapshot.time);
          renderAllCharts();
        },
        onState: () => updatePlaybackControls(),
      });
      const hudSession = HudSession.create({
        onCommand: (command, value) => {
          if (command === "toggle") toggleTrackPlayback();
          else if (command === "play") startTrackPlayback();
          else if (command === "pause") stopTrackPlayback();
          else if (command === "time") setTrackMarkerTime(value);
          else if (command === "speed") playbackController.setSpeed(value);
        },
      });

      async function loadJson(path) {
        const response = await fetch(path);
        if (!response.ok) throw new Error(`${path} not found`);
        return response.json();
      }

      async function loadJsonOptional(path) {
        try {
          return await loadJson(path);
        } catch (_error) {
          return null;
        }
      }

      function defaultSummary() {
        return {
          counts: { files: 0, parameters: 0, control_parameters: 0, waypoints: 0 },
          files: [],
          selected_files: { param: null, waypoints: null, bin_logs: [], tlogs: [], rlogs: [] },
          duplicate_groups: {},
          control_params: {},
          parameter_sets: {},
          dataflash_param_timeline: [],
          parameter_sources: {},
          waypoints: [],
        };
      }

      function withMessages(data, names) {
        const messages = {};
        for (const name of names) messages[name] = data?.messages?.[name] || [];
        return { source_file: data?.source_file || null, messages };
      }

      function defaultManifest() {
        return {
          source: { source_file: null, target_counts: {}, time_range: null },
          compatibility: { log_firmware: null, parser_schema: "not loaded", mode_map_source: "not loaded", explanation_source: "not loaded", notes: [] },
          groups: {},
        };
      }

      function extentBy(items, getter) {
        let min = Infinity;
        let max = -Infinity;
        let count = 0;
        for (const item of items) {
          const value = Number(getter(item));
          if (!finite(value)) continue;
          if (value < min) min = value;
          if (value > max) max = value;
          count += 1;
        }
        return count ? { min, max, count } : null;
      }

      function rangeFromLoadedGroups(groups) {
        let start = Infinity;
        let end = -Infinity;
        let count = 0;
        for (const group of groups) {
          for (const rows of Object.values(group.messages || {})) {
            for (const row of rows) {
              const time = Number(row.time_s);
              if (!finite(time)) continue;
              if (time < start) start = time;
              if (time > end) end = time;
              count += 1;
            }
          }
        }
        if (!count) return { start_s: 0, end_s: 1 };
        return start === end ? { start_s: start, end_s: start + 1 } : { start_s: start, end_s: end };
      }

      function metric(label, value) {
        return `<div class="metric"><p>${label}</p><strong title="${escapeHtml(value)}">${escapeHtml(value)}</strong></div>`;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      const layerParameterMap = {
        l1: [
          ["NAVL1_PERIOD", "turn scale"],
          ["NAVL1_DAMPING", "damping"],
          ["NAVL1_XTRACK_I", "xtrack I"],
          ["NAVL1_LIM_BANK", "bank limit"],
          ["ROLL_LIMIT_DEG", "roll cap"],
        ],
        tecs: [
          ["TECS_TIME_CONST", "response"],
          ["TECS_SPDWEIGHT", "speed/height"],
          ["TECS_RLL2THR", "turn throttle"],
          ["TECS_CLMB_MAX", "climb"],
          ["TECS_SINK_MIN", "sink min"],
          ["TECS_SINK_MAX", "sink max"],
          ["THR_MIN", "thr min"],
          ["THR_MAX", "thr max"],
          ["ARSPD_USE", "airspeed"],
        ],
        attitude: [
          ["RLL2SRV_TCONST", "roll time"],
          ["RLL2SRV_RMAX", "roll rate cap"],
          ["RLL2SRV_ANGLE_P", "roll angle P"],
          ["RLL_RATE_P", "roll P"],
          ["RLL_RATE_I", "roll I"],
          ["RLL_RATE_D", "roll D"],
          ["PTCH2SRV_TCONST", "pitch time"],
          ["PTCH_RATE_P", "pitch P"],
          ["PTCH_RATE_I", "pitch I"],
          ["PTCH_RATE_D", "pitch D"],
          ["SCALING_SPEED", "speed scale"],
        ],
        io: [
          ["SERVO1_FUNCTION", "C1 func"],
          ["SERVO2_FUNCTION", "C2 func"],
          ["SERVO3_FUNCTION", "C3 func"],
          ["SERVO4_FUNCTION", "C4 func"],
          ["SERVO1_TRIM", "C1 trim"],
          ["SERVO2_TRIM", "C2 trim"],
          ["SERVO3_TRIM", "C3 trim"],
          ["SERVO4_TRIM", "C4 trim"],
          ["RC1_TRIM", "RC1 trim"],
          ["RC2_TRIM", "RC2 trim"],
          ["RC3_TRIM", "RC3 trim"],
          ["RC4_TRIM", "RC4 trim"],
        ],
        motion: [
          ["INS_ACCEL_FILTER", "accel filter"],
          ["INS_GYRO_FILTER", "gyro filter"],
          ["INS_HNTCH_ENABLE", "harmonic notch"],
          ["INS_NOTCH_ENABLE", "notch"],
          ["EK3_ENABLE", "EKF3"],
          ["EK3_IMU_MASK", "IMU mask"],
          ["AHRS_EKF_TYPE", "AHRS EKF"],
        ],
      };

      const controlChains = [
        {
          title: "AUTO Mission -> L1 -> NavRoll",
          source: "AP_L1_Control::update_waypoint / nav_roll_cd; Plane::navigate; ModeAuto mission update",
          formula: "waypoint geometry + groundspeed + cross-track/bearing error -> lateral acceleration demand -> demanded roll (NavRoll)",
          params: ["NAVL1_PERIOD", "NAVL1_DAMPING", "NAVL1_XTRACK_I", "NAVL1_LIM_BANK", "ROLL_LIMIT_DEG", "STALL_PREVENTION"],
          values: [
            { label: "cross-track error", group: "navigation", message: "NTUN", field: "XT", unit: "m" },
            { label: "waypoint distance", group: "navigation", message: "NTUN", field: "Dist", unit: "m" },
            { label: "ground speed", group: "track", message: "GPS", field: "Spd", unit: "m/s" },
            { label: "demanded roll", group: "navigation", message: "CTUN", field: "NavRoll", unit: "deg" },
            { label: "actual roll", group: "attitude", message: "ATT", field: "Roll", unit: "deg" },
          ],
        },
        {
          title: "NavRoll -> Roll Attitude -> Rate PID",
          source: "Plane::stabilize_roll; AP_RollController / AP_FW_Controller",
          formula: "target roll -> attitude error -> target roll rate -> rate PID(P/I/D/FF) -> aileron demand",
          params: ["RLL2SRV_TCONST", "RLL2SRV_RMAX", "RLL2SRV_ANGLE_P", "RLL_RATE_P", "RLL_RATE_I", "RLL_RATE_D", "RLL_RATE_FF", "SCALING_SPEED"],
          values: [
            { label: "target roll", group: "attitude", message: "ATT", field: "DesRoll", unit: "deg" },
            { label: "actual roll", group: "attitude", message: "ATT", field: "Roll", unit: "deg" },
            { label: "roll error", derive: "att_roll_error", unit: "deg" },
            { label: "PIDR target", group: "pid", message: "PIDR", field: "Tar", unit: "deg/s" },
            { label: "PIDR actual", group: "pid", message: "PIDR", field: "Act", unit: "deg/s" },
            { label: "PIDR output", group: "pid", message: "PIDR", field: "Dmod" },
          ],
        },
        {
          title: "TECS Energy -> Pitch / Throttle",
          source: "AP_TECS::update_pitch_throttle; Plane TECS update path",
          formula: "height + speed energy errors -> throttle total-energy control and pitch energy-balance control",
          params: ["TECS_TIME_CONST", "TECS_SPDWEIGHT", "TECS_RLL2THR", "TECS_INTEG_GAIN", "TECS_CLMB_MAX", "TECS_SINK_MIN", "TECS_SINK_MAX", "TECS_PITCH_MAX", "TECS_PITCH_MIN", "PTCH_LIM_MAX_DEG", "PTCH_LIM_MIN_DEG", "THR_MIN", "THR_MAX", "ARSPD_USE", "ARSPD_FBW_MIN", "ARSPD_FBW_MAX"],
          values: [
            { label: "height demand", group: "tecs", message: "TECS", field: "hdem", unit: "m" },
            { label: "height", group: "tecs", message: "TECS", field: "h", unit: "m" },
            { label: "speed demand", group: "tecs", message: "TECS", field: "spdem", unit: "m/s" },
            { label: "speed", group: "tecs", message: "TECS", field: "sp", unit: "m/s" },
            { label: "throttle demand", group: "tecs", message: "TECS", field: "th" },
            { label: "pitch demand", group: "tecs", message: "TECS", field: "ph", unit: "deg" },
            { label: "airspeed", group: "tecs", message: "ARSP", field: "Airspeed", unit: "m/s" },
          ],
        },
        {
          title: "PID / Mixer -> RCOU / SERVO",
          source: "SRV_Channel output mixer and SERVO*_FUNCTION mapping",
          formula: "controller demands + trims/limits + servo function mapping -> PWM output channels",
          params: ["SERVO1_FUNCTION", "SERVO2_FUNCTION", "SERVO3_FUNCTION", "SERVO4_FUNCTION", "SERVO1_TRIM", "SERVO2_TRIM", "SERVO3_TRIM", "SERVO4_TRIM", "RC1_TRIM", "RC2_TRIM", "RC3_TRIM", "RC4_TRIM", "KFF_RDDRMIX"],
          values: [
            { label: "RC input C1", group: "io", message: "RCIN", field: "C1", unit: "us" },
            { label: "RC input C2", group: "io", message: "RCIN", field: "C2", unit: "us" },
            { label: "output C1", group: "io", message: "RCOU", field: "C1", unit: "us" },
            { label: "output C2", group: "io", message: "RCOU", field: "C2", unit: "us" },
            { label: "output C3", group: "io", message: "RCOU", field: "C3", unit: "us" },
            { label: "output C4", group: "io", message: "RCOU", field: "C4", unit: "us" },
          ],
        },
        {
          title: "IMU / VIBE / EKF -> Motion State",
          source: "AP_InertialSensor logging; EKF XKF* estimator state",
          formula: "raw/scaled IMU acceleration + gyro + estimator states -> attitude, velocity, vibration and health interpretation",
          params: ["INS_GYRO_FILTER", "INS_ACCEL_FILTER", "INS_HNTCH_ENABLE", "INS_NOTCH_ENABLE", "EK3_ENABLE", "EK3_IMU_MASK", "AHRS_EKF_TYPE", "VIBE_ENABLE"],
          values: [
            { label: "body accel X", group: "motion", message: "IMU", field: "AccX", unit: "m/s^2" },
            { label: "body accel Y", group: "motion", message: "IMU", field: "AccY", unit: "m/s^2" },
            { label: "body accel Z", group: "motion", message: "IMU", field: "AccZ", unit: "m/s^2" },
            { label: "accel magnitude", derive: "accel_magnitude", unit: "m/s^2" },
            { label: "gyro X", group: "motion", message: "IMU", field: "GyrX", unit: "rad/s" },
            { label: "vibration X", group: "motion", message: "VIBE", field: "VibeX" },
            { label: "EKF velocity north", group: "motion", message: "XKF1", field: "VN", unit: "m/s" },
            { label: "EKF velocity down", group: "motion", message: "XKF1", field: "VD", unit: "m/s" },
          ],
        },
      ];

      function statusPill(status) {
        return `<span class="status-pill status-${status}">${status}</span>`;
      }

      function findModeAt(time) {
        return (modeData.segments || []).find((segment) => time >= segment.start_s && time <= segment.end_s) || null;
      }

      function commandName(commandId) {
        const id = Number(commandId);
        return mavCmdNames[id] || `MAV_CMD_${finite(id) ? id : "?"}`;
      }

      function previousRow(rows, time) {
        if (!Array.isArray(rows) || !rows.length || !finite(time)) return null;
        let candidate = null;
        for (const row of rows) {
          const rowTime = Number(row.time_s);
          if (!finite(rowTime)) continue;
          if (rowTime <= time) candidate = row;
          else break;
        }
        return candidate;
      }

      function missionStorageKey() {
        return "flight-log-viewer:mission-overrides:v1";
      }

      function loadLocalMissionOverrides() {
        try {
          const raw = localStorage.getItem(missionStorageKey());
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed?.rules) ? parsed.rules : [];
        } catch (_error) {
          return [];
        }
      }

      function saveLocalMissionOverrides() {
        try {
          localStorage.setItem(missionStorageKey(), JSON.stringify({ schema_version: 1, rules: state.localMissionOverrideRules }));
        } catch (_error) {
          // Local storage can be unavailable in restricted browser modes; the in-memory rules still work.
        }
      }

      let missionPlaybackCache = null;

      function missionPlaybackModel() {
        const cacheKey = [missionSourceData, currentTaskData, missionOverrideData, state.localMissionOverrideRules, state.missionSourceMode];
        if (missionPlaybackCache?.key.every((value, index) => value === cacheKey[index])) return missionPlaybackCache.model;
        const model = MissionPlayback.createModel({
          missionData: missionSourceData,
          currentTaskData,
          overrideData: missionOverrideData,
          localOverrideRules: state.localMissionOverrideRules,
          sourceMode: state.missionSourceMode,
          formatNumber: (value) => fmt.format(value),
          commandName,
          validGeo,
        });
        missionPlaybackCache = { key: cacheKey, model };
        return model;
      }

      function missionSources() {
        return missionPlaybackModel().sources;
      }

      function missionSourceItems(source) {
        return missionPlaybackModel().source.items(source);
      }

      function missionRouteEntries(source) {
        return missionPlaybackModel().route.entries(source);
      }

      function missionRouteEntryAt(source, time) {
        return missionPlaybackModel().route.at(source, time);
      }

      function missionRouteLabel(entry) {
        return missionPlaybackModel().route.label(entry);
      }

      function missionRouteVisibilityMode(entry) {
        return state.missionRouteVisibility?.[entry?.key] || "auto";
      }

      function missionRouteVisible(entry, activeKey) {
        const mode = missionRouteVisibilityMode(entry);
        if (mode === "hide") return false;
        if (state.missionRouteViewMode === "all") return true;
        return entry?.key === activeKey;
      }

      function visibleMissionRouteEntries(source, time) {
        const active = missionRouteEntryAt(source, time);
        const activeKey = active?.key || null;
        return missionRouteEntries(source).filter((entry) => missionRouteVisible(entry, activeKey));
      }

      function missionRouteReadout(time = trackMarkerTime()) {
        const source = selectedMissionSource(time);
        const active = missionRouteEntryAt(source, time);
        const visible = visibleMissionRouteEntries(source, time);
        return active ? `${missionRouteLabel(active)} | ${state.missionRouteViewMode} | visible ${visible.length}` : "route missing";
      }

      function missionWaypointRowsForEntry(entry, activeKey) {
        return (entry?.items || [])
          .map((item) => ({ ...waypointRowFromMissionItem(item), _routeKey: entry.key, _routeLabel: missionRouteLabel(entry), _routeActive: entry.key === activeKey }))
          .filter((row) => validGeo(Number(row.lat), Number(row.lon)));
      }

      function sourceHasItems(source) {
        return missionPlaybackModel().source.hasItems(source);
      }

      function autoMissionSource() {
        return missionPlaybackModel().selection.auto();
      }

      function allMissionOverrideRules() {
        return missionPlaybackModel().selection.rules();
      }

      function missionOverrideAt(time) {
        return missionPlaybackModel().selection.overrideAt(time);
      }

      function selectedMissionSource(time = trackMarkerTime()) {
        return missionPlaybackModel().selection.sourceAt(time);
      }

      function missionNumber(value) {
        return MissionPlayback.missionNumber(value);
      }

      function missionVersionAt(source, time) {
        return missionPlaybackModel().route.versionAt(source, time);
      }

      function missionItemBySeq(source, seq, time = trackMarkerTime()) {
        return missionPlaybackModel().route.itemBySeq(source, seq, time);
      }

      function missionInfoAt(time) {
        return missionPlaybackModel().taskAt(time, findModeAt(time));
      }

      function waypointRowFromMissionItem(item) {
        return {
          index: item.seq,
          current: item.current ?? 0,
          frame: item.frame ?? 0,
          command: item.command,
          command_name: item.command_name || commandName(item.command),
          param1: item.params?.[0] ?? 0,
          param2: item.params?.[1] ?? 0,
          param3: item.params?.[2] ?? 0,
          param4: item.params?.[3] ?? 0,
          lat: item.lat,
          lon: item.lon,
          alt: item.alt,
          autocontinue: item.autocontinue ?? 0,
        };
      }

      function activeMissionWaypointRows(time = trackMarkerTime()) {
        const source = selectedMissionSource(time);
        const active = missionRouteEntryAt(source, time);
        const visibleEntries = visibleMissionRouteEntries(source, time);
        const rows = visibleEntries.flatMap((entry) => missionWaypointRowsForEntry(entry, active?.key || null));
        if (rows.length || active) return rows;
        return inspectorContext?.summary?.waypoints || [];
      }

      function currentNavigationSeq(time = trackMarkerTime()) {
        return missionPlaybackModel().currentSeqAt(time, findModeAt(time));
      }

      function waypointHighlightMatches(row) {
        if (Number(row?.index) !== state.highlightedWaypointIndex) return false;
        const routeKey = row?._routeKey || "";
        return state.highlightedWaypointRouteKey ? routeKey === state.highlightedWaypointRouteKey : true;
      }

      function trackWaypointPanelHtml(time = trackMarkerTime()) {
        const source = selectedMissionSource(time);
        const version = missionVersionAt(source, time);
        const currentSeq = currentNavigationSeq(time);
        const rows = activeMissionWaypointRows(time);
        const sourceLabel = source?.label || "summary waypoint fallback";
        const activeRoute = missionRouteEntryAt(source, time);
        const visibleRoutes = visibleMissionRouteEntries(source, time);
        const routeText = activeRoute ? `${missionRouteLabel(activeRoute)} | visible routes ${visibleRoutes.length}` : (version ? `version ${fmt.format(version.start_s)}s${missionNumber(version.end_s) !== null ? ".." + fmt.format(version.end_s) + "s" : "..end"}` : "static route");
        return `<div id="track-waypoint-panel">
          <div class="note">${escapeHtml(sourceLabel)} | ${escapeHtml(routeText)} | current seq ${currentSeq === null ? "missing" : escapeHtml(currentSeq)}</div>
          <div class="table-scroll">${table(rows, [
            { key: "_routeLabel", label: "Route", html: (row) => `${row._routeActive ? statusPill("direct") : ""}${escapeHtml(row._routeLabel || "summary")}` },
            { key: "index", label: "#", html: (row) => `${row._routeActive && Number(row.index) === currentSeq ? statusPill("direct") : ""}${escapeHtml(row.index ?? "")}` },
            { key: "command_name", label: "Command", html: (row) => `<button class="wp-button ${waypointHighlightMatches(row) ? "active" : ""}" data-wp-index="${escapeHtml(row.index)}" data-wp-route-key="${escapeHtml(row._routeKey || "")}">${escapeHtml(row.command_name)}</button>` },
            { key: "lat", label: "Lat", format: (value) => fmt.format(value) },
            { key: "lon", label: "Lon", format: (value) => fmt.format(value) },
            { key: "alt", label: "Alt", format: (value) => fmt.format(value) },
          ], null)}</div>
        </div>`;
      }

      function currentMissionDisplayTime() {
        return finite(state.inspectorTime) ? state.inspectorTime : trackMarkerTime();
      }

      function missionOverrideStartValue() {
        return state.missionOverrideStart === "" ? fmt.format(currentMissionDisplayTime()) : state.missionOverrideStart;
      }

      function missionOverrideEndValue() {
        const current = currentMissionDisplayTime();
        const fallback = state.range.end > current ? state.range.end : current;
        return state.missionOverrideEnd === "" ? fmt.format(fallback) : state.missionOverrideEnd;
      }

      function missionSourceOptionsHtml() {
        const options = [`<option value="auto" ${state.missionSourceMode === "auto" ? "selected" : ""}>Auto suggestion</option>`];
        for (const source of missionSources()) {
          const disabled = sourceHasItems(source) ? "" : " disabled";
          const selected = state.missionSourceMode === source.id ? " selected" : "";
          options.push(`<option value="${escapeHtml(source.id)}"${selected}${disabled}>${escapeHtml(source.label)} (${missionSourceItems(source).length || 0})</option>`);
        }
        return options.join("");
      }

      function nextMissionRouteVisibilityMode(current) {
        return current === "hide" ? "auto" : "hide";
      }

      function missionRouteControlsHtml(time = trackMarkerTime()) {
        const source = selectedMissionSource(time);
        const entries = missionRouteEntries(source);
        if (!entries.length) return `<div class="note">route versions missing</div>`;
        const active = missionRouteEntryAt(source, time);
        const activeKey = active?.key || null;
        const buttons = entries.map((entry) => {
          const mode = missionRouteVisibilityMode(entry);
          const visible = missionRouteVisible(entry, activeKey);
          const stateText = mode === "hide" ? "hidden" : visible ? "visible" : "auto hidden";
          const activeClass = entry.key === activeKey ? " active" : "";
          return `<button class="${activeClass}" data-mission-route-visibility="${escapeHtml(entry.key)}" title="click toggles hide / auto">${escapeHtml(missionRouteLabel(entry))} | ${escapeHtml(stateText)}</button>`;
        }).join("");
        const modeButtons = [["current", "Current"], ["all", "All"]]
          .map(([mode, label]) => `<button class="${state.missionRouteViewMode === mode ? "active" : ""}" data-mission-route-view="${mode}">${label}</button>`)
          .join("");
        return `<div class="track-section-title"><strong>Route versions</strong><span class="range-text">active ${escapeHtml(active ? missionRouteLabel(active) : "none")}</span></div><div class="track-button-row mission-route-row">${modeButtons}${buttons}</div>`;
      }

      function renderMissionTaskCard(time = trackMarkerTime()) {
        const info = missionInfoAt(time);
        const rules = allMissionOverrideRules();
        const override = missionOverrideAt(time);
        const route = missionRouteEntryAt(selectedMissionSource(time), time);
        return `<div class="mission-task-card">
          <div class="kv-grid">
            <div class="kv"><span>task time</span><strong>${fmt.format(time)}s</strong></div>
            <div class="kv"><span>source</span><strong>${escapeHtml(info.source || "missing")}</strong></div>
            <div class="kv"><span>route</span><strong>${escapeHtml(route ? missionRouteLabel(route) : "missing")}</strong></div>
            <div class="kv"><span>current task</span><strong>${escapeHtml(info.label)} ${statusPill(info.status)}</strong></div>
            <div class="kv"><span>target</span><strong title="${escapeHtml(info.params || "")}">${escapeHtml(info.detail || "")}</strong></div>
          </div>
          <div class="track-button-row mission-source-row">
            <label>Source<select id="mission-source-mode">${missionSourceOptionsHtml()}</select></label>
            <label>Start<input id="mission-override-start" type="number" inputmode="decimal" step="0.1" value="${escapeHtml(missionOverrideStartValue())}"></label>
            <label>End<input id="mission-override-end" type="number" inputmode="decimal" step="0.1" value="${escapeHtml(missionOverrideEndValue())}"></label>
            <label>Seq<input id="mission-override-seq" type="number" inputmode="numeric" placeholder="optional" value="${escapeHtml(state.missionOverrideSeq)}"></label>
            <button id="mission-fill-window-override">填入当前窗口</button>
            <button id="mission-add-override">添加覆盖</button>
            <button id="mission-clear-local-overrides">清除本机覆盖</button>
          </div>
          ${missionRouteControlsHtml(time)}
          <div class="note">${override ? `active override: ${fmt.format(override.start_s)}s..${fmt.format(override.end_s)}s source=${escapeHtml(override.source_id || "?")} seq=${escapeHtml(override.seq ?? "source only")}` : "no active manual override"} | local rules ${state.localMissionOverrideRules.length} | file rules ${(missionOverrideData?.rules || []).length}</div>
        </div>`;
      }

      function nearestRow(rows, time) {
        if (!Array.isArray(rows) || !rows.length || !finite(time)) return null;
        let lo = 0;
        let hi = rows.length - 1;
        while (lo < hi) {
          const mid = Math.floor((lo + hi) / 2);
          if (Number(rows[mid].time_s) < time) lo = mid + 1;
          else hi = mid;
        }
        const candidates = [rows[lo - 1], rows[lo], rows[lo + 1]].filter(Boolean);
        return candidates.reduce((best, row) => {
          const distance = Math.abs(Number(row.time_s) - time);
          return !best || distance < best.distance ? { row, distance } : best;
        }, null);
      }

      function sampleLoggedValue(spec, time) {
        const group = inspectorContext?.groups?.[spec.group];
        const rows = group?.messages?.[spec.message] || [];
        const nearest = nearestRow(rows, time);
        if (!nearest || !(spec.field in nearest.row)) {
          return { label: spec.label, status: "missing", value: "missing", source: `${spec.message}.${spec.field}` };
        }
        const value = Number(nearest.row[spec.field]);
        return {
          label: spec.label,
          status: "direct",
          value: finite(value) ? fmt.format(value) : escapeHtml(nearest.row[spec.field]),
          unit: spec.unit || "",
          source: `${spec.message}.${spec.field}`,
          delta: nearest.distance,
        };
      }

      function numericSample(group, message, field, time) {
        const result = sampleLoggedValue({ label: field, group, message, field }, time);
        if (result.status !== "direct") return null;
        return Number(result.value.replaceAll(",", ""));
      }

      function sampleDerivedValue(spec, time) {
        if (spec.derive === "att_roll_error") {
          const target = numericSample("attitude", "ATT", "DesRoll", time);
          const actual = numericSample("attitude", "ATT", "Roll", time);
          if (!finite(target) || !finite(actual)) return { label: spec.label, status: "missing", value: "missing", source: "ATT.DesRoll - ATT.Roll" };
          return { label: spec.label, status: "derived", value: fmt.format(target - actual), unit: spec.unit || "", source: "ATT.DesRoll - ATT.Roll" };
        }
        if (spec.derive === "accel_magnitude") {
          const x = numericSample("motion", "IMU", "AccX", time);
          const y = numericSample("motion", "IMU", "AccY", time);
          const z = numericSample("motion", "IMU", "AccZ", time);
          if (![x, y, z].every(finite)) return { label: spec.label, status: "missing", value: "missing", source: "sqrt(AccX^2 + AccY^2 + AccZ^2)" };
          return { label: spec.label, status: "derived", value: fmt.format(Math.hypot(x, y, z)), unit: spec.unit || "", source: "sqrt(AccX^2 + AccY^2 + AccZ^2)" };
        }
        return { label: spec.label, status: "missing", value: "missing", source: spec.derive || "derived" };
      }

      function sampleValue(spec, time) {
        return spec.derive ? sampleDerivedValue(spec, time) : sampleLoggedValue(spec, time);
      }

      function parameterSourceModes() {
        const summary = inspectorContext?.summary || {};
        const available = summary.parameter_sources?.available || {};
        return [
          ["auto", "Auto / merged", true],
          ["merged", "Merged", available.merged !== false],
          ["param_file", ".param file", !!available.param_file],
          ["dataflash_latest", "DataFlash latest", !!available.dataflash_latest],
          ["dataflash_time", "DataFlash time-aware", !!available.dataflash_time],
        ];
      }

      function parameterSourceOptionsHtml() {
        return parameterSourceModes()
          .map(([mode, label, enabled]) => `<option value="${mode}" ${state.parameterSourceMode === mode ? "selected" : ""}${enabled ? "" : " disabled"}>${label}</option>`)
          .join("");
      }

      function parameterResolveTime() {
        if (finite(state.inspectorTime)) return state.inspectorTime;
        return trackMarkerTime();
      }

      function selectedParameterSet() {
        const summary = inspectorContext?.summary || {};
        const sets = summary.parameter_sets || {};
        const mode = state.parameterSourceMode === "auto" ? "merged" : state.parameterSourceMode;
        if (mode === "dataflash_time") return sets.dataflash_latest || { params: summary.control_params || {}, control_params: summary.control_params || {}, label: "DataFlash time-aware" };
        return sets[mode] || sets.merged || { params: summary.control_params || {}, control_params: summary.control_params || {}, label: "legacy control params" };
      }

      function parameterSourceLabel() {
        if (state.parameterSourceMode === "dataflash_time") return "DataFlash time-aware";
        return selectedParameterSet().label || state.parameterSourceMode;
      }

      function updateParameterSourceText() {
        const node = document.querySelector("#param-source-text");
        if (!node) return;
        const summary = inspectorContext?.summary || {};
        const counts = summary.counts || {};
        const timeText = state.parameterSourceMode === "dataflash_time" ? ` | lookup time ${fmt.format(parameterResolveTime())}s` : "";
        node.textContent = `Parameter source: ${parameterSourceLabel()}${timeText} | file ${counts.file_parameters || 0} | DataFlash ${counts.dataflash_parameters || 0} (${counts.dataflash_parameter_records || 0} records)`;
      }

      function dataflashParamAt(name, time) {
        const timeline = inspectorContext?.summary?.dataflash_param_timeline || [];
        let best = null;
        for (const item of timeline) {
          if (item.name !== name) continue;
          const itemTime = Number(item.time_s);
          if (!finite(itemTime)) continue;
          if (finite(time) && itemTime <= time) best = item;
          else if (!finite(time) && !best) best = item;
          else if (finite(time) && itemTime > time) break;
        }
        return best;
      }

      function resolveParameter(name, time = parameterResolveTime()) {
        if (state.parameterSourceMode === "dataflash_time") {
          const timed = dataflashParamAt(name, time);
          if (timed) return { name, value: timed.value, source: "DataFlash time", time_s: timed.time_s, status: "direct" };
          return { name, value: "missing", source: "DataFlash time", time_s: null, status: "missing" };
        }
        const set = selectedParameterSet();
        const params = set.params || set.control_params || {};
        if (Object.prototype.hasOwnProperty.call(params, name)) {
          return { name, value: params[name], source: set.label || parameterSourceLabel(), time_s: null, status: "direct" };
        }
        return { name, value: "missing", source: set.label || parameterSourceLabel(), time_s: null, status: "missing" };
      }

      function parameterNamesForPrefix(prefix) {
        const names = new Set();
        const set = selectedParameterSet();
        for (const name of Object.keys(set.params || set.control_params || {})) {
          if (name.startsWith(prefix)) names.add(name);
        }
        if (state.parameterSourceMode === "dataflash_time") {
          for (const item of inspectorContext?.summary?.dataflash_param_timeline || []) {
            if (String(item.name || "").startsWith(prefix)) names.add(item.name);
          }
        }
        return [...names].sort();
      }

      function parameterMatches(names, time = parameterResolveTime()) {
        const found = [];
        for (const name of names) {
          if (name.endsWith("*")) {
            const prefix = name.slice(0, -1);
            for (const key of parameterNamesForPrefix(prefix)) found.push(resolveParameter(key, time));
          } else {
            const item = resolveParameter(name, time);
            if (item.status !== "missing") found.push(item);
          }
        }
        return found;
      }

      function parameterSourceMetaText(item) {
        const timeText = finite(Number(item.time_s)) ? ` @ ${fmt.format(item.time_s)}s` : "";
        return `${item.source || parameterSourceLabel()}${timeText}`;
      }

      function renderLayerParams(_summary, layerKey) {
        const rows = layerParameterMap[layerKey] || [];
        if (!rows.length) return "";
        const time = parameterResolveTime();
        const body = rows.map(([name, role]) => {
          const item = resolveParameter(name, time);
          const value = item.status === "missing" ? "missing" : item.value;
          const meta = parameterSourceMetaText(item);
          return `<div class="param-row"><code title="${escapeHtml(name)}">${escapeHtml(name)}</code><span title="${escapeHtml(role)} | ${escapeHtml(meta)}">${escapeHtml(value)} · ${escapeHtml(role)} · ${escapeHtml(meta)}</span></div>`;
        }).join("");
        return `<h3>Key params</h3><div class="param-card" data-layer-params="${escapeHtml(layerKey)}"><div class="note">Parameter source: ${escapeHtml(parameterSourceLabel())}${state.parameterSourceMode === "dataflash_time" ? ` | time ${fmt.format(time)}s` : ""}</div>${body}</div>`;
      }

      const renderedHtml = new WeakMap();
      const boundLiveButtons = new WeakSet();

      // Preserve scroll containers, focus and listeners while live values change.
      function syncRenderedNode(node, next) {
        if (node.nodeType !== next.nodeType || node.nodeName !== next.nodeName) {
          node.replaceWith(next.cloneNode(true));
          return;
        }
        if (node.nodeType === Node.TEXT_NODE || node.nodeType === Node.COMMENT_NODE) {
          if (node.nodeValue !== next.nodeValue) node.nodeValue = next.nodeValue;
          return;
        }
        if (node.nodeType === Node.ELEMENT_NODE) {
          for (const attr of [...node.attributes]) {
            if (!next.hasAttribute(attr.name)) node.removeAttribute(attr.name);
          }
          for (const attr of next.attributes) {
            if (attr.name === "value" && node === document.activeElement) continue;
            if (node.getAttribute(attr.name) !== attr.value) node.setAttribute(attr.name, attr.value);
          }
        }
        syncRenderedChildren(node, next);
      }

      function syncRenderedChildren(node, next) {
        const children = [...node.childNodes];
        const desired = [...next.childNodes];
        for (let index = 0; index < Math.max(children.length, desired.length); index += 1) {
          if (!desired[index]) children[index].remove();
          else if (!children[index]) node.appendChild(desired[index].cloneNode(true));
          else syncRenderedNode(children[index], desired[index]);
        }
      }

      function updateRenderedHtml(node, html, outer = false) {
        if (!node || renderedHtml.get(node) === html) return false;
        const template = document.createElement("template");
        template.innerHTML = html;
        if (outer) syncRenderedNode(node, template.content.firstElementChild);
        else syncRenderedChildren(node, template.content);
        renderedHtml.set(node, html);
        return true;
      }

      function bindLiveButton(button, listener) {
        if (!button || boundLiveButtons.has(button)) return;
        boundLiveButtons.add(button);
        button.addEventListener("click", listener);
      }

      function updateLayerParamCards() {
        document.querySelectorAll("[data-layer-params]").forEach((node) => {
          const layerKey = node.dataset.layerParams;
          const html = renderLayerParams(inspectorContext?.summary || {}, layerKey);
          const wrapper = document.createElement("div");
          wrapper.innerHTML = html;
          const next = wrapper.querySelector("[data-layer-params]");
          if (next) syncRenderedNode(node, next);
        });
      }

      function renderParameterList(names, time = parameterResolveTime()) {
        const matches = parameterMatches(names, time);
        if (!matches.length) return `<div class="mini-list">${statusPill("missing")}<code>${escapeHtml(parameterSourceLabel())}</code></div>`;
        return `<div class="mini-list">${matches.slice(0, 8).map((item) => {
          const meta = parameterSourceMetaText(item);
          return `<code title="${escapeHtml(item.name)} = ${escapeHtml(item.value)} | ${escapeHtml(meta)}">${escapeHtml(item.name)}=${escapeHtml(item.value)}</code>`;
        }).join("")}${matches.length > 8 ? `<code>+${matches.length - 8}</code>` : ""}</div>`;
      }

      function renderValueList(values, time) {
        return `<div class="inspector-grid">${values.map((spec) => {
          const item = sampleValue(spec, time);
          const delta = item.delta !== undefined ? `dt ${fmt.format(item.delta)}s` : item.source;
          return `<div class="inspector-row"><strong>${escapeHtml(item.label)} ${statusPill(item.status)}</strong><span>${escapeHtml(item.value)}${item.unit ? ` ${escapeHtml(item.unit)}` : ""}</span><small>${escapeHtml(delta)}</small></div>`;
        }).join("")}</div>`;
      }

      function inspectorToggleLabel() {
        return state.inspectorCollapsed ? "Show" : "Hide";
      }

      function inspectorChainKey(index) {
        return `chain-${index}`;
      }

      function inspectorChainToggleLabel(index) {
        return state.inspectorChainCollapsed[inspectorChainKey(index)] ? "Show" : "Hide";
      }

      function renderInspectorChain(chain, index, time) {
        const key = inspectorChainKey(index);
        const collapsed = state.inspectorChainCollapsed[key];
        return `<div class="inspector-card ${collapsed ? "chain-collapsed" : ""}">
          <div class="inspector-head"><h3>${escapeHtml(chain.title)}</h3><div class="inspector-actions"><button data-toggle-inspector-chain="${key}">${inspectorChainToggleLabel(index)}</button></div></div>
          <div class="chain-body">${renderValueList(chain.values, time)}${renderParameterList(chain.params, time)}</div>
        </div>`;
      }

      function bindInspectorButtons() {
        document.querySelectorAll("[data-toggle-inspector]").forEach((button) => {
          bindLiveButton(button, () => {
            state.inspectorCollapsed = !state.inspectorCollapsed;
            renderInspector();
          });
        });
        document.querySelectorAll("[data-toggle-inspector-chain]").forEach((button) => {
          bindLiveButton(button, () => {
            const key = button.dataset.toggleInspectorChain;
            state.inspectorChainCollapsed[key] = !state.inspectorChainCollapsed[key];
            renderInspector();
          });
        });
        bindLiveButton(document.querySelector("#clear-inspect-inline"), clearInspect);
      }

      function fontScaleLabel() {
        if (state.fontScale === "compact") return "Font: Compact";
        if (state.fontScale === "large") return "Font: Large";
        return "Font: Normal";
      }

      function applyFontScale() {
        document.body.classList.toggle("font-compact", state.fontScale === "compact");
        document.body.classList.toggle("font-large", state.fontScale === "large");
        const button = document.querySelector("#font-scale");
        if (button) button.textContent = fontScaleLabel();
        renderAllCharts();
      }

      function cycleFontScale() {
        state.fontScale = state.fontScale === "normal" ? "large" : state.fontScale === "large" ? "compact" : "normal";
        applyFontScale();
      }

      function renderInspector() {
        const node = document.querySelector("#time-inspector");
        if (!node) return;
        if (!inspectorContext) {
          updateRenderedHtml(node, "");
          return;
        }
        const collapsedClass = state.inspectorCollapsed ? " inspector-collapsed" : "";
        const time = state.inspectorTime;
        if (!finite(time)) {
          updateRenderedHtml(node, `<div class="inspector${collapsedClass}"><div class="inspector-card"><div class="inspector-head"><h3>Inspector</h3><div class="inspector-actions"><button data-toggle-inspector>${inspectorToggleLabel()}</button></div></div><div class="inspector-body"><p>点击图像上的时间点开始检查。</p></div></div></div>`);
          bindInspectorButtons();
          return;
        }
        const mode = findModeAt(time);
        const mission = missionInfoAt(time);
        const modeText = mode ? `${mode.name} ${fmt.format(mode.start_s)}..${fmt.format(mode.end_s)}s` : "unknown";
        updateRenderedHtml(node, `<div class="inspector${collapsedClass}">
          <div class="inspector-card">
            <div class="inspector-head"><h3>Inspector</h3><div class="inspector-actions"><button data-toggle-inspector>${inspectorToggleLabel()}</button><button id="clear-inspect-inline">Clear inspect</button></div></div>
            <div class="inspector-body"><div class="kv-grid">
              <div class="kv"><span>time</span><strong>${fmt.format(time)}s</strong></div>
              <div class="kv"><span>mode</span><strong>${escapeHtml(modeText)}</strong></div>
              <div class="kv"><span>mission</span><strong>${escapeHtml(mission.label)} ${statusPill(mission.status)}</strong></div>
              <div class="kv"><span>mission source</span><strong>${escapeHtml(mission.source || "missing")}</strong></div>
              <div class="kv"><span>target</span><strong title="${escapeHtml(mission.params || "")}">${escapeHtml(mission.detail || "")}</strong></div>
              <div class="kv"><span>selection</span><strong>${escapeHtml(mission.planned || "missing")}</strong></div>
            </div></div>
          </div>
          <div class="inspector-body">${controlChains.map((chain, index) => renderInspectorChain(chain, index, time)).join("")}</div>
        </div>`);
        bindInspectorButtons();
      }

      function clearInspect() {
        state.inspectorTime = null;
        state.pinned = {};
        state.hover = {};
        renderInspector();
        renderAllCharts();
      }

      function setInspectorTime(time) {
        state.inspectorTime = time;
        renderInspector();
        renderAllCharts();
      }

      function table(rows, columns, limit = 12) {
        const visible = limit === null ? rows : rows.slice(0, limit);
        if (!visible.length) return `<p>No data.</p>`;
        const head = columns.map((column) => `<th>${column.label}</th>`).join("");
        const body = visible
          .map(
            (row) =>
              `<tr>${columns
                .map((column) => `<td>${column.html ? column.html(row) : escapeHtml(column.format ? column.format(row[column.key], row) : (row[column.key] ?? ""))}</td>`)
                .join("")}</tr>`,
          )
          .join("");
        return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
      }

      function layer(index, title, description, chartHtml, sideHtml) {
        return `<section class="layer collapsed" data-layer="${index}">
          <div class="layer-head">
            <div><h2>${title}</h2><p>${description}</p></div>
            <div class="layer-index">Layer ${index}</div>
            <button class="layer-toggle" data-toggle-layer="${index}">展开</button>
          </div>
          <div class="layer-body">
            <div class="panel">${chartHtml}</div>
            <div class="panel stack">${sideHtml}</div>
          </div>
        </section>`;
      }

      function chartPanel(id, small = false) {
        return `<div class="chart-shell ${small ? "small" : ""}">
          <canvas id="${id}" data-chart="${id}"></canvas>
          <div class="readout" id="${id}-readout"></div>
        </div>
        <div class="chart-control-bar">
          <button data-chart-playback-toggle="${id}">Play</button>
          <span class="playback-time" data-chart-playback-time="${id}"></span>
          <button data-scale-reset="${id}">Reset scale</button>
          <button data-scale-in="${id}">Scale +</button>
          <button data-scale-out="${id}">Scale -</button>
          <button data-href-clear="${id}">Clear Y refs</button>
        </div>
        <div class="legend" id="${id}-legend"></div>`;
      }

      function track3dPanel() {
        const id = "track-3d-chart";
        return `<div class="chart-shell track-3d-stage">
          <canvas id="${id}" data-chart="${id}"></canvas>
          <canvas id="track-hud-overlay" class="track-hud-overlay ${state.trackHudVisible ? "" : "hidden"}"></canvas>
          <div class="readout" id="${id}-readout"></div>
        </div>
        <div class="chart-control-bar">
          <button data-chart-playback-toggle="${id}">Play</button>
          <span class="playback-time" data-chart-playback-time="${id}"></span>
          <button data-scale-reset="${id}">Reset 3D</button>
          <button data-scale-in="${id}">Scale +</button>
          <button data-scale-out="${id}">Scale -</button>
          <button data-href-clear="${id}">Clear Y refs</button>
        </div>
        <div class="legend" id="${id}-legend"></div>`;
      }

      function finite(value) {
        return Number.isFinite(value);
      }

      function series(rows, yKey, color, label, xKey = "time_s") {
        return {
          label,
          color,
          points: rows
            .map((row) => ({ x: Number(row[xKey]), y: Number(row[yKey]), row }))
            .filter((point) => finite(point.x) && finite(point.y)),
        };
      }

      function stats(rows, key) {
        const extent = extentBy(rows, (row) => row[key]);
        if (!extent) return "n/a";
        return `${fmt.format(extent.min)}..${fmt.format(extent.max)}`;
      }

      function modeName(row) {
        return row.name || `MODE_${row.mode_num ?? row.ModeNum ?? row.Mode}`;
      }

      function currentSegments() {
        return modeData.segments.filter((segment) => segment.end_s >= state.range.start && segment.start_s <= state.range.end);
      }

      function setRange(start, end, source = "custom") {
        const full = state.fullRange;
        const minWidth = Math.max((full.end - full.start) * 0.002, 0.25);
        let nextStart = Number(start);
        let nextEnd = Number(end);
        if (!finite(nextStart) || !finite(nextEnd) || nextEnd <= nextStart) return;
        if (nextEnd - nextStart < minWidth) {
          const mid = (nextStart + nextEnd) / 2;
          nextStart = mid - minWidth / 2;
          nextEnd = mid + minWidth / 2;
        }
        state.range = { start: nextStart, end: nextEnd };
        updateRangeText(source);
        renderAllCharts();
      }

      function focusMode(name) {
        state.activeMode = name;
        if (name === "all") {
          setRange(state.fullRange.start, state.fullRange.end, "all");
          renderModeButtons();
          return;
        }
        const segments = modeData.segments.filter((segment) => segment.name === name);
        if (!segments.length) return;
        const start = Math.min(...segments.map((segment) => segment.start_s));
        const end = Math.max(...segments.map((segment) => segment.end_s));
        setRange(start, end, name);
        renderModeButtons();
      }

      function updateRangeText(source) {
        const node = document.querySelector("#range-text");
        if (!node) return;
        const modes = [...new Set(currentSegments().map((segment) => segment.name))].join(" / ") || "n/a";
        node.textContent = `${source}: ${fmt.format(state.range.start)}s .. ${fmt.format(state.range.end)}s | modes: ${modes}`;
      }

      function renderModeButtons() {
        const holder = document.querySelector("#mode-buttons");
        if (!holder) return;
        const names = ["all", ...new Set(modeData.segments.map((segment) => segment.name))];
        holder.innerHTML = names
          .map((name) => `<button class="${state.activeMode === name ? "active" : ""}" data-mode="${name}">${name === "all" ? "Whole Flight" : name}</button>`)
          .join("");
        holder.querySelectorAll("button").forEach((button) => {
          button.addEventListener("click", () => focusMode(button.dataset.mode));
        });
      }

      function clamp(value, minValue, maxValue) {
        return Math.max(minValue, Math.min(maxValue, value));
      }

      function trackPathRange() {
        return state.trackPathMode === "full" ? state.fullRange : state.range;
      }

      function trackModeNames() {
        return ["all", ...new Set((modeData.segments || []).map((segment) => segment.name).filter(Boolean))];
      }

      function selectedTrackSegments(baseRange = trackPathRange()) {
        if (state.trackModeFilter === "all") return [{ start_s: baseRange.start, end_s: baseRange.end, name: "all" }];
        return (modeData.segments || [])
          .filter((segment) => segment.name === state.trackModeFilter && segment.end_s >= baseRange.start && segment.start_s <= baseRange.end)
