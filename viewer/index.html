          .map((segment) => ({ ...segment, start_s: Math.max(segment.start_s, baseRange.start), end_s: Math.min(segment.end_s, baseRange.end) }));
      }

      function trackTimeAllowed(time, baseRange = trackPathRange()) {
        if (!finite(time) || time < baseRange.start || time > baseRange.end) return false;
        if (state.trackModeFilter === "all") return true;
        return selectedTrackSegments(baseRange).some((segment) => time >= segment.start_s && time <= segment.end_s);
      }

      function filterTrackPoints(points, baseRange = trackPathRange()) {
        return points.filter((point) => point.kind === "pos" && trackTimeAllowed(point.time_s, baseRange));
      }

      function trackMarkerBounds() {
        const base = state.trackMarkerScope === "full" ? state.fullRange : state.range;
        const segments = selectedTrackSegments(base);
        if (state.trackModeFilter === "all" || !segments.length) return { start: base.start, end: base.end };
        return {
          start: Math.min(...segments.map((segment) => segment.start_s)),
          end: Math.max(...segments.map((segment) => segment.end_s)),
        };
      }

      function trackMarkerTime() {
        return playbackController.time();
      }

      function syncTrackInspector(time) {
        state.inspectorTime = time;
        renderInspector();
      }

      function setTrackMarkerTime(time) {
        return playbackController.setTime(time);
      }

      function stopTrackPlayback() {
        playbackController.pause();
      }

      function trackPlaybackStep(nowMs) {
        playbackController.tick(nowMs);
      }

      function startTrackPlayback() {
        state.missionRouteViewMode = "current";
        playbackController.play();
      }

      function toggleTrackPlayback() {
        if (playbackController.snapshot().playing) stopTrackPlayback();
        else startTrackPlayback();
      }

      function missionStatusStripHtml(time = trackMarkerTime()) {
        const mode = findModeAt(time);
        const mission = missionInfoAt(time);
        const modeText = mode ? `${mode.name} ${fmt.format(mode.start_s)}..${fmt.format(mode.end_s)}s` : "mode missing";
        const taskText = `${mission.label || "mission missing"}${mission.detail ? " | " + mission.detail : ""}`;
        const sourceText = `${mission.source || "source missing"}${mission.override ? " | override" : ""}`;
        return `<div class="mission-status-strip ${mission.override ? "override" : ""}">
          <strong title="${escapeHtml(modeText)}">${escapeHtml(mode?.name || "MODE ?")}</strong>
          <span title="${escapeHtml(taskText)}">${escapeHtml(taskText)} ${statusPill(mission.status)}</span>
          <span class="source" title="${escapeHtml(sourceText)}">${escapeHtml(sourceText)}</span>
        </div>`;
      }

      function playbackDockHtml() {
        const bounds = trackMarkerBounds();
        const span = Math.max(bounds.end - bounds.start, 1);
        const step = Math.max(span / 1200, 0.02);
        const playback = playbackController.snapshot();
        return `<div class="playback-dock">
          <div class="playback-actions">
            <button data-playback-toggle class="${playback.playing ? "active" : ""}">${playback.playing ? "Pause" : "Play"}</button>
            ${[0.25, 0.5, 1, 2, 4, 8].map((speed) => `<button class="${playback.speed === speed ? "active" : ""}" data-track-speed="${speed}">${speed}x</button>`).join("")}
          </div>
          <input id="track-marker-time" aria-label="Playback time" type="range" min="${bounds.start}" max="${bounds.end}" step="${step}" value="${trackMarkerTime()}">
          <span class="playback-time" id="track-marker-text">${fmt.format(trackMarkerTime())}s</span>
        </div>`;
      }

      function trackControlsHtml() {
        const modeButtons = trackModeNames().map((name) => `<button class="${state.trackModeFilter === name ? "active" : ""}" data-track-mode-filter="${escapeHtml(name)}">${name === "all" ? "All modes" : escapeHtml(name)}</button>`).join("");
        const bothVisible = state.trackShowPath && state.trackShowWaypoints;
        const cameraModes = [
          ["free", "自由视角"],
          ["fixed-los", "固定视线跟随"],
          ["aircraft-relative", "飞机相对跟随"],
          ["track-vector", "航迹方向跟随"],
        ].map(([mode, label]) => `<button class="${state.track3dViewMode === mode ? "active" : ""}" data-track-camera-mode="${mode}">${label}</button>`).join("");
        return `<div class="track-controls">
          <div class="track-quickbar">
            <button class="${state.trackShowPath ? "active" : ""}" data-track-visible="path">航迹 ${state.trackShowPath ? "显示" : "隐藏"}</button>
            <button class="${state.trackShowWaypoints ? "active" : ""}" data-track-visible="waypoints">Waypoint ${state.trackShowWaypoints ? "显示" : "隐藏"}</button>
            <button class="${bothVisible ? "active" : ""}" data-track-visible="both">${bothVisible ? "隐藏航迹+Waypoint" : "显示航迹+Waypoint"}</button>
            <button id="track-marker-inspect">Marker=Inspect</button>
            <button id="track-marker-path-end">Marker=Path end</button>
          </div>
          <details class="track-details">
            <summary>Path / flight mode filters</summary>
            <div class="track-details-body">
              <div class="track-section-title"><strong>Path display</strong><span class="range-text" id="track-path-text"></span></div>
              <div class="track-button-row">
                <button class="${state.trackPathMode === "window" ? "active" : ""}" data-track-path-mode="window">显示当前窗口航迹</button>
                <button class="${state.trackPathMode === "full" ? "active" : ""}" data-track-path-mode="full">显示全程航迹</button>
                <button class="${state.trackMarkerScope === "window" ? "active" : ""}" data-track-marker-scope="window">Marker: window</button>
                <button class="${state.trackMarkerScope === "full" ? "active" : ""}" data-track-marker-scope="full">Marker: full</button>
              </div>
              <div class="track-button-row">${modeButtons}</div>
            </div>
          </details>
          <details class="track-details">
            <summary>Mission source / override</summary>
            <div class="track-details-body">${renderMissionTaskCard()}</div>
          </details>
          <details class="track-details">
            <summary>3D camera</summary>
            <div class="track-details-body">
              <div class="track-section-title"><strong>3D camera</strong><span class="range-text" id="track-3d-view-text"></span></div>
              <div class="track-button-row">${cameraModes}</div>
              <div class="track-button-row">
                <button id="track-hud-toggle" class="${state.trackHudVisible ? "active" : ""}">${state.trackHudVisible ? "隐藏 HUD" : "显示 HUD"}</button>
                <button id="track-hud-popout">弹出 HUD</button>
                <button class="${state.track3dOverheadLock ? "active" : ""}" data-track-3d-lock-toggle>俯瞰限制 ${state.track3dOverheadLock ? "开" : "关"}</button>
              </div>
            </div>
          </details>
        </div>`;
      }

      function updatePlaybackControls() {
        const playback = playbackController.snapshot();
        document.querySelectorAll("[data-playback-toggle], [data-chart-playback-toggle]").forEach((button) => {
          button.textContent = playback.playing ? "Pause" : "Play";
          button.classList.toggle("active", playback.playing);
        });
        document.querySelectorAll("[data-chart-playback-time]").forEach((node) => {
          node.textContent = `${fmt.format(playback.time)}s`;
        });
        document.querySelectorAll("[data-track-speed]").forEach((button) => {
          button.classList.toggle("active", Number(button.dataset.trackSpeed) === playback.speed);
        });
        const slider = document.querySelector("#track-marker-time");
        if (slider) {
          slider.min = playback.bounds.start;
          slider.max = playback.bounds.end;
          slider.step = Math.max((playback.bounds.end - playback.bounds.start) / 1200, 0.02);
          if (document.activeElement !== slider) slider.value = playback.time;
        }
        const markerText = document.querySelector("#track-marker-text");
        if (markerText) markerText.textContent = `${fmt.format(playback.time)}s | ${fmt.format(playback.bounds.start)}s..${fmt.format(playback.bounds.end)}s`;
      }

      function updateTrackControls() {
        updatePlaybackControls();
        const marker = trackMarkerTime();
        const pathRange = trackPathRange();
        const pathText = document.querySelector("#track-path-text");
        if (pathText) pathText.textContent = `${state.trackPathMode === "full" ? "Full" : "Window"}: ${fmt.format(pathRange.start)}s..${fmt.format(pathRange.end)}s | ${state.trackModeFilter === "all" ? "all modes" : state.trackModeFilter}`;
        document.querySelectorAll("[data-track-path-mode]").forEach((button) => {
          button.classList.toggle("active", button.dataset.trackPathMode === state.trackPathMode);
        });
        document.querySelectorAll("[data-track-mode-filter]").forEach((button) => {
          button.classList.toggle("active", button.dataset.trackModeFilter === state.trackModeFilter);
        });
        document.querySelectorAll("[data-track-visible]").forEach((button) => {
          if (button.dataset.trackVisible === "path") {
            button.classList.toggle("active", state.trackShowPath);
            button.textContent = `航迹 ${state.trackShowPath ? "显示" : "隐藏"}`;
          } else if (button.dataset.trackVisible === "waypoints") {
            button.classList.toggle("active", state.trackShowWaypoints);
            button.textContent = `Waypoint ${state.trackShowWaypoints ? "显示" : "隐藏"}`;
          } else if (button.dataset.trackVisible === "both") {
            button.classList.toggle("active", state.trackShowPath && state.trackShowWaypoints);
            button.textContent = state.trackShowPath && state.trackShowWaypoints ? "一键隐藏航迹+Waypoint" : "一键显示航迹+Waypoint";
          }
        });
        document.querySelectorAll("[data-track-marker-scope]").forEach((button) => {
          button.classList.toggle("active", button.dataset.trackMarkerScope === state.trackMarkerScope);
        });
        const hudButton = document.querySelector("#track-hud-toggle");
        if (hudButton) {
          hudButton.textContent = state.trackHudVisible ? "隐藏 HUD" : "显示 HUD";
          hudButton.classList.toggle("active", state.trackHudVisible);
        }
        updateRenderedHtml(document.querySelector(".mission-status-strip"), missionStatusStripHtml(marker), true);
        if (updateRenderedHtml(document.querySelector("#track-waypoint-panel"), trackWaypointPanelHtml(marker), true)) {
          bindWaypointButtons();
        }
        updateRenderedHtml(document.querySelector(".mission-task-card"), renderMissionTaskCard(marker), true);
        const sourceSelect = document.querySelector("#mission-source-mode");
        if (sourceSelect && document.activeElement !== sourceSelect) sourceSelect.value = state.missionSourceMode;
        const startInput = document.querySelector("#mission-override-start");
        if (startInput && document.activeElement !== startInput) startInput.value = missionOverrideStartValue();
        const endInput = document.querySelector("#mission-override-end");
        if (endInput && document.activeElement !== endInput) endInput.value = missionOverrideEndValue();
        const seqInput = document.querySelector("#mission-override-seq");
        if (seqInput && document.activeElement !== seqInput) seqInput.value = state.missionOverrideSeq;
        const viewText = document.querySelector("#track-3d-view-text");
        if (viewText) viewText.textContent = `${track3dViewModeLabel(state.track3dViewMode)} | ${state.track3dOverheadLock ? "locked overhead" : "free pitch"}`;
        document.querySelectorAll("[data-track-camera-mode]").forEach((button) => {
          button.classList.toggle("active", button.dataset.trackCameraMode === state.track3dViewMode);
        });
        document.querySelectorAll("[data-track-3d-lock-toggle]").forEach((button) => {
          button.classList.toggle("active", state.track3dOverheadLock);
          button.textContent = `俯瞰限制 ${state.track3dOverheadLock ? "开" : "关"}`;
        });
      }

      function bindTrackControls() {
        const controls = document.querySelector('[data-layer="1"]');
        if (!controls || controls.dataset.bound === "true") return;
        controls.dataset.bound = "true";

        controls.addEventListener("click", (event) => {
          const button = event.target.closest("button");
          if (!button || !controls.contains(button)) return;

          if (button.id === "track-hud-toggle") {
            state.trackHudVisible = !state.trackHudVisible;
            updateTrackControls();
            updateTrackHud();
            return;
          }

          if (button.id === "track-hud-popout") {
            const opened = hudSession.open("hud.html");
            button.textContent = opened ? "HUD 已弹出" : "浏览器阻止了弹窗";
            updateTrackHud();
            return;
          }

          if (button.dataset.trackPathMode) {
            stopTrackPlayback();
            state.trackPathMode = button.dataset.trackPathMode;
            updateTrackControls();
            renderAllCharts();
            return;
          }

          if (button.dataset.trackModeFilter) {
            stopTrackPlayback();
            state.trackModeFilter = button.dataset.trackModeFilter;
            setTrackMarkerTime(trackMarkerTime());
            return;
          }

          if (button.dataset.trackVisible) {
            const target = button.dataset.trackVisible;
            if (target === "path") state.trackShowPath = !state.trackShowPath;
            else if (target === "waypoints") state.trackShowWaypoints = !state.trackShowWaypoints;
            else if (target === "both") {
              const showBoth = !(state.trackShowPath && state.trackShowWaypoints);
              state.trackShowPath = showBoth;
              state.trackShowWaypoints = showBoth;
            }
            renderAllCharts();
            return;
          }

          if (button.dataset.trackMarkerScope) {
            stopTrackPlayback();
            state.trackMarkerScope = button.dataset.trackMarkerScope;
            setTrackMarkerTime(trackMarkerTime());
            return;
          }

          if (button.dataset.trackSpeed) {
            playbackController.setSpeed(button.dataset.trackSpeed);
            return;
          }

          if (button.dataset.trackCameraMode) {
            setTrack3dViewMode(button.dataset.trackCameraMode);
            return;
          }

          if (button.hasAttribute("data-track-3d-lock-toggle")) {
            state.track3dOverheadLock = !state.track3dOverheadLock;
            for (const config of charts.values()) {
              if (config.type === "track3d" && config.view) {
                config.view.pitch = constrainTrack3dPitch(config.view.pitch);
                if (state.track3dOverheadLock) config.view.pitch = snapLockedTrack3dPitch(config.view.pitch);
              }
            }
            state.track3dView.pitch = constrainTrack3dPitch(state.track3dView.pitch);
            if (state.track3dOverheadLock) state.track3dView.pitch = snapLockedTrack3dPitch(state.track3dView.pitch);
            renderAllCharts();
            return;
          }

          if (button.dataset.missionRouteView) {
            state.missionRouteViewMode = button.dataset.missionRouteView === "all" ? "all" : "current";
            renderAllCharts();
            return;
          }

          if (button.dataset.missionRouteVisibility) {
            const key = button.dataset.missionRouteVisibility;
            const current = state.missionRouteVisibility[key] || "auto";
            const next = nextMissionRouteVisibilityMode(current);
            if (next === "auto") delete state.missionRouteVisibility[key];
            else state.missionRouteVisibility[key] = next;
            renderAllCharts();
            return;
          }

          if (button.id === "mission-fill-window-override") {
            state.missionOverrideStart = fmt.format(state.range.start);
            state.missionOverrideEnd = fmt.format(state.range.end);
            updateTrackControls();
            return;
          }

          if (button.id === "mission-add-override") {
            const current = currentMissionDisplayTime();
            const startValue = Number(state.missionOverrideStart === "" ? current : state.missionOverrideStart);
            const endValue = Number(state.missionOverrideEnd === "" ? current : state.missionOverrideEnd);
            const start = Math.min(startValue, endValue);
            const end = Math.max(startValue, endValue);
            const source = selectedMissionSource(start) || autoMissionSource();
            if (source && finite(start) && finite(end)) {
              const seqValue = Number(state.missionOverrideSeq);
              state.localMissionOverrideRules = [...state.localMissionOverrideRules, {
                start_s: start,
                end_s: end,
                source_id: source.id,
                seq: finite(seqValue) ? seqValue : null,
                label: "viewer local override",
              }];
              saveLocalMissionOverrides();
              renderAllCharts();
            }
            return;
          }

          if (button.id === "mission-clear-local-overrides") {
            state.localMissionOverrideRules = [];
            saveLocalMissionOverrides();
            renderAllCharts();
            return;
          }

          if (button.hasAttribute("data-playback-toggle")) {
            toggleTrackPlayback();
            return;
          }

          if (button.id === "track-marker-path-end") {
            stopTrackPlayback();
            setTrackMarkerTime(trackMarkerBounds().end);
            return;
          }

          if (button.id === "track-marker-inspect" && finite(state.inspectorTime)) {
            stopTrackPlayback();
            setTrackMarkerTime(state.inspectorTime);
          }
        });

        controls.addEventListener("change", (event) => {
          if (event.target?.id === "mission-source-mode") {
            state.missionSourceMode = event.target.value || "auto";
            for (const config of charts.values()) {
              if (config.type === "track" || config.type === "track3d") {
                config.projected = null;
                config.projected3d = null;
                config.routeSourceKey = null;
              }
            }
            renderAllCharts();
          }
        });

        controls.addEventListener("input", (event) => {
          if (event.target?.id === "track-marker-time") {
            stopTrackPlayback();
            setTrackMarkerTime(event.target.value);
          } else if (event.target?.id === "mission-override-start") {
            state.missionOverrideStart = event.target.value;
          } else if (event.target?.id === "mission-override-end") {
            state.missionOverrideEnd = event.target.value;
          } else if (event.target?.id === "mission-override-seq") {
            state.missionOverrideSeq = event.target.value;
          }
        });

        updateTrackControls();
      }

      function numericFrom(row, keys) {
        for (const key of keys) {
          const value = Number(row?.[key]);
          if (finite(value)) return value;
        }
        return null;
      }

      function updateTrackHud() {
        const canvas = document.querySelector("#track-hud-overlay");
        if (canvas) canvas.classList.toggle("hidden", !state.trackHudVisible);
        const toggle = document.querySelector("#track-hud-toggle");
        if (toggle) {
          toggle.textContent = state.trackHudVisible ? "隐藏 HUD" : "显示 HUD";
          toggle.classList.toggle("active", state.trackHudVisible);
        }
        const trackConfig = charts.get("track-chart");
        const track3dConfig = charts.get("track-3d-chart");
        if (!trackConfig && !track3dConfig) return;
        const time = trackMarkerTime();
        const posSample = nearestRow(trackConfig?.posRows || track3dConfig?.posRows || [], time);
        const gpsSample = nearestRow(trackConfig?.gpsRows || track3dConfig?.gpsRows || [], time);
        const airSample = nearestRow(trackConfig?.arspRows || track3dConfig?.arspRows || [], time);
        const tecsSample = nearestRow(trackConfig?.tecsRows || track3dConfig?.tecsRows || [], time);
        const navSample = nearestRow(trackConfig?.navRows || track3dConfig?.navRows || [], time);
        const ntunSample = nearestRow(trackConfig?.ntunRows || track3dConfig?.ntunRows || [], time);
        const attSample = nearestRow(track3dConfig?.attitudeRows || trackConfig?.attitudeRows || [], time);
        const pos = posSample?.row || {};
        const gps = gpsSample?.row || {};
        const air = airSample?.row || {};
        const tecs = tecsSample?.row || {};
        const nav = navSample?.row || {};
        const ntun = ntunSample?.row || {};
        const att = attSample?.row || {};
        const mode = findModeAt(time);
        const mission = missionInfoAt(time);
        const values = {
          modeName: mode?.name || "unknown",
          mission,
          roll: numericFrom(att, ["Roll"]),
          pitch: numericFrom(att, ["Pitch"]),
          heading: numericFrom(att, ["Yaw"]) ?? numericFrom(gps, ["GCrs", "Yaw"]),
          targetHeading: numericFrom(att, ["DesYaw"]),
          altitude: numericFrom(pos, ["RelHomeAlt", "Alt", "RelOriginAlt"]),
          targetAltitude: numericFrom(tecs, ["hdem"]),
          groundSpeed: numericFrom(gps, ["Spd"]),
          airSpeed: numericFrom(air, ["Airspeed"]),
          targetSpeed: numericFrom(tecs, ["spdem"]),
          desRoll: numericFrom(att, ["DesRoll"]),
          desPitch: numericFrom(att, ["DesPitch"]),
          navRoll: numericFrom(nav, ["NavRoll"]),
          navPitch: numericFrom(nav, ["NavPitch"]),
          navHeading: numericFrom(ntun, ["NavBrg", "TBrg"]),
        };
        if (canvas && state.trackHudVisible) window.TrackHud?.draw(canvas, values);
        hudSession.publish({ values, playback: playbackController.snapshot() });
      }

      function setActiveView(mode) {
        state.activeView = mode === "parameters" ? "parameters" : "review";
        document.querySelectorAll("[data-view-mode]").forEach((button) => {
          button.classList.toggle("active", button.dataset.viewMode === state.activeView);
        });
        document.querySelectorAll("[data-app-view]").forEach((view) => {
          view.hidden = view.dataset.appView !== state.activeView;
        });
        if (state.activeView === "review") renderAllCharts();
      }

      function bindViewTabs() {
        document.querySelectorAll("[data-view-mode]").forEach((button) => {
          if (button.dataset.bound === "true") return;
          button.dataset.bound = "true";
          button.addEventListener("click", () => setActiveView(button.dataset.viewMode));
        });
        setActiveView(state.activeView);
      }

      function renderToolbar() {
        document.querySelector("#timeline-toolbar").innerHTML = `<div class="toolbar">
          <div class="toolbar-row"><strong>Time / Flight Mode 横轴</strong><span class="range-text" id="range-text"></span></div>

          <div class="chart-actions">
            <button id="zoom-out">Zoom out</button>
            <label>Params<select id="param-source-mode">${parameterSourceOptionsHtml()}</select></label>
            <button id="font-scale">Font: Normal</button>
            <button id="clear-inspect">Clear inspect</button>
            <button id="clear-pins">Clear readouts</button>
            <button id="clear-time-refs">Clear T refs</button>
          </div>
          <div class="range-text" id="param-source-text"></div>
        </div>`;
        renderModeButtons();
        updateRangeText("all");
        updateParameterSourceText();
        document.querySelector("#zoom-out").addEventListener("click", () => focusMode("all"));
        document.querySelector("#param-source-mode").addEventListener("change", (event) => {
          state.parameterSourceMode = event.target.value || "auto";
          updateParameterSourceText();

        });
        document.querySelector("#font-scale").addEventListener("click", cycleFontScale);
        applyFontScale();
        document.querySelector("#clear-inspect").addEventListener("click", clearInspect);
        document.querySelector("#clear-pins").addEventListener("click", () => {

          renderAllCharts();
        });
        document.querySelector("#clear-time-refs").addEventListener("click", () => {

      }

      function yRangeForSeries(seriesList) {
        let minY = Infinity;
        let maxY = -Infinity;
        for (const seriesItem of seriesList) {
          for (const point of seriesItem.points) {
            if (!finite(point.y)) continue;
            minY = Math.min(minY, point.y);
            maxY = Math.max(maxY, point.y);
          }
        }
        if (!finite(minY) || minY === maxY) {
          minY = 0;
          maxY = 1;
        }
        const padY = (maxY - minY) * 0.08 || 1;
        return { minY: minY - padY, maxY: maxY + padY };
      }

      function cloneRange(range) {
        return { minY: range.minY, maxY: range.maxY };
      }

      function resetLineScale(config) {
        config.yView = cloneRange(config.defaultYView || yRangeForSeries(config.series));
      }

      function zoomLineY(config, factor, anchorRatio = 0.5) {
        if (!config.yView) resetLineScale(config);
        const span = config.yView.maxY - config.yView.minY;
        const nextSpan = Math.max(span * factor, 1e-9);
        const anchor = config.yView.maxY - anchorRatio * span;
        config.yView = {
          minY: anchor - (1 - anchorRatio) * nextSpan,
          maxY: anchor + anchorRatio * nextSpan,
        };
      }

      function linePad() {
        return { left: 52, right: 16, top: 38, bottom: 34 };
      }

      function linePlot(rect) {
        const pad = linePad();
        return { pad, plotW: rect.width - pad.left - pad.right, plotH: rect.height - pad.top - pad.bottom };
      }

      function yFromCanvas(config, localY, rect) {
        const { pad, plotH } = linePlot(rect);
        const ratio = (localY - pad.top) / Math.max(1, plotH);
        return config.yView.maxY - ratio * (config.yView.maxY - config.yView.minY);
      }

      function timeFromCanvas(localX, rect) {
        const { pad, plotW } = linePlot(rect);
        const ratio = (localX - pad.left) / Math.max(1, plotW);
        return state.range.start + ratio * (state.range.end - state.range.start);
      }

      function nearestIndexByPixel(values, pixelFn, pixel, threshold = 14) {
        let best = { index: -1, distance: Infinity };
        values.forEach((value, index) => {
          const distance = Math.abs(pixelFn(value) - pixel);
          if (distance < best.distance) best = { index, distance };
        });
        return best.distance <= threshold ? best.index : -1;
      }

      function visibleSeries(config) {
        const hidden = state.hidden[config.id] || {};
        return config.series.filter((seriesItem) => !hidden[seriesItem.label]);
      }

      function downsample(points, max = 1100) {
        if (points.length <= max) return points;
        const step = Math.ceil(points.length / max);
        return points.filter((_, index) => index % step === 0);
      }

      function nearestPoint(config, time) {
        let best = null;
        for (const seriesItem of visibleSeries(config)) {
          let lo = 0;
          let hi = seriesItem.points.length - 1;
          while (lo < hi) {
            const mid = Math.floor((lo + hi) / 2);
            if (seriesItem.points[mid].x < time) lo = mid + 1;
            else hi = mid;
          }
          for (const index of [lo - 1, lo, lo + 1]) {
            const point = seriesItem.points[index];
            if (!point) continue;
            const distance = Math.abs(point.x - time);
            if (!best || distance < best.distance) best = { ...point, label: seriesItem.label, color: seriesItem.color, distance };
          }
        }
        return best;
      }

      function cssVar(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }

      function currentFontScale() {
        return Number(getComputedStyle(document.body).getPropertyValue("--font-scale")) || 1;
      }

      function canvasFont(px) {
        return `${Math.round(px * currentFontScale())}px Avenir Next, sans-serif`;
      }

      function modeFill(name) {
        if (name === "AUTO") return cssVar("--mode-auto");
        if (name === "STABILIZE") return cssVar("--mode-stabilize");
        if (name === "MANUAL") return cssVar("--mode-manual");
        return cssVar("--mode-other");
      }

      function drawZeroLine(ctx, yScale, yRange, pad, plotW) {
        if (yRange.minY > 0 || yRange.maxY < 0) return;
        const y = yScale(0);
        ctx.save();
        ctx.strokeStyle = cssVar("--zero-line");
        ctx.lineWidth = 1.6;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(pad.left + plotW, y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = cssVar("--zero-line");
        ctx.fillText("0", pad.left + 4, y - 5);
        ctx.restore();
      }

      function drawModeTransitions(ctx, chart, pad, plotW, plotH) {
        ctx.save();
        ctx.strokeStyle = cssVar("--mode-transition");
        ctx.fillStyle = cssVar("--mode-text");
        ctx.lineWidth = 1.2;
        ctx.setLineDash([3, 4]);
        ctx.font = canvasFont(11);
        for (const segment of modeData.segments) {
          const time = Number(segment.mode_time_s);
          if (!finite(time) || time < state.range.start || time > state.range.end) continue;
          const x = chart.xScale(time);
          if (x <= pad.left || x >= pad.left + plotW) continue;
          ctx.beginPath();
          ctx.moveTo(x, pad.top);
          ctx.lineTo(x, pad.top + plotH);
          ctx.stroke();
          ctx.save();
          ctx.translate(x + 4, pad.top + 6);
          ctx.rotate(-Math.PI / 2);
          ctx.fillText(segment.name, 0, 0);
          ctx.restore();
        }
        ctx.restore();
      }

      function drawHorizontalRefs(ctx, config, yScale, yRange, pad, plotW) {
        const refs = state.hRefs[config.id] || [];
        if (!refs.length) return;
        ctx.save();
        ctx.strokeStyle = cssVar("--custom-h-ref");
        ctx.fillStyle = cssVar("--custom-h-ref");
        ctx.lineWidth = 1.4;
        ctx.setLineDash([10, 5]);
        ctx.font = canvasFont(12);
        for (const value of refs) {
          if (!finite(value) || value < yRange.minY || value > yRange.maxY) continue;
          const y = yScale(value);
          ctx.beginPath();
          ctx.moveTo(pad.left, y);
          ctx.lineTo(pad.left + plotW, y);
          ctx.stroke();
          ctx.fillText(`Y ${fmt.format(value)}`, pad.left + 8, y - 6);
        }
        ctx.restore();
      }

      function drawInspectorTime(ctx, chart, pad, plotW, plotH) {
        const time = state.inspectorTime;
        if (!finite(time) || time < state.range.start || time > state.range.end) return;
        const x = chart.xScale(time);
        if (x <= pad.left || x >= pad.left + plotW) return;
        ctx.save();
        ctx.strokeStyle = cssVar("--inspector-time");
        ctx.fillStyle = cssVar("--inspector-time");
        ctx.lineWidth = 2;
        ctx.setLineDash([2, 4]);
        ctx.beginPath();
        ctx.moveTo(x, pad.top);
        ctx.lineTo(x, pad.top + plotH);
        ctx.stroke();
        ctx.font = canvasFont(12);
        ctx.fillText(`inspect ${fmt.format(time)}s`, x + 5, pad.top + 14);
        ctx.restore();
      }

      function drawTimeRefs(ctx, chart, pad, plotW, plotH) {
        if (!state.timeRefs.length) return;
        ctx.save();
        ctx.strokeStyle = cssVar("--custom-time-ref");
        ctx.fillStyle = cssVar("--custom-time-ref");
        ctx.lineWidth = 1.5;
        ctx.setLineDash([9, 5]);
        ctx.font = canvasFont(12);
        for (const time of state.timeRefs) {
          if (!finite(time) || time < state.range.start || time > state.range.end) continue;
          const x = chart.xScale(time);
          if (x <= pad.left || x >= pad.left + plotW) continue;
          ctx.beginPath();
          ctx.moveTo(x, pad.top);
          ctx.lineTo(x, pad.top + plotH);
          ctx.stroke();
          ctx.save();
          ctx.translate(x + 4, pad.top + plotH - 8);
          ctx.rotate(-Math.PI / 2);
          ctx.fillText(`T ${fmt.format(time)}s`, 0, 0);
          ctx.restore();
        }
        ctx.restore();
      }

      function drawModeBand(ctx, chart, pad, plotW) {
        const y = pad.top - 22;
        const height = 18;
        ctx.save();
        ctx.font = canvasFont(12);
        for (const segment of currentSegments()) {
          const x0 = chart.xScale(Math.max(segment.start_s, state.range.start));
          const x1 = chart.xScale(Math.min(segment.end_s, state.range.end));
          if (x1 <= pad.left || x0 >= pad.left + plotW) continue;
          ctx.fillStyle = modeFill(segment.name);
          ctx.fillRect(x0, y, Math.max(2, x1 - x0), height);
          ctx.strokeStyle = cssVar("--line");
          ctx.strokeRect(x0, y, Math.max(2, x1 - x0), height);
          if (x1 - x0 > 44) {
            ctx.fillStyle = cssVar("--mode-text");
            ctx.fillText(segment.name, x0 + 5, y + 13);
          }
        }
        ctx.restore();
      }

      function drawLineChart(config) {
        const canvas = document.querySelector(`#${config.id}`);
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = Math.max(1, Math.floor(rect.width * dpr));
        canvas.height = Math.max(1, Math.floor(rect.height * dpr));
        ctx.scale(dpr, dpr);

        const width = rect.width;
        const height = rect.height;
        const pad = linePad();
        const plotW = width - pad.left - pad.right;
        const plotH = height - pad.top - pad.bottom;
        const xStart = state.range.start;
        const xEnd = state.range.end;
        const activeSeries = visibleSeries(config);
        if (!config.yView) resetLineScale(config);
        const yRange = config.yView;
        const xScale = (x) => pad.left + ((x - xStart) / (xEnd - xStart)) * plotW;
        const yScale = (y) => pad.top + (1 - (y - yRange.minY) / (yRange.maxY - yRange.minY)) * plotH;
        config.xScale = xScale;

        ctx.clearRect(0, 0, width, height);
        drawModeBand(ctx, config, pad, plotW);
        ctx.strokeStyle = "#d7ded6";
        ctx.lineWidth = 1;
        ctx.font = canvasFont(12);
        ctx.fillStyle = "#607068";

        for (let i = 0; i <= 4; i++) {
          const y = pad.top + (plotH * i) / 4;
          ctx.beginPath();
          ctx.moveTo(pad.left, y);
          ctx.lineTo(width - pad.right, y);
          ctx.stroke();
          const label = yRange.maxY - ((yRange.maxY - yRange.minY) * i) / 4;
          ctx.fillText(fmt.format(label), 6, y + 4);
        }

        for (let i = 0; i <= 5; i++) {
          const x = pad.left + (plotW * i) / 5;
          const value = xStart + ((xEnd - xStart) * i) / 5;
          ctx.beginPath();
          ctx.moveTo(x, pad.top);
          ctx.lineTo(x, pad.top + plotH);
          ctx.stroke();
          ctx.fillText(fmt.format(value) + "s", x - 15, height - 12);
        }

        if (config.yLabel) ctx.fillText(config.yLabel, 6, 14);
        ctx.fillText("flight mode", pad.left, 14);

        ctx.save();
        ctx.beginPath();
        ctx.rect(pad.left, pad.top, plotW, plotH);
        ctx.clip();
        for (const seriesItem of activeSeries) {
          const points = downsample(seriesItem.points.filter((point) => point.x >= xStart && point.x <= xEnd));
          ctx.strokeStyle = seriesItem.color;
          ctx.lineWidth = seriesItem.width || 1.8;
          ctx.beginPath();
          let started = false;
          for (const point of points) {
            const x = xScale(point.x);
            const y = yScale(point.y);
            if (!started) {
              ctx.moveTo(x, y);
              started = true;
            } else {
              ctx.lineTo(x, y);
            }
          }
          ctx.stroke();
        }
        ctx.restore();

        drawModeTransitions(ctx, config, pad, plotW, plotH);
        drawTimeRefs(ctx, config, pad, plotW, plotH);
        drawInspectorTime(ctx, config, pad, plotW, plotH);
        drawZeroLine(ctx, yScale, yRange, pad, plotW);
        drawHorizontalRefs(ctx, config, yScale, yRange, pad, plotW);

        const marker = state.pinned[config.id] || state.hover[config.id];
        const readout = document.querySelector(`#${config.id}-readout`);
        if (marker) {
          const point = nearestPoint(config, marker.time);
          if (point) {
            const x = xScale(point.x);
            ctx.strokeStyle = "rgba(23, 33, 29, 0.38)";
            ctx.beginPath();
            ctx.moveTo(x, pad.top);
            ctx.lineTo(x, pad.top + plotH);
            ctx.stroke();
            const items = activeSeries.map((seriesItem) => nearestPoint({ ...config, series: [seriesItem] }, point.x)).filter(Boolean);
            for (const item of items) {
              ctx.fillStyle = item.color;
              ctx.beginPath();
              ctx.arc(xScale(item.x), yScale(item.y), 3, 0, Math.PI * 2);
              ctx.fill();
            }
            const mode = currentSegments().find((segment) => point.x >= segment.start_s && point.x <= segment.end_s);
            readout.innerHTML = `${state.pinned[config.id] ? "已锁定" : "悬停"}: ${fmt.format(point.x)}s | ${mode ? mode.name : "MODE?"} | ${items
              .map((item) => `${escapeHtml(item.label)}=${fmt.format(item.y)}`)
              .join(" | ")}`;
          }
        } else {
          readout.textContent = "";
        }
      }

      function validGeo(lat, lon) {
        return finite(lat) && finite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180 && Math.abs(lat) > 1e-6 && Math.abs(lon) > 1e-6;
      }

      function projectTrack(config) {
        if (config.projected) return config.projected;
        const posRaw = config.posRows
          .filter((row) => validGeo(Number(row.Lat), Number(row.Lng)))
          .map((row) => ({ kind: "pos", lat: Number(row.Lat), lon: Number(row.Lng), time_s: Number(row.time_s), row }));
        const refSource = posRaw.length ? posRaw : config.waypointRows
          .filter((row) => validGeo(Number(row.lat), Number(row.lon)))
          .map((row) => ({ lat: Number(row.lat), lon: Number(row.lon) }));
        const refLat = refSource.reduce((sum, point) => sum + point.lat, 0) / Math.max(1, refSource.length);
        const refLon = refSource.reduce((sum, point) => sum + point.lon, 0) / Math.max(1, refSource.length);
        const latScale = 110540;
        const lonScale = 111320 * Math.cos((refLat * Math.PI) / 180);
        const project = (point) => ({
          ...point,
          x: (point.lon - refLon) * lonScale,
          y: (point.lat - refLat) * latScale,
        });
        const projectedPos = posRaw.map(project);
        const posX = extentBy(projectedPos, (point) => point.x);
        const posY = extentBy(projectedPos, (point) => point.y);
        const posBounds = posX && posY ? { minX: posX.min, maxX: posX.max, minY: posY.min, maxY: posY.max } : null;
        const waypointLimitMeters = 3000;
        const projectedWaypoints = config.waypointRows
          .filter((row) => validGeo(Number(row.lat), Number(row.lon)))
          .map((row) => project({ kind: "wp", lat: Number(row.lat), lon: Number(row.lon), row }))
          .filter((point) => !posBounds || (
            point.x >= posBounds.minX - waypointLimitMeters &&
            point.x <= posBounds.maxX + waypointLimitMeters &&
            point.y >= posBounds.minY - waypointLimitMeters &&
            point.y <= posBounds.maxY + waypointLimitMeters
          ));
        config.projected = [...projectedPos, ...projectedWaypoints];
        config.omittedWaypoints = config.waypointRows.length - projectedWaypoints.length;
        return config.projected;
      }

      function fitTrackView(config, plotW, plotH) {
        const points = projectTrack(config);
        if (!points.length) {
          config.mapView = { cx: 0, cy: 0, metersPerPx: 2 };
          config.defaultMapView = { ...config.mapView };
          return;
        }
        const preferred = points.some((point) => point.kind === "pos") ? points.filter((point) => point.kind === "pos") : points.filter((point) => point.kind === "wp");
        const viewPoints = preferred.length ? preferred : points;
        const xExtent = extentBy(viewPoints, (point) => point.x);
        const yExtent = extentBy(viewPoints, (point) => point.y);
        if (!xExtent || !yExtent) {
          config.mapView = { cx: 0, cy: 0, metersPerPx: 2 };
          config.defaultMapView = { ...config.mapView };
          return;
        }
        const minX = xExtent.min;
        const maxX = xExtent.max;
        const minY = yExtent.min;
        const maxY = yExtent.max;
        const spanX = Math.max(maxX - minX, 80);
        const spanY = Math.max(maxY - minY, 80);
        const rawMetersPerPx = Math.max(spanX / Math.max(1, plotW), spanY / Math.max(1, plotH)) * 1.12;
        const metersPerPx = Math.min(Math.max(rawMetersPerPx, 0.35), 20);
        config.mapView = { cx: (minX + maxX) / 2, cy: (minY + maxY) / 2, metersPerPx };
        config.defaultMapView = { ...config.mapView };
      }

      function resetTrackScale(config) {
        if (config.defaultMapView) config.mapView = { ...config.defaultMapView };
      }

      function zoomTrack(config, factor, anchorX, anchorY, plot) {
        if (!config.mapView) return;
        const beforeX = config.mapView.cx + (anchorX - (plot.left + plot.width / 2)) * config.mapView.metersPerPx;
        const beforeY = config.mapView.cy - (anchorY - (plot.top + plot.height / 2)) * config.mapView.metersPerPx;
        config.mapView.metersPerPx = Math.max(config.mapView.metersPerPx * factor, 0.01);
        config.mapView.cx = beforeX - (anchorX - (plot.left + plot.width / 2)) * config.mapView.metersPerPx;
        config.mapView.cy = beforeY + (anchorY - (plot.top + plot.height / 2)) * config.mapView.metersPerPx;
      }

      function altitudeValue(row) {
        for (const key of ["RelHomeAlt", "Alt", "AMSL", "RAlt", "AltAMSL"]) {
          const value = Number(row?.[key]);
          if (finite(value)) return { value, key };
        }
        return { value: 0, key: "missing" };
      }

      function projectTrack3d(config) {
        if (config.projected3d) return config.projected3d;
        const projected = projectTrack(config);
        const posRaw = projected.filter((point) => point.kind === "pos");
        const altSamples = posRaw.map((point) => altitudeValue(point.row)).filter((item) => finite(item.value));
        const usesRelative = altSamples.some((item) => item.key === "RelHomeAlt" || item.key === "RAlt");
        const refAlt = usesRelative ? 0 : (altSamples[0]?.value ?? 0);
        const to3d = (point) => {
          const alt = point.kind === "wp" ? Number(point.row?.alt) : altitudeValue(point.row).value;
          const z = finite(alt) ? alt - refAlt : 0;
          return { ...point, z };
        };
        config.projected3d = projected.map(to3d);
        config.altitudeSource = altSamples.find((item) => item.key !== "missing")?.key || "missing";
        return config.projected3d;
      }

      function bounds3d(points) {
        if (!points.length) return { cx: 0, cy: 0, cz: 0, radius: 80 };
        const xExtent = extentBy(points, (point) => point.x);
        const yExtent = extentBy(points, (point) => point.y);
        const zExtent = extentBy(points, (point) => point.z);
        if (!xExtent || !yExtent || !zExtent) return { cx: 0, cy: 0, cz: 0, radius: 80 };
        const minX = xExtent.min;
        const maxX = xExtent.max;
        const minY = yExtent.min;
        const maxY = yExtent.max;
        const minZ = zExtent.min;
        const maxZ = zExtent.max;
        const cx = (minX + maxX) / 2;
        const cy = (minY + maxY) / 2;
        const cz = (minZ + maxZ) / 2;
        const radius = Math.max(maxX - minX, maxY - minY, maxZ - minZ, 80) / 2;
        return { cx, cy, cz, radius };
      }

      function ensureTrack3dView(config, width, height) {
        const points = projectTrack3d(config).filter((point) => point.kind === "pos");
        const pathRange = trackPathRange();
        const visible = filterTrackPoints(points, pathRange);
        const fit = bounds3d(visible.length ? visible : points);
        config.center3d = fit;
        config.view ||= { ...state.track3dView };
        config.view.yaw ??= state.track3dView.yaw;
        config.view.pitch ??= state.track3dView.pitch;
        config.view.panX ??= state.track3dView.panX || 0;
        config.view.panY ??= state.track3dView.panY || 0;
        config.view.pitch = constrainTrack3dPitch(config.view.pitch);
        if (!config.view.userScaled && width > 20 && height > 20) {
          config.view.scale = Math.min(width, height) * 0.42 / fit.radius;
          state.track3dView.scale = config.view.scale;
        } else if (!finite(config.view.scale) || config.view.scale <= 0) {
          config.view.scale = 1;
          state.track3dView.scale = config.view.scale;
        }
      }

      const trackCamera = window.TrackCamera;

      function constrainTrack3dPitch(pitch) {
        return trackCamera.constrainPitch(pitch, state.track3dOverheadLock);
      }

      function snapLockedTrack3dPitch(pitch) {
        return trackCamera.snapLockedPitch(pitch);
      }

      function effectiveTrack3dView(view) {
        return { ...(view || state.track3dView), pitch: constrainTrack3dPitch(view?.pitch) };
      }

      function normalizeAngle(angle) {
        return trackCamera.normalizeAngle(angle);
      }

      function track3dViewModeLabel(mode) {
        return trackCamera.viewModeLabel(mode);
      }

      function yawFromAttitude(row) {
        return trackCamera.yawFromAttitude(row);
      }

      function trackCourseAt(points, markerTime) {
        return trackCamera.trackCourseAt(points, markerTime);
      }

      function setTrack3dViewMode(mode) {
        const allowed = new Set(["free", "fixed-los", "aircraft-relative", "track-vector"]);
        const nextMode = allowed.has(mode) ? mode : "free";
        const config = charts.get("track-3d-chart");
        if (config) {
          ensureTrack3dView(config, 1, 1);
          const view = effectiveTrack3dView(config.view || state.track3dView);
          const markerTime = trackMarkerTime();
          const points = projectTrack3d(config).filter((point) => point.kind === "pos");
          const attitude = nearestRow(config.attitudeRows || [], markerTime)?.row || null;
          if (nextMode === "fixed-los") {
            state.track3dFixedView = { yaw: -0.72, pitch: constrainTrack3dPitch(-0.55) };
          } else if (nextMode === "aircraft-relative") {
            state.track3dAircraftViewOffset = { yaw: 0, pitch: constrainTrack3dPitch(-0.55) };
          } else if (nextMode === "track-vector") {
            state.track3dTrackViewOffset = { yaw: 0, pitch: constrainTrack3dPitch(-0.55) };
          }
        }
        state.track3dViewMode = nextMode;
        renderAllCharts();
      }

      function applyTrack3dCameraMode(config, current, attitude, posPoints, markerTime) {
        if (state.track3dViewMode === "free" || !current) return;
        config.view ||= { ...state.track3dView };
        const fit = config.center3d || { cx: 0, cy: 0, cz: 0, radius: 80 };
        config.center3d = { ...fit, cx: current.x, cy: current.y, cz: current.z };
        config.view.panX = 0;
        config.view.panY = 0;
        if (state.track3dViewMode === "fixed-los") {
          config.view.yaw = state.track3dFixedView.yaw;
          config.view.pitch = constrainTrack3dPitch(state.track3dFixedView.pitch);
        } else if (state.track3dViewMode === "aircraft-relative") {
          const yaw = yawFromAttitude(attitude);
          if (yaw !== null) config.view.yaw = normalizeAngle(yaw + state.track3dAircraftViewOffset.yaw);
          config.view.pitch = constrainTrack3dPitch(state.track3dAircraftViewOffset.pitch);
        } else if (state.track3dViewMode === "track-vector") {
          const course = trackCourseAt(posPoints, markerTime);
          if (course !== null) config.view.yaw = normalizeAngle(course + state.track3dTrackViewOffset.yaw);
          config.view.pitch = constrainTrack3dPitch(state.track3dTrackViewOffset.pitch);
        }
        state.track3dView = { ...config.view };
      }

      function resetTrack3dView(config) {
        state.track3dViewMode = "free";
        config.view = { yaw: -0.72, pitch: constrainTrack3dPitch(-0.55), scale: null, panX: 0, panY: 0, userScaled: false };
        state.track3dView = { ...config.view };
      }

      function zoomTrack3d(config, factor) {
        config.view ||= { ...state.track3dView };
        config.view.scale = Math.max((config.view.scale || 1) * factor, 0.0001);
        config.view.userScaled = true;
        state.track3dView = { ...config.view };
      }

      function track3dProject(point, config, plot) {
        const center = config.center3d || { cx: 0, cy: 0, cz: 0 };
        const view = effectiveTrack3dView(config.view || state.track3dView);
        const dx = point.x - center.cx;
        const dy = point.y - center.cy;
        const dz = point.z - center.cz;
        const cyaw = Math.cos(view.yaw);
        const syaw = Math.sin(view.yaw);
        const cp = Math.cos(view.pitch);
        const sp = Math.sin(view.pitch);
        const x1 = dx * cyaw - dy * syaw;
        const y1 = dx * syaw + dy * cyaw;
        const z1 = dz;
        return {
          x: plot.left + plot.width / 2 + (view.panX || 0) + x1 * view.scale,
          y: plot.top + plot.height / 2 + (view.panY || 0) - (y1 * cp - z1 * sp) * view.scale,
          depth: y1 * sp + z1 * cp,
        };
      }

      function drawScreenArrow(ctx, from, to, color, size = 8) {
        const angle = Math.atan2(to.y - from.y, to.x - from.x);
        if (!finite(angle)) return;
        ctx.save();
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(to.x, to.y);
        ctx.lineTo(to.x - Math.cos(angle - 0.55) * size, to.y - Math.sin(angle - 0.55) * size);
        ctx.lineTo(to.x - Math.cos(angle + 0.55) * size, to.y - Math.sin(angle + 0.55) * size);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawProjectedLine(ctx, points, config, plot, strokeStyle, lineWidth, showDirection = false) {
        const visible = downsample(points);
        if (!visible.length) return;
        const screens = visible.map((point) => track3dProject(point, config, plot));
        ctx.strokeStyle = strokeStyle;
        ctx.lineWidth = lineWidth;
        ctx.beginPath();
        screens.forEach((screen, index) => {
          if (index === 0) ctx.moveTo(screen.x, screen.y);
          else ctx.lineTo(screen.x, screen.y);
        });
        ctx.stroke();
        if (showDirection && screens.length > 1) {
          const step = Math.max(8, Math.floor(screens.length / 7));
          for (let index = step; index < screens.length; index += step) {
            drawScreenArrow(ctx, screens[index - 1], screens[index], strokeStyle, 7);
          }
          drawScreenArrow(ctx, screens[screens.length - 2], screens[screens.length - 1], strokeStyle, 7);
        }
      }

      function routePointGroups(points) {
        const groups = [];
        const byKey = new Map();
        for (const point of points) {
          const key = point.row?._routeKey || "route";
          if (!byKey.has(key)) {
            const group = [];
            byKey.set(key, group);
            groups.push(group);
          }
          byKey.get(key).push(point);
        }
        return groups;
      }

      function drawProjectedRouteLines(ctx, points, config, plot, strokeStyle, lineWidth) {
        for (const group of routePointGroups(points)) drawProjectedLine(ctx, group, config, plot, strokeStyle, lineWidth);
      }

      function drawTrack3dGroundDrops(ctx, points, groundZ, config, plot) {
        const visible = downsample(points, 180);
        if (!visible.length || !finite(groundZ)) return;
        ctx.save();
        ctx.strokeStyle = "rgba(77, 182, 255, 0.32)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        visible.forEach((point) => {
          const top = track3dProject(point, config, plot);
          const bottom = track3dProject({ x: point.x, y: point.y, z: groundZ }, config, plot);
          ctx.moveTo(top.x, top.y);
          ctx.lineTo(bottom.x, bottom.y);
        });
        ctx.stroke();
        ctx.restore();
      }

      function drawTrack3dAxes(ctx, config, plot, center, gridSize, gridZ, zExtent) {
        const axisLen = Math.max(25, gridSize * 0.16);
        const base = { x: center.cx - gridSize * 0.86, y: center.cy - gridSize * 0.86, z: gridZ };
        const axes = [
          { end: { x: base.x + axisLen, y: base.y, z: base.z }, color: colors.red, label: "E" },
          { end: { x: base.x, y: base.y + axisLen, z: base.z }, color: colors.green, label: "N" },
          { end: { x: base.x, y: base.y, z: base.z + axisLen }, color: colors.blue, label: "U" },
        ];
        const origin = track3dProject(base, config, plot);
        ctx.save();
        ctx.font = canvasFont(11);
        axes.forEach((axis) => {
          const end = track3dProject(axis.end, config, plot);
          ctx.strokeStyle = axis.color;
          ctx.fillStyle = axis.color;
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.moveTo(origin.x, origin.y);
          ctx.lineTo(end.x, end.y);
          ctx.stroke();
          drawScreenArrow(ctx, origin, end, axis.color, 6);
          ctx.fillText(axis.label, end.x + 4, end.y - 4);
        });

        const zMin = gridZ;
        const zMax = zExtent ? Math.max(zExtent.max, zMin + axisLen) : zMin + axisLen;
        const zMid = (zMin + zMax) / 2;
        const axisBase = { x: center.cx + gridSize * 0.84, y: center.cy - gridSize * 0.84, z: zMin };
        const axisTop = { ...axisBase, z: zMax };
        const baseScreen = track3dProject(axisBase, config, plot);
        const topScreen = track3dProject(axisTop, config, plot);
        ctx.strokeStyle = "rgba(77, 182, 255, 0.72)";
        ctx.fillStyle = "#4db6ff";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(baseScreen.x, baseScreen.y);
        ctx.lineTo(topScreen.x, topScreen.y);
        ctx.stroke();
        for (const z of [zMin, zMid, zMax]) {
          const screen = track3dProject({ ...axisBase, z }, config, plot);
          ctx.beginPath();
          ctx.moveTo(screen.x - 4, screen.y);
          ctx.lineTo(screen.x + 4, screen.y);
          ctx.stroke();
          ctx.fillText(`${fmt.format(z)}m`, screen.x + 7, screen.y + 4);
        }
        ctx.fillText("Alt", topScreen.x + 7, topScreen.y - 8);
        ctx.restore();
      }

      function attitudeVector(row) {
        const roll = -((Number(row?.Roll) || 0) * Math.PI) / 180;
        const pitch = ((Number(row?.Pitch) || 0) * Math.PI) / 180;
        const yaw = ((Number(row?.Yaw) || 0) * Math.PI) / 180;
        const forward = [Math.sin(yaw) * Math.cos(pitch), Math.cos(yaw) * Math.cos(pitch), Math.sin(pitch)];
        const rightBase = [Math.cos(yaw), -Math.sin(yaw), 0];
        const upBase = [
          rightBase[1] * forward[2] - rightBase[2] * forward[1],
          rightBase[2] * forward[0] - rightBase[0] * forward[2],
          rightBase[0] * forward[1] - rightBase[1] * forward[0],
        ];
        const cr = Math.cos(roll);
        const sr = Math.sin(roll);
        const right = rightBase.map((value, index) => value * cr + upBase[index] * sr);
        const up = upBase.map((value, index) => value * cr - rightBase[index] * sr);
        return { forward, right, up };
      }

      function aircraftPoint(basePoint, vectors, forward, right, up) {
        return {
          x: basePoint.x + vectors.forward * forward[0] + vectors.right * right[0] + vectors.up * up[0],
          y: basePoint.y + vectors.forward * forward[1] + vectors.right * right[1] + vectors.up * up[1],
          z: basePoint.z + vectors.forward * forward[2] + vectors.right * right[2] + vectors.up * up[2],
        };
      }

      function drawAircraftModel(ctx, basePoint, attitudeRow, config, plot, size) {
        const attitude = attitudeVector(attitudeRow);
        const body = {
          nose: aircraftPoint(basePoint, { forward: size * 1.35, right: 0, up: 0 }, attitude.forward, attitude.right, attitude.up),
          tail: aircraftPoint(basePoint, { forward: -size * 0.9, right: 0, up: 0 }, attitude.forward, attitude.right, attitude.up),
          leftWing: aircraftPoint(basePoint, { forward: -size * 0.08, right: -size * 0.95, up: 0 }, attitude.forward, attitude.right, attitude.up),
          rightWing: aircraftPoint(basePoint, { forward: -size * 0.08, right: size * 0.95, up: 0 }, attitude.forward, attitude.right, attitude.up),
          tailLeft: aircraftPoint(basePoint, { forward: -size * 0.72, right: -size * 0.38, up: 0 }, attitude.forward, attitude.right, attitude.up),
          tailRight: aircraftPoint(basePoint, { forward: -size * 0.72, right: size * 0.38, up: 0 }, attitude.forward, attitude.right, attitude.up),
          fin: aircraftPoint(basePoint, { forward: -size * 0.78, right: 0, up: size * 0.42 }, attitude.forward, attitude.right, attitude.up),
        };
        const screen = Object.fromEntries(Object.entries(body).map(([name, point]) => [name, track3dProject(point, config, plot)]));
        const center = track3dProject(basePoint, config, plot);

        ctx.save();
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.strokeStyle = colors.teal;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(screen.nose.x, screen.nose.y);
        ctx.lineTo(screen.tail.x, screen.tail.y);
        ctx.stroke();

        ctx.strokeStyle = colors.blue;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(screen.tail.x, screen.tail.y);
        ctx.lineTo(screen.nose.x, screen.nose.y);
        ctx.stroke();

        ctx.strokeStyle = colors.red;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(screen.leftWing.x, screen.leftWing.y);
        ctx.lineTo(screen.rightWing.x, screen.rightWing.y);
        ctx.stroke();

        ctx.strokeStyle = colors.gold;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(screen.tailLeft.x, screen.tailLeft.y);
        ctx.lineTo(screen.tailRight.x, screen.tailRight.y);
        ctx.moveTo(screen.tail.x, screen.tail.y);
        ctx.lineTo(screen.fin.x, screen.fin.y);
        ctx.stroke();

        const cues = [
          { vector: attitude.forward, color: colors.blue, label: "nose" },
          { vector: attitude.right, color: colors.red, label: "right" },
          { vector: attitude.up, color: colors.gold, label: "up" },
        ];
        ctx.font = canvasFont(11);
        cues.forEach((cue) => {
          const tip = track3dProject({ x: basePoint.x + cue.vector[0] * size * 0.72, y: basePoint.y + cue.vector[1] * size * 0.72, z: basePoint.z + cue.vector[2] * size * 0.72 }, config, plot);
          ctx.strokeStyle = cue.color;
          ctx.lineWidth = 1.3;
          ctx.beginPath();
          ctx.moveTo(center.x, center.y);
          ctx.lineTo(tip.x, tip.y);
          ctx.stroke();
          ctx.fillStyle = cue.color;
          ctx.fillText(cue.label, tip.x + 4, tip.y - 4);
        });

        ctx.fillStyle = colors.teal;
        ctx.beginPath();
        ctx.arc(center.x, center.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawTrack3dChart(config) {
        const canvas = document.querySelector(`#${config.id}`);
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = Math.max(1, Math.floor(rect.width * dpr));
        canvas.height = Math.max(1, Math.floor(rect.height * dpr));
        ctx.scale(dpr, dpr);
        const width = rect.width;
        const height = rect.height;
        const pad = { left: 20, right: 16, top: 20, bottom: 28 };
        const plot = { left: pad.left, top: pad.top, width: width - pad.left - pad.right, height: height - pad.top - pad.bottom };
        ensureTrack3dView(config, plot.width, plot.height);

        const projected = projectTrack3d(config);
        const pathRange = trackPathRange();
        const posPoints = filterTrackPoints(projected, pathRange);
        const allPos = projected.filter((point) => point.kind === "pos");
        const wpPoints = projected.filter((point) => point.kind === "wp");
        const markerTime = trackMarkerTime();
        const currentSeq = currentNavigationSeq(markerTime);
        const markerCandidates = filterTrackPoints(allPos, trackMarkerBounds());
        const current = (nearestRow(markerCandidates.length ? markerCandidates : allPos, markerTime)?.row) || posPoints[posPoints.length - 1] || allPos[allPos.length - 1];
        const attitude = nearestRow(config.attitudeRows || [], markerTime)?.row || null;
        applyTrack3dCameraMode(config, current, attitude, allPos, markerTime);
        state.track3dView = { ...config.view };
        const size = Math.max(6, (config.center3d?.radius || 80) * 0.0425);

        ctx.clearRect(0, 0, width, height);
        ctx.strokeStyle = "#d7ded6";
        ctx.strokeRect(plot.left, plot.top, plot.width, plot.height);
        ctx.save();
        ctx.beginPath();
        ctx.rect(plot.left, plot.top, plot.width, plot.height);
        ctx.clip();

        const center = config.center3d || { cx: 0, cy: 0, cz: 0, radius: 80 };
        const gridSize = Math.max(80, center.radius * 1.4);
        const groundExtent = extentBy(posPoints.length ? posPoints : allPos, (point) => point.z);
        const gridZ = groundExtent ? Math.min(groundExtent.min, 0) : 0;
        const flownPoints = posPoints.filter((point) => point.time_s <= markerTime);
        const gridCorners = [
          { x: center.cx - gridSize, y: center.cy - gridSize, z: gridZ },
          { x: center.cx + gridSize, y: center.cy - gridSize, z: gridZ },
          { x: center.cx + gridSize, y: center.cy + gridSize, z: gridZ },
          { x: center.cx - gridSize, y: center.cy + gridSize, z: gridZ },
        ];
        ctx.strokeStyle = "rgba(123, 135, 128, 0.35)";
        ctx.lineWidth = 1;
        for (let i = 0; i < gridCorners.length; i++) {
          const a = track3dProject(gridCorners[i], config, plot);
          const b = track3dProject(gridCorners[(i + 1) % gridCorners.length], config, plot);
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }

        if (state.trackShowPath) drawTrack3dGroundDrops(ctx, flownPoints, gridZ, config, plot);
        drawTrack3dAxes(ctx, config, plot, center, gridSize, gridZ, groundExtent);
        if (state.trackShowWaypoints) drawProjectedRouteLines(ctx, wpPoints, config, plot, colors.gold, 1.3);
        if (state.trackShowPath) drawProjectedLine(ctx, posPoints, config, plot, colors.green, 2.4, true);

        if (state.trackShowWaypoints) {
          ctx.fillStyle = colors.gold;
          wpPoints.forEach((point) => {
            const screen = track3dProject(point, config, plot);
            ctx.beginPath();
            ctx.arc(screen.x, screen.y, 3, 0, Math.PI * 2);
            ctx.fill();
          });

          const currentTarget = wpPoints.find((point) => point.row?._routeActive && Number(point.row?.index) === currentSeq);
          if (currentTarget) {
            const screen = track3dProject(currentTarget, config, plot);
            ctx.strokeStyle = "#ff4dff";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(screen.x, screen.y, 13, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = "#ff4dff";
            ctx.fillText(`NAV #${currentTarget.row.index}`, screen.x + 14, screen.y + 14);
          }

          const highlighted = wpPoints.find((point) => waypointHighlightMatches(point.row));
          if (highlighted) {
            const screen = track3dProject(highlighted, config, plot);
            ctx.strokeStyle = colors.red;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(screen.x, screen.y, 10, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = colors.red;
            ctx.fillText(`#${highlighted.row.index}`, screen.x + 12, screen.y - 8);
          }
        }

        if (current && attitude) drawAircraftModel(ctx, current, attitude, config, plot, size);
        ctx.restore();

        ctx.fillStyle = "#607068";
        ctx.font = canvasFont(12);
        ctx.fillText(`yaw ${fmt.format((config.view.yaw * 180) / Math.PI)} deg | pitch ${fmt.format((config.view.pitch * 180) / Math.PI)} deg`, plot.left, height - 8);
        const attitudeText = attitude ? ` | ATT Roll/Pitch/Yaw ${fmt.format(attitude.Roll)}/${fmt.format(attitude.Pitch)}/${fmt.format(attitude.Yaw)}` : " | ATT missing";
        document.querySelector(`#${config.id}-readout`).textContent = `${state.trackPathMode === "full" ? "Full" : "Window"} ${fmt.format(pathRange.start)}s..${fmt.format(pathRange.end)}s | ${state.trackModeFilter === "all" ? "all modes" : state.trackModeFilter} | Route ${missionRouteReadout(markerTime)} | Path ${state.trackShowPath ? "on" : "off"} | WP ${state.trackShowWaypoints ? "on" : "off"} | Camera ${track3dViewModeLabel(state.track3dViewMode)} | 3D POS: ${posPoints.length} | Plane ${fmt.format(markerTime)}s | Alt: ${config.altitudeSource || "missing"}${attitudeText}`;
      }

      function drawTrack2dCompass(ctx, plot) {
        const origin = { x: plot.left + plot.width - 52, y: plot.top + 52 };
        const north = { x: origin.x, y: origin.y - 28 };
        const east = { x: origin.x + 28, y: origin.y };
        ctx.save();
        ctx.font = canvasFont(11);
        ctx.strokeStyle = colors.green;
        ctx.fillStyle = colors.green;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(origin.x, origin.y);
        ctx.lineTo(north.x, north.y);
        ctx.stroke();
        drawScreenArrow(ctx, origin, north, colors.green, 6);
        ctx.fillText("N", north.x - 4, north.y - 6);
        ctx.strokeStyle = colors.red;
        ctx.fillStyle = colors.red;
        ctx.beginPath();
        ctx.moveTo(origin.x, origin.y);
        ctx.lineTo(east.x, east.y);
        ctx.stroke();
        drawScreenArrow(ctx, origin, east, colors.red, 6);
        ctx.fillText("E", east.x + 5, east.y + 4);
        ctx.restore();
      }

      function drawTrackChart(config) {
        const canvas = document.querySelector(`#${config.id}`);
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = Math.max(1, Math.floor(rect.width * dpr));
        canvas.height = Math.max(1, Math.floor(rect.height * dpr));
        ctx.scale(dpr, dpr);
        const width = rect.width;
        const height = rect.height;
        const pad = { left: 28, right: 16, top: 22, bottom: 28 };
        const plot = { left: pad.left, top: pad.top, width: width - pad.left - pad.right, height: height - pad.top - pad.bottom };
        if (!config.mapView) fitTrackView(config, plot.width, plot.height);

        const projected = projectTrack(config);
        const pathRange = trackPathRange();
        const posPoints = filterTrackPoints(projected, pathRange);
        const allPos = projected.filter((point) => point.kind === "pos");
        const markerTime = trackMarkerTime();
        const currentSeq = currentNavigationSeq(markerTime);
        const markerCandidates = filterTrackPoints(allPos, trackMarkerBounds());
        const markerPoint = nearestRow(markerCandidates.length ? markerCandidates : allPos, markerTime)?.row || null;
        const wpPoints = projected.filter((point) => point.kind === "wp");
        const omittedWaypoints = config.omittedWaypoints || 0;
        const sx = (x) => plot.left + plot.width / 2 + (x - config.mapView.cx) / config.mapView.metersPerPx;
        const sy = (y) => plot.top + plot.height / 2 - (y - config.mapView.cy) / config.mapView.metersPerPx;

        ctx.clearRect(0, 0, width, height);
        ctx.strokeStyle = "#d7ded6";
        ctx.lineWidth = 1;
        const gridMeters = Math.pow(10, Math.floor(Math.log10(config.mapView.metersPerPx * 90)));
        const gridStep = gridMeters < config.mapView.metersPerPx * 42 ? gridMeters * 2 : gridMeters;
        const leftWorld = config.mapView.cx - (plot.width / 2) * config.mapView.metersPerPx;
        const rightWorld = config.mapView.cx + (plot.width / 2) * config.mapView.metersPerPx;
        const bottomWorld = config.mapView.cy - (plot.height / 2) * config.mapView.metersPerPx;
        const topWorld = config.mapView.cy + (plot.height / 2) * config.mapView.metersPerPx;
        for (let x = Math.floor(leftWorld / gridStep) * gridStep; x <= rightWorld; x += gridStep) {
          ctx.beginPath();
          ctx.moveTo(sx(x), plot.top);
          ctx.lineTo(sx(x), plot.top + plot.height);
          ctx.stroke();
        }
        ctx.fillStyle = "#607068";
        ctx.font = canvasFont(10);
        for (let y = Math.floor(bottomWorld / gridStep) * gridStep; y <= topWorld; y += gridStep) {
          const labelY = sy(y);
          ctx.beginPath();
          ctx.moveTo(plot.left, labelY);
          ctx.lineTo(plot.left + plot.width, labelY);
          ctx.stroke();
          if (labelY > plot.top + 12 && labelY < plot.top + plot.height - 4) ctx.fillText(`N ${fmt.format(y)}m`, plot.left + 4, labelY - 3);
        }
        drawTrack2dCompass(ctx, plot);

        ctx.save();
        ctx.beginPath();
        ctx.rect(plot.left, plot.top, plot.width, plot.height);
        ctx.clip();
        if (state.trackShowWaypoints) {
          ctx.strokeStyle = colors.gold;
          ctx.lineWidth = 1.5;
          for (const group of routePointGroups(wpPoints)) {
            ctx.beginPath();
            group.forEach((point, index) => {
              if (index === 0) ctx.moveTo(sx(point.x), sy(point.y));
              else ctx.lineTo(sx(point.x), sy(point.y));
            });
            ctx.stroke();
          }
        }

        const posLinePoints = downsample(posPoints);
        if (state.trackShowPath) {
          ctx.strokeStyle = colors.green;
          ctx.lineWidth = 2.3;
          ctx.beginPath();
          posLinePoints.forEach((point, index) => {
            if (index === 0) ctx.moveTo(sx(point.x), sy(point.y));
            else ctx.lineTo(sx(point.x), sy(point.y));
          });
          ctx.stroke();
          if (posLinePoints.length > 1) {
            const step = Math.max(8, Math.floor(posLinePoints.length / 7));
            for (let index = step; index < posLinePoints.length; index += step) {
              drawScreenArrow(ctx, { x: sx(posLinePoints[index - 1].x), y: sy(posLinePoints[index - 1].y) }, { x: sx(posLinePoints[index].x), y: sy(posLinePoints[index].y) }, colors.green, 7);
            }
            drawScreenArrow(ctx, { x: sx(posLinePoints[posLinePoints.length - 2].x), y: sy(posLinePoints[posLinePoints.length - 2].y) }, { x: sx(posLinePoints[posLinePoints.length - 1].x), y: sy(posLinePoints[posLinePoints.length - 1].y) }, colors.green, 7);
          }
        }

        if (state.trackShowWaypoints) {
          ctx.fillStyle = colors.gold;
          wpPoints.forEach((point) => {
            ctx.beginPath();
            ctx.arc(sx(point.x), sy(point.y), 3, 0, Math.PI * 2);
            ctx.fill();
          });
        }
        const currentTarget = state.trackShowWaypoints ? wpPoints.find((point) => point.row?._routeActive && Number(point.row?.index) === currentSeq) : null;
        const highlighted = state.trackShowWaypoints ? wpPoints.find((point) => waypointHighlightMatches(point.row)) : null;
        if (currentTarget) {
          const tx = sx(currentTarget.x);
          const ty = sy(currentTarget.y);
          ctx.strokeStyle = "#ff4dff";
          ctx.fillStyle = "#ff4dff";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(tx, ty, 13, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillText(`NAV #${currentTarget.row.index}`, tx + 14, ty + 14);
        }
        if (markerPoint) {
          const mx = sx(markerPoint.x);
          const my = sy(markerPoint.y);
          ctx.strokeStyle = colors.teal;
          ctx.fillStyle = colors.teal;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(mx, my, 7, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillText(`plane ${fmt.format(markerTime)}s`, mx + 10, my + 14);
        }
        if (highlighted) {
          const hx = sx(highlighted.x);
          const hy = sy(highlighted.y);
          ctx.strokeStyle = colors.red;
          ctx.fillStyle = colors.red;
          ctx.lineWidth = 2.8;
          ctx.beginPath();
          ctx.arc(hx, hy, 10, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillText(`#${highlighted.row.index} ${highlighted.row.command_name}`, hx + 12, hy - 8);
        }
        ctx.restore();

        ctx.strokeStyle = "#17211d";
        ctx.strokeRect(plot.left, plot.top, plot.width, plot.height);
        ctx.fillStyle = "#607068";
        ctx.font = canvasFont(12);
        ctx.fillText(`grid ${fmt.format(gridStep)} m`, plot.left, height - 8);
        document.querySelector(`#${config.id}-readout`).textContent = `${state.trackPathMode === "full" ? "Full" : "Window"} ${fmt.format(pathRange.start)}s..${fmt.format(pathRange.end)}s | ${state.trackModeFilter === "all" ? "all modes" : state.trackModeFilter} | Route ${missionRouteReadout(markerTime)} | Path ${state.trackShowPath ? "on" : "off"} | WP ${state.trackShowWaypoints ? "on" : "off"} | POS: ${posPoints.length} | Plane ${fmt.format(markerTime)}s | 航点: ${wpPoints.length}${omittedWaypoints ? `, 过滤 ${omittedWaypoints} 个无效/远端点` : ""} | 等比例 ${fmt.format(config.mapView.metersPerPx)} m/px`;
      }

      function renderLegend(config) {
        const node = document.querySelector(`#${config.id}-legend`);
        if (!node || config.type === "track" || config.type === "track3d") return;
        state.hidden[config.id] ||= {};
        node.innerHTML = config.series
          .map(
            (seriesItem) => `<label><input type="checkbox" data-chart-id="${config.id}" data-label="${escapeHtml(seriesItem.label)}" ${state.hidden[config.id][seriesItem.label] ? "" : "checked"}><span class="swatch" style="background:${seriesItem.color}"></span>${escapeHtml(seriesItem.label)}</label>`,
          )
          .join("");
        node.querySelectorAll("input").forEach((input) => {
          input.addEventListener("change", () => {
            state.hidden[input.dataset.chartId][input.dataset.label] = !input.checked;
            renderAllCharts();
          });
        });
      }

      function prepareChartScale(config) {
        if (config.type === "line") {
          config.defaultYView = yRangeForSeries(config.series);
          resetLineScale(config);
        }
      }

      function bindScaleControls(config) {
        const reset = document.querySelector(`[data-scale-reset="${config.id}"]`);
        const zoomIn = document.querySelector(`[data-scale-in="${config.id}"]`);
        const zoomOut = document.querySelector(`[data-scale-out="${config.id}"]`);
        const hClear = document.querySelector(`[data-href-clear="${config.id}"]`);
        const playbackToggle = document.querySelector(`[data-chart-playback-toggle="${config.id}"]`);
        if (!reset || !zoomIn || !zoomOut || config.controlsBound) return;
        config.controlsBound = true;
        if (config.type === "track") {
          reset.textContent = "Reset map";
          zoomIn.textContent = "Map +";
          zoomOut.textContent = "Map -";
          hClear?.remove();
        } else if (config.type === "track3d") {
          reset.textContent = "Reset 3D";
          zoomIn.textContent = "3D +";
          zoomOut.textContent = "3D -";
          hClear?.remove();
        } else {
          reset.textContent = "Reset Y";
          zoomIn.textContent = "Y +";
          zoomOut.textContent = "Y -";
        }
        reset.addEventListener("click", () => {
          if (config.type === "track") resetTrackScale(config);
          else if (config.type === "track3d") resetTrack3dView(config);
          else resetLineScale(config);
          renderAllCharts();
        });
        zoomIn.addEventListener("click", () => {
          if (config.type === "track") {
            config.mapView.metersPerPx = Math.max(config.mapView.metersPerPx * 0.82, 0.01);
          } else if (config.type === "track3d") {
            zoomTrack3d(config, 1.18);
          } else {
            zoomLineY(config, 0.82);
          }
          renderAllCharts();
        });
        zoomOut.addEventListener("click", () => {
          if (config.type === "track") config.mapView.metersPerPx *= 1.22;
          else if (config.type === "track3d") zoomTrack3d(config, 1 / 1.18);
          else zoomLineY(config, 1.22);
          renderAllCharts();
        });
        hClear?.addEventListener("click", () => {
          state.hRefs[config.id] = [];
          renderAllCharts();
        });
        playbackToggle?.addEventListener("click", toggleTrackPlayback);
      }

      function syncTrackMissionRoute(config) {
        if (config.type !== "track" && config.type !== "track3d") return;
        const time = trackMarkerTime();
        const source = selectedMissionSource(time);
        const version = missionVersionAt(source, time);
        const activeRoute = missionRouteEntryAt(source, time);
        const rows = activeMissionWaypointRows(time);
        const rowKey = rows.map((row) => `${row._routeKey || "summary"}:${row.index}:${row.lat}:${row.lon}:${row.alt}`).join(";");
        const visibilityKey = Object.entries(state.missionRouteVisibility || {}).map(([key, value]) => `${key}=${value}`).join(";");
        const routeKey = `${source?.id || "summary"}:${version?.start_s ?? "static"}:${version?.end_s ?? "end"}:${visibilityKey}:${rowKey}`;
        if (config.routeSourceKey === routeKey) return;
        config.routeSourceKey = routeKey;
        config.activeRouteKey = activeRoute?.key || null;
        config.waypointRows = rows;
        config.projected = null;
        config.projected3d = null;
      }

      function renderAllCharts() {
        updateTrackControls();
        for (const config of charts.values()) {
          syncTrackMissionRoute(config);
          if (config.type === "track") drawTrackChart(config);
          else if (config.type === "track3d") drawTrack3dChart(config);
          else drawLineChart(config);
        }
