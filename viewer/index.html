            { label: "body accel Y", group: "motion", message: "IMU", field: "AccY", unit: "m/s^2" },
            { label: "body accel Z", group: "motion", message: "IMU", field: "AccZ", unit: "m/s^2" },
            { label: "accel magnitude", derive: "accel_magnitude", unit: "m/s^2" },
            { label: "gyro X", group: "motion", message: "IMU", field: "GyrX", unit: "rad/s" },
            { label: "vibration X", group: "motion", message: "VIBE", field: "VibeX" },
            { label: "EKF velocity north", group: "motion", message: "XKF1", field: "VN", unit: "m/s" },
            { label: "EKF velocity down", group: "motion", message: "XKF1", field: "VD", unit: "m/s" },
          ],
        },
      ];

      function statusPill(status) {
        return `<span class="status-pill status-${status}">${status}</span>`;
      }

      function findModeAt(time) {
        return (modeData.segments || []).find((segment) => time >= segment.start_s && time <= segment.end_s) || null;
      }

      function commandName(commandId) {
        const id = Number(commandId);
        return mavCmdNames[id] || `MAV_CMD_${finite(id) ? id : "?"}`;
      }

      function previousRow(rows, time) {
        if (!Array.isArray(rows) || !rows.length || !finite(time)) return null;
        let candidate = null;
        for (const row of rows) {
          const rowTime = Number(row.time_s);
          if (!finite(rowTime)) continue;
          if (rowTime <= time) candidate = row;
          else break;
        }
        return candidate;
      }

      function plannedWaypointForCommand(commandNumber) {
        const index = Number(commandNumber);
        if (!finite(index)) return null;
        return (inspectorContext?.summary?.waypoints || []).find((waypoint) => Number(waypoint.index) === index) || null;
      }

      function missionInfoAt(time) {
        const mode = findModeAt(time);
        const cmdRows = inspectorContext?.groups?.mission?.messages?.CMD || [];
        if (!mode || mode.name !== "AUTO") return { status: "missing", label: "not AUTO", detail: "mission inactive" };
        const row = previousRow(cmdRows, time);
        if (!row || Number(row.time_s) < Number(mode.start_s) - 0.25) return { status: "missing", label: "no CMD", detail: "AUTO segment" };
        const age = finite(time) && finite(Number(row.time_s)) ? Math.max(0, time - Number(row.time_s)) : null;
        const commandNumber = Number(row.CNum);
        const planned = plannedWaypointForCommand(commandNumber);
        const target = validGeo(Number(row.Lat), Number(row.Lng)) ? `${fmt.format(row.Lat)}, ${fmt.format(row.Lng)}, ${fmt.format(row.Alt)}m` : `alt ${fmt.format(row.Alt)}m`;
        return {
          status: "direct",
          label: `${commandName(row.CId)} #${finite(commandNumber) ? commandNumber : "?"}`,
          detail: `${target}${age !== null ? ` | age ${fmt.format(age)}s` : ""}`,
          planned: planned ? `${planned.command_name} #${planned.index}` : "no wp match",
          params: ["Prm1", "Prm2", "Prm3", "Prm4"].map((key) => `${key}=${fmt.format(Number(row[key]) || 0)}`).join(" "),
        };
      }

      function nearestRow(rows, time) {
        if (!Array.isArray(rows) || !rows.length || !finite(time)) return null;
        let lo = 0;
        let hi = rows.length - 1;
        while (lo < hi) {
          const mid = Math.floor((lo + hi) / 2);
          if (Number(rows[mid].time_s) < time) lo = mid + 1;
          else hi = mid;
        }
        const candidates = [rows[lo - 1], rows[lo], rows[lo + 1]].filter(Boolean);
        return candidates.reduce((best, row) => {
          const distance = Math.abs(Number(row.time_s) - time);
          return !best || distance < best.distance ? { row, distance } : best;
        }, null);
      }

      function sampleLoggedValue(spec, time) {
        const group = inspectorContext?.groups?.[spec.group];
        const rows = group?.messages?.[spec.message] || [];
        const nearest = nearestRow(rows, time);
        if (!nearest || !(spec.field in nearest.row)) {
          return { label: spec.label, status: "missing", value: "missing", source: `${spec.message}.${spec.field}` };
        }
        const value = Number(nearest.row[spec.field]);
        return {
          label: spec.label,
          status: "direct",
          value: finite(value) ? fmt.format(value) : escapeHtml(nearest.row[spec.field]),
          unit: spec.unit || "",
          source: `${spec.message}.${spec.field}`,
          delta: nearest.distance,
        };
      }

      function numericSample(group, message, field, time) {
        const result = sampleLoggedValue({ label: field, group, message, field }, time);
        if (result.status !== "direct") return null;
        return Number(result.value.replaceAll(",", ""));
      }

      function sampleDerivedValue(spec, time) {
        if (spec.derive === "att_roll_error") {
          const target = numericSample("attitude", "ATT", "DesRoll", time);
          const actual = numericSample("attitude", "ATT", "Roll", time);
          if (!finite(target) || !finite(actual)) return { label: spec.label, status: "missing", value: "missing", source: "ATT.DesRoll - ATT.Roll" };
          return { label: spec.label, status: "derived", value: fmt.format(target - actual), unit: spec.unit || "", source: "ATT.DesRoll - ATT.Roll" };
        }
        if (spec.derive === "accel_magnitude") {
          const x = numericSample("motion", "IMU", "AccX", time);
          const y = numericSample("motion", "IMU", "AccY", time);
          const z = numericSample("motion", "IMU", "AccZ", time);
          if (![x, y, z].every(finite)) return { label: spec.label, status: "missing", value: "missing", source: "sqrt(AccX^2 + AccY^2 + AccZ^2)" };
          return { label: spec.label, status: "derived", value: fmt.format(Math.hypot(x, y, z)), unit: spec.unit || "", source: "sqrt(AccX^2 + AccY^2 + AccZ^2)" };
        }
        return { label: spec.label, status: "missing", value: "missing", source: spec.derive || "derived" };
      }

      function sampleValue(spec, time) {
        return spec.derive ? sampleDerivedValue(spec, time) : sampleLoggedValue(spec, time);
      }

      function parameterMatches(names) {
        const params = inspectorContext?.summary?.control_params || {};
        const found = [];
        for (const name of names) {
          if (name.endsWith("*")) {
            const prefix = name.slice(0, -1);
            for (const key of Object.keys(params).sort()) {
              if (key.startsWith(prefix)) found.push([key, params[key]]);
            }
          } else if (Object.prototype.hasOwnProperty.call(params, name)) {
            found.push([name, params[name]]);
          }
        }
        return found;
      }

      function parameterRoleIndex() {
        const index = {};
        for (const [layerKey, rows] of Object.entries(layerParameterMap)) {
          for (const [name, role] of rows) {
            index[name] = { layerKey, role };
          }
        }
        return index;
      }

      function parameterEntries(summary) {
        const params = summary.params || summary.control_params || {};
        const controlParams = summary.control_params || {};
        const roleIndex = parameterRoleIndex();
        return Object.keys(params).sort().map((name) => ({
          name,
          value: params[name],
          isControl: Object.prototype.hasOwnProperty.call(controlParams, name),
          layer: roleIndex[name]?.layerKey || "",
          role: roleIndex[name]?.role || "",
        }));
      }

      function filteredParameterEntries(summary) {
        const query = state.paramQuery.trim().toLowerCase();
        const entries = parameterEntries(summary);
        if (!query) return entries.filter((entry) => entry.isControl || entry.layer).slice(0, 40);
        return entries.filter((entry) => [entry.name, entry.value, entry.layer, entry.role].some((value) => String(value || "").toLowerCase().includes(query))).slice(0, 80);
      }

      function renderParamSearchResults(summary) {
        const entries = filteredParameterEntries(summary);
        if (!entries.length) return `<p>No params.</p>`;
        return entries.map((entry) => `<div class="param-search-row"><code title="${escapeHtml(entry.name)}">${escapeHtml(entry.name)}</code><span title="${escapeHtml(entry.value)}">${escapeHtml(entry.value)}</span><small>${escapeHtml(entry.layer || "param")}${entry.role ? ` · ${escapeHtml(entry.role)}` : ""}${entry.isControl ? " · control" : ""}</small></div>`).join("");
      }

      function renderParamSearch(summary) {
        const total = Object.keys(summary.params || summary.control_params || {}).length;
        const shown = filteredParameterEntries(summary).length;
        const node = document.querySelector("#param-search");
        if (!node) return;
        node.innerHTML = `<div class="param-search"><div class="toolbar-row"><strong>Param Search</strong><span class="range-text">${shown}/${total}</span></div><input id="param-query" value="${escapeHtml(state.paramQuery)}" placeholder="NAVL1 / TECS / SERVO / INS"><div class="param-results" id="param-results">${renderParamSearchResults(summary)}</div></div>`;
        const input = document.querySelector("#param-query");
        input?.addEventListener("input", () => {
          state.paramQuery = input.value;
          const results = document.querySelector("#param-results");
          if (results) results.innerHTML = renderParamSearchResults(summary);
          const count = document.querySelector("#param-search .range-text");
          if (count) count.textContent = `${filteredParameterEntries(summary).length}/${total}`;
        });
      }

      function renderLayerParams(summary, layerKey) {
        const params = summary.control_params || {};
        const rows = layerParameterMap[layerKey] || [];
        if (!rows.length) return "";
        const body = rows.map(([name, role]) => {
          const hasValue = Object.prototype.hasOwnProperty.call(params, name);
          return `<div class="param-row"><code title="${escapeHtml(name)}">${escapeHtml(name)}</code><span title="${escapeHtml(role)}">${hasValue ? escapeHtml(params[name]) : "missing"} · ${escapeHtml(role)}</span></div>`;
        }).join("");
        return `<h3>Key params</h3><div class="param-card">${body}</div>`;
      }

      function renderParameterList(names) {
        const matches = parameterMatches(names);
        if (!matches.length) return `<div class="mini-list">${statusPill("missing")}</div>`;
        return `<div class="mini-list">${matches.slice(0, 8).map(([key, value]) => `<code title="${escapeHtml(key)} = ${escapeHtml(value)}">${escapeHtml(key)}=${escapeHtml(value)}</code>`).join("")}${matches.length > 8 ? `<code>+${matches.length - 8}</code>` : ""}</div>`;
      }

      function renderValueList(values, time) {
        return `<div class="inspector-grid">${values.map((spec) => {
          const item = sampleValue(spec, time);
          const delta = item.delta !== undefined ? `dt ${fmt.format(item.delta)}s` : item.source;
          return `<div class="inspector-row"><strong>${escapeHtml(item.label)} ${statusPill(item.status)}</strong><span>${escapeHtml(item.value)}${item.unit ? ` ${escapeHtml(item.unit)}` : ""}</span><small>${escapeHtml(delta)}</small></div>`;
        }).join("")}</div>`;
      }

      function inspectorToggleLabel() {
        return state.inspectorCollapsed ? "Show" : "Hide";
      }

      function inspectorChainKey(index) {
        return `chain-${index}`;
      }

      function inspectorChainToggleLabel(index) {
        return state.inspectorChainCollapsed[inspectorChainKey(index)] ? "Show" : "Hide";
      }

      function renderInspectorChain(chain, index, time) {
        const key = inspectorChainKey(index);
        const collapsed = state.inspectorChainCollapsed[key];
        return `<div class="inspector-card ${collapsed ? "chain-collapsed" : ""}">
          <div class="inspector-head"><h3>${escapeHtml(chain.title)}</h3><div class="inspector-actions"><button data-toggle-inspector-chain="${key}">${inspectorChainToggleLabel(index)}</button></div></div>
          <div class="chain-body">${renderValueList(chain.values, time)}${renderParameterList(chain.params)}</div>
        </div>`;
      }

      function bindInspectorButtons() {
        document.querySelectorAll("[data-toggle-inspector]").forEach((button) => {
          button.addEventListener("click", () => {
            state.inspectorCollapsed = !state.inspectorCollapsed;
            renderInspector();
          });
        });
        document.querySelectorAll("[data-toggle-inspector-chain]").forEach((button) => {
          button.addEventListener("click", () => {
            const key = button.dataset.toggleInspectorChain;
            state.inspectorChainCollapsed[key] = !state.inspectorChainCollapsed[key];
            renderInspector();
          });
        });
        document.querySelector("#clear-inspect-inline")?.addEventListener("click", clearInspect);
      }

      function fontScaleLabel() {
        if (state.fontScale === "compact") return "Font: Compact";
        if (state.fontScale === "large") return "Font: Large";
        return "Font: Normal";
      }

      function applyFontScale() {
        document.body.classList.toggle("font-compact", state.fontScale === "compact");
        document.body.classList.toggle("font-large", state.fontScale === "large");
        const button = document.querySelector("#font-scale");
        if (button) button.textContent = fontScaleLabel();
        renderAllCharts();
      }

      function cycleFontScale() {
        state.fontScale = state.fontScale === "normal" ? "large" : state.fontScale === "large" ? "compact" : "normal";
        applyFontScale();
      }

      function renderInspector() {
        const node = document.querySelector("#time-inspector");
        if (!node) return;
        if (!inspectorContext) {
          node.innerHTML = "";
          return;
        }
        const collapsedClass = state.inspectorCollapsed ? " inspector-collapsed" : "";
        const time = state.inspectorTime;
        if (!finite(time)) {
          node.innerHTML = `<div class="inspector${collapsedClass}"><div class="inspector-card"><div class="inspector-head"><h3>Inspector</h3><div class="inspector-actions"><button data-toggle-inspector>${inspectorToggleLabel()}</button></div></div><div class="inspector-body"><p>点击图像上的时间点开始检查。</p></div></div></div>`;
          bindInspectorButtons();
          return;
        }
        const mode = findModeAt(time);
        const mission = missionInfoAt(time);
        const modeText = mode ? `${mode.name} ${fmt.format(mode.start_s)}..${fmt.format(mode.end_s)}s` : "unknown";
        node.innerHTML = `<div class="inspector${collapsedClass}">
          <div class="inspector-card">
            <div class="inspector-head"><h3>Inspector</h3><div class="inspector-actions"><button data-toggle-inspector>${inspectorToggleLabel()}</button><button id="clear-inspect-inline">Clear inspect</button></div></div>
            <div class="inspector-body"><div class="kv-grid">
              <div class="kv"><span>time</span><strong>${fmt.format(time)}s</strong></div>
              <div class="kv"><span>mode</span><strong>${escapeHtml(modeText)}</strong></div>
              <div class="kv"><span>mission</span><strong>${escapeHtml(mission.label)} ${statusPill(mission.status)}</strong></div>
              <div class="kv"><span>target</span><strong title="${escapeHtml(mission.params || "")}">${escapeHtml(mission.detail || "")}</strong></div>
            </div></div>
          </div>
          <div class="inspector-body">${controlChains.map((chain, index) => renderInspectorChain(chain, index, time)).join("")}</div>
        </div>`;
        bindInspectorButtons();
      }

      function clearInspect() {
        state.inspectorTime = null;
        state.pinned = {};
        state.hover = {};
        renderInspector();
        renderAllCharts();
      }

      function setInspectorTime(time) {
        state.inspectorTime = time;
        renderInspector();
        renderAllCharts();
      }

      function table(rows, columns, limit = 12) {
        const visible = limit === null ? rows : rows.slice(0, limit);
        if (!visible.length) return `<p>No data.</p>`;
        const head = columns.map((column) => `<th>${column.label}</th>`).join("");
        const body = visible
          .map(
            (row) =>
              `<tr>${columns
                .map((column) => `<td>${column.html ? column.html(row) : escapeHtml(column.format ? column.format(row[column.key], row) : (row[column.key] ?? ""))}</td>`)
                .join("")}</tr>`,
          )
          .join("");
        return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
      }

      function layer(index, title, description, chartHtml, sideHtml) {
        return `<section class="layer collapsed" data-layer="${index}">
          <div class="layer-head">
            <div><h2>${title}</h2><p>${description}</p></div>
            <div class="layer-index">Layer ${index}</div>
            <button class="layer-toggle" data-toggle-layer="${index}">展开</button>
          </div>
          <div class="layer-body">
            <div class="panel">${chartHtml}</div>
            <div class="panel stack">${sideHtml}</div>
          </div>
        </section>`;
      }

      function chartPanel(id, small = false) {
        return `<div class="chart-shell ${small ? "small" : ""}">
          <canvas id="${id}" data-chart="${id}"></canvas>
          <div class="readout" id="${id}-readout"></div>
        </div>
        <div class="chart-control-bar">
          <button data-scale-reset="${id}">Reset scale</button>
          <button data-scale-in="${id}">Scale +</button>
          <button data-scale-out="${id}">Scale -</button>
          <button data-href-clear="${id}">Clear Y refs</button>
        </div>
        <div class="legend" id="${id}-legend"></div>`;
      }

      function finite(value) {
        return Number.isFinite(value);
      }

      function series(rows, yKey, color, label, xKey = "time_s") {
        return {
          label,
          color,
          points: rows
            .map((row) => ({ x: Number(row[xKey]), y: Number(row[yKey]), row }))
            .filter((point) => finite(point.x) && finite(point.y)),
        };
      }

      function stats(rows, key) {
        const values = rows.map((row) => Number(row[key])).filter(finite);
        if (!values.length) return "n/a";
        return `${fmt.format(Math.min(...values))}..${fmt.format(Math.max(...values))}`;
      }

      function modeName(row) {
        return row.name || `MODE_${row.mode_num ?? row.ModeNum ?? row.Mode}`;
      }

      function currentSegments() {
        return modeData.segments.filter((segment) => segment.end_s >= state.range.start && segment.start_s <= state.range.end);
      }

      function setRange(start, end, source = "custom") {
        const full = state.fullRange;
        const minWidth = Math.max((full.end - full.start) * 0.002, 0.25);
        let nextStart = Number(start);
        let nextEnd = Number(end);
        if (!finite(nextStart) || !finite(nextEnd) || nextEnd <= nextStart) return;
        if (nextEnd - nextStart < minWidth) {
          const mid = (nextStart + nextEnd) / 2;
          nextStart = mid - minWidth / 2;
          nextEnd = mid + minWidth / 2;
        }
        state.range = { start: nextStart, end: nextEnd };
        updateRangeText(source);
        renderAllCharts();
      }

      function focusMode(name) {
        state.activeMode = name;
        if (name === "all") {
          setRange(state.fullRange.start, state.fullRange.end, "all");
          renderModeButtons();
          return;
        }
        const segments = modeData.segments.filter((segment) => segment.name === name);
        if (!segments.length) return;
        const start = Math.min(...segments.map((segment) => segment.start_s));
        const end = Math.max(...segments.map((segment) => segment.end_s));
        setRange(start, end, name);
        renderModeButtons();
      }

      function updateRangeText(source) {
        const node = document.querySelector("#range-text");
        if (!node) return;
        const modes = [...new Set(currentSegments().map((segment) => segment.name))].join(" / ") || "n/a";
        node.textContent = `${source}: ${fmt.format(state.range.start)}s .. ${fmt.format(state.range.end)}s | modes: ${modes}`;
      }

      function renderModeButtons() {
        const holder = document.querySelector("#mode-buttons");
        if (!holder) return;
        const names = ["all", ...new Set(modeData.segments.map((segment) => segment.name))];
        holder.innerHTML = names
          .map((name) => `<button class="${state.activeMode === name ? "active" : ""}" data-mode="${name}">${name === "all" ? "Whole Flight" : name}</button>`)
          .join("");
        holder.querySelectorAll("button").forEach((button) => {
          button.addEventListener("click", () => focusMode(button.dataset.mode));
        });
      }

      function renderToolbar() {
        document.querySelector("#timeline-toolbar").innerHTML = `<div class="toolbar">
          <div class="toolbar-row"><strong>Time / Flight Mode 横轴</strong><span class="range-text" id="range-text"></span></div>
          <div class="mode-buttons" id="mode-buttons"></div>
          <div class="chart-actions">
            <button id="zoom-out">Zoom out</button>
            <button id="font-scale">Font: Normal</button>
            <button id="clear-inspect">Clear inspect</button>
            <button id="clear-pins">Clear readouts</button>
            <button id="clear-time-refs">Clear T refs</button>
          </div>
        </div>`;
        renderModeButtons();
        updateRangeText("all");
        document.querySelector("#zoom-out").addEventListener("click", () => focusMode("all"));
        document.querySelector("#font-scale").addEventListener("click", cycleFontScale);
        applyFontScale();
        document.querySelector("#clear-inspect").addEventListener("click", clearInspect);
        document.querySelector("#clear-pins").addEventListener("click", () => {
          state.pinned = {};
          renderAllCharts();
        });
        document.querySelector("#clear-time-refs").addEventListener("click", () => {
          state.timeRefs = [];
          renderAllCharts();
        });
      }

      function yRangeForSeries(seriesList) {
        let minY = Infinity;
        let maxY = -Infinity;
        for (const seriesItem of seriesList) {
          for (const point of seriesItem.points) {
            if (!finite(point.y)) continue;
            minY = Math.min(minY, point.y);
            maxY = Math.max(maxY, point.y);
          }
        }
        if (!finite(minY) || minY === maxY) {
          minY = 0;
          maxY = 1;
        }
        const padY = (maxY - minY) * 0.08 || 1;
        return { minY: minY - padY, maxY: maxY + padY };
      }

      function cloneRange(range) {
        return { minY: range.minY, maxY: range.maxY };
      }

      function resetLineScale(config) {
        config.yView = cloneRange(config.defaultYView || yRangeForSeries(config.series));
      }

      function zoomLineY(config, factor, anchorRatio = 0.5) {
        if (!config.yView) resetLineScale(config);
        const span = config.yView.maxY - config.yView.minY;
        const nextSpan = Math.max(span * factor, 1e-9);
        const anchor = config.yView.maxY - anchorRatio * span;
        config.yView = {
          minY: anchor - (1 - anchorRatio) * nextSpan,
          maxY: anchor + anchorRatio * nextSpan,
        };
      }

      function linePad() {
        return { left: 52, right: 16, top: 38, bottom: 34 };
      }

      function linePlot(rect) {
        const pad = linePad();
        return { pad, plotW: rect.width - pad.left - pad.right, plotH: rect.height - pad.top - pad.bottom };
      }

      function yFromCanvas(config, localY, rect) {
        const { pad, plotH } = linePlot(rect);
        const ratio = (localY - pad.top) / Math.max(1, plotH);
        return config.yView.maxY - ratio * (config.yView.maxY - config.yView.minY);
      }

      function timeFromCanvas(localX, rect) {
        const { pad, plotW } = linePlot(rect);
        const ratio = (localX - pad.left) / Math.max(1, plotW);
        return state.range.start + ratio * (state.range.end - state.range.start);
      }

      function nearestIndexByPixel(values, pixelFn, pixel, threshold = 14) {
        let best = { index: -1, distance: Infinity };
        values.forEach((value, index) => {
          const distance = Math.abs(pixelFn(value) - pixel);
          if (distance < best.distance) best = { index, distance };
        });
        return best.distance <= threshold ? best.index : -1;
      }

      function visibleSeries(config) {
        const hidden = state.hidden[config.id] || {};
        return config.series.filter((seriesItem) => !hidden[seriesItem.label]);
      }

      function downsample(points, max = 1100) {
        if (points.length <= max) return points;
        const step = Math.ceil(points.length / max);
        return points.filter((_, index) => index % step === 0);
      }

      function nearestPoint(config, time) {
        let best = null;
        for (const seriesItem of visibleSeries(config)) {
          let lo = 0;
          let hi = seriesItem.points.length - 1;
          while (lo < hi) {
            const mid = Math.floor((lo + hi) / 2);
            if (seriesItem.points[mid].x < time) lo = mid + 1;
            else hi = mid;
          }
          for (const index of [lo - 1, lo, lo + 1]) {
            const point = seriesItem.points[index];
            if (!point) continue;
            const distance = Math.abs(point.x - time);
            if (!best || distance < best.distance) best = { ...point, label: seriesItem.label, color: seriesItem.color, distance };
          }
        }
        return best;
      }

      function cssVar(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }

      function currentFontScale() {
        return Number(getComputedStyle(document.body).getPropertyValue("--font-scale")) || 1;
      }

      function canvasFont(px) {
        return `${Math.round(px * currentFontScale())}px Avenir Next, sans-serif`;
      }

      function modeFill(name) {
        if (name === "AUTO") return cssVar("--mode-auto");
        if (name === "STABILIZE") return cssVar("--mode-stabilize");
        if (name === "MANUAL") return cssVar("--mode-manual");
        return cssVar("--mode-other");
      }

      function drawZeroLine(ctx, yScale, yRange, pad, plotW) {
        if (yRange.minY > 0 || yRange.maxY < 0) return;
        const y = yScale(0);
        ctx.save();
        ctx.strokeStyle = cssVar("--zero-line");
        ctx.lineWidth = 1.6;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(pad.left + plotW, y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = cssVar("--zero-line");
        ctx.fillText("0", pad.left + 4, y - 5);
        ctx.restore();
      }

      function drawModeTransitions(ctx, chart, pad, plotW, plotH) {
        ctx.save();
        ctx.strokeStyle = cssVar("--mode-transition");
        ctx.fillStyle = cssVar("--mode-text");
        ctx.lineWidth = 1.2;
        ctx.setLineDash([3, 4]);
        ctx.font = canvasFont(11);
        for (const segment of modeData.segments) {
          const time = Number(segment.mode_time_s);
          if (!finite(time) || time < state.range.start || time > state.range.end) continue;
          const x = chart.xScale(time);
          if (x <= pad.left || x >= pad.left + plotW) continue;
          ctx.beginPath();
          ctx.moveTo(x, pad.top);
          ctx.lineTo(x, pad.top + plotH);
          ctx.stroke();
          ctx.save();
          ctx.translate(x + 4, pad.top + 6);
          ctx.rotate(-Math.PI / 2);
          ctx.fillText(segment.name, 0, 0);
          ctx.restore();
        }
        ctx.restore();
      }

      function drawHorizontalRefs(ctx, config, yScale, yRange, pad, plotW) {
        const refs = state.hRefs[config.id] || [];
        if (!refs.length) return;
        ctx.save();
        ctx.strokeStyle = cssVar("--custom-h-ref");
        ctx.fillStyle = cssVar("--custom-h-ref");
        ctx.lineWidth = 1.4;
        ctx.setLineDash([10, 5]);
        ctx.font = canvasFont(12);
        for (const value of refs) {
          if (!finite(value) || value < yRange.minY || value > yRange.maxY) continue;
          const y = yScale(value);
          ctx.beginPath();
          ctx.moveTo(pad.left, y);
          ctx.lineTo(pad.left + plotW, y);
          ctx.stroke();
          ctx.fillText(`Y ${fmt.format(value)}`, pad.left + 8, y - 6);
        }
        ctx.restore();
      }

      function drawInspectorTime(ctx, chart, pad, plotW, plotH) {
        const time = state.inspectorTime;
        if (!finite(time) || time < state.range.start || time > state.range.end) return;
        const x = chart.xScale(time);
        if (x <= pad.left || x >= pad.left + plotW) return;
        ctx.save();
        ctx.strokeStyle = cssVar("--inspector-time");
        ctx.fillStyle = cssVar("--inspector-time");
        ctx.lineWidth = 2;
        ctx.setLineDash([2, 4]);
        ctx.beginPath();
        ctx.moveTo(x, pad.top);
        ctx.lineTo(x, pad.top + plotH);
        ctx.stroke();
        ctx.font = canvasFont(12);
        ctx.fillText(`inspect ${fmt.format(time)}s`, x + 5, pad.top + 14);
        ctx.restore();
      }

      function drawTimeRefs(ctx, chart, pad, plotW, plotH) {
        if (!state.timeRefs.length) return;
        ctx.save();
        ctx.strokeStyle = cssVar("--custom-time-ref");
        ctx.fillStyle = cssVar("--custom-time-ref");
        ctx.lineWidth = 1.5;
        ctx.setLineDash([9, 5]);
        ctx.font = canvasFont(12);
        for (const time of state.timeRefs) {
          if (!finite(time) || time < state.range.start || time > state.range.end) continue;
          const x = chart.xScale(time);
          if (x <= pad.left || x >= pad.left + plotW) continue;
          ctx.beginPath();
          ctx.moveTo(x, pad.top);
          ctx.lineTo(x, pad.top + plotH);
          ctx.stroke();
          ctx.save();
          ctx.translate(x + 4, pad.top + plotH - 8);
          ctx.rotate(-Math.PI / 2);
          ctx.fillText(`T ${fmt.format(time)}s`, 0, 0);
          ctx.restore();
        }
        ctx.restore();
      }

      function drawModeBand(ctx, chart, pad, plotW) {
        const y = pad.top - 22;
        const height = 18;
        ctx.save();
        ctx.font = canvasFont(12);
        for (const segment of currentSegments()) {
          const x0 = chart.xScale(Math.max(segment.start_s, state.range.start));
          const x1 = chart.xScale(Math.min(segment.end_s, state.range.end));
          if (x1 <= pad.left || x0 >= pad.left + plotW) continue;
          ctx.fillStyle = modeFill(segment.name);
          ctx.fillRect(x0, y, Math.max(2, x1 - x0), height);
          ctx.strokeStyle = cssVar("--line");
          ctx.strokeRect(x0, y, Math.max(2, x1 - x0), height);
          if (x1 - x0 > 44) {
            ctx.fillStyle = cssVar("--mode-text");
            ctx.fillText(segment.name, x0 + 5, y + 13);
          }
        }
        ctx.restore();
      }

      function drawLineChart(config) {
        const canvas = document.querySelector(`#${config.id}`);
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = Math.max(1, Math.floor(rect.width * dpr));
        canvas.height = Math.max(1, Math.floor(rect.height * dpr));
        ctx.scale(dpr, dpr);

        const width = rect.width;
        const height = rect.height;
        const pad = linePad();
        const plotW = width - pad.left - pad.right;
        const plotH = height - pad.top - pad.bottom;
        const xStart = state.range.start;
        const xEnd = state.range.end;
        const activeSeries = visibleSeries(config);
        if (!config.yView) resetLineScale(config);
        const yRange = config.yView;
        const xScale = (x) => pad.left + ((x - xStart) / (xEnd - xStart)) * plotW;
        const yScale = (y) => pad.top + (1 - (y - yRange.minY) / (yRange.maxY - yRange.minY)) * plotH;
        config.xScale = xScale;

        ctx.clearRect(0, 0, width, height);
        drawModeBand(ctx, config, pad, plotW);
        ctx.strokeStyle = "#d7ded6";
        ctx.lineWidth = 1;
        ctx.font = canvasFont(12);
        ctx.fillStyle = "#607068";

        for (let i = 0; i <= 4; i++) {
          const y = pad.top + (plotH * i) / 4;
          ctx.beginPath();
          ctx.moveTo(pad.left, y);
          ctx.lineTo(width - pad.right, y);
          ctx.stroke();
          const label = yRange.maxY - ((yRange.maxY - yRange.minY) * i) / 4;
          ctx.fillText(fmt.format(label), 6, y + 4);
        }

        for (let i = 0; i <= 5; i++) {
          const x = pad.left + (plotW * i) / 5;
          const value = xStart + ((xEnd - xStart) * i) / 5;
          ctx.beginPath();
          ctx.moveTo(x, pad.top);
          ctx.lineTo(x, pad.top + plotH);
          ctx.stroke();
          ctx.fillText(fmt.format(value) + "s", x - 15, height - 12);
        }

        if (config.yLabel) ctx.fillText(config.yLabel, 6, 14);
        ctx.fillText("flight mode", pad.left, 14);

        ctx.save();
        ctx.beginPath();
        ctx.rect(pad.left, pad.top, plotW, plotH);
        ctx.clip();
        for (const seriesItem of activeSeries) {
          const points = downsample(seriesItem.points.filter((point) => point.x >= xStart && point.x <= xEnd));
          ctx.strokeStyle = seriesItem.color;
          ctx.lineWidth = seriesItem.width || 1.8;
          ctx.beginPath();
          let started = false;
          for (const point of points) {
            const x = xScale(point.x);
            const y = yScale(point.y);
            if (!started) {
              ctx.moveTo(x, y);
              started = true;
            } else {
              ctx.lineTo(x, y);
            }
          }
          ctx.stroke();
        }
        ctx.restore();

        drawModeTransitions(ctx, config, pad, plotW, plotH);
        drawTimeRefs(ctx, config, pad, plotW, plotH);
        drawInspectorTime(ctx, config, pad, plotW, plotH);
        drawZeroLine(ctx, yScale, yRange, pad, plotW);
        drawHorizontalRefs(ctx, config, yScale, yRange, pad, plotW);

        const marker = state.pinned[config.id] || state.hover[config.id];
        const readout = document.querySelector(`#${config.id}-readout`);
        if (marker) {
          const point = nearestPoint(config, marker.time);
          if (point) {
            const x = xScale(point.x);
            ctx.strokeStyle = "rgba(23, 33, 29, 0.38)";
            ctx.beginPath();
            ctx.moveTo(x, pad.top);
            ctx.lineTo(x, pad.top + plotH);
            ctx.stroke();
            const items = activeSeries.map((seriesItem) => nearestPoint({ ...config, series: [seriesItem] }, point.x)).filter(Boolean);
            for (const item of items) {
              ctx.fillStyle = item.color;
              ctx.beginPath();
              ctx.arc(xScale(item.x), yScale(item.y), 3, 0, Math.PI * 2);
              ctx.fill();
            }
            const mode = currentSegments().find((segment) => point.x >= segment.start_s && point.x <= segment.end_s);
            readout.innerHTML = `${state.pinned[config.id] ? "已锁定" : "悬停"}: ${fmt.format(point.x)}s | ${mode ? mode.name : "MODE?"} | ${items
              .map((item) => `${escapeHtml(item.label)}=${fmt.format(item.y)}`)
              .join(" | ")}`;
          }
        } else {
          readout.textContent = "";
        }
      }

      function validGeo(lat, lon) {
        return finite(lat) && finite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180 && Math.abs(lat) > 1e-6 && Math.abs(lon) > 1e-6;
      }

      function projectTrack(config) {
        if (config.projected) return config.projected;
        const posRaw = config.posRows
          .filter((row) => validGeo(Number(row.Lat), Number(row.Lng)))
          .map((row) => ({ kind: "pos", lat: Number(row.Lat), lon: Number(row.Lng), time_s: Number(row.time_s), row }));
        const refSource = posRaw.length ? posRaw : config.waypointRows
          .filter((row) => validGeo(Number(row.lat), Number(row.lon)))
          .map((row) => ({ lat: Number(row.lat), lon: Number(row.lon) }));
        const refLat = refSource.reduce((sum, point) => sum + point.lat, 0) / Math.max(1, refSource.length);
        const refLon = refSource.reduce((sum, point) => sum + point.lon, 0) / Math.max(1, refSource.length);
        const latScale = 110540;
        const lonScale = 111320 * Math.cos((refLat * Math.PI) / 180);
        const project = (point) => ({
          ...point,
          x: (point.lon - refLon) * lonScale,
          y: (point.lat - refLat) * latScale,
        });
        const projectedPos = posRaw.map(project);
        const posBounds = projectedPos.length ? {
          minX: Math.min(...projectedPos.map((point) => point.x)),
          maxX: Math.max(...projectedPos.map((point) => point.x)),
          minY: Math.min(...projectedPos.map((point) => point.y)),
          maxY: Math.max(...projectedPos.map((point) => point.y)),
        } : null;
        const waypointLimitMeters = 3000;
        const projectedWaypoints = config.waypointRows
          .filter((row) => validGeo(Number(row.lat), Number(row.lon)))
          .map((row) => project({ kind: "wp", lat: Number(row.lat), lon: Number(row.lon), row }))
          .filter((point) => !posBounds || (
            point.x >= posBounds.minX - waypointLimitMeters &&
            point.x <= posBounds.maxX + waypointLimitMeters &&
            point.y >= posBounds.minY - waypointLimitMeters &&
            point.y <= posBounds.maxY + waypointLimitMeters
          ));
        config.projected = [...projectedPos, ...projectedWaypoints];
        config.omittedWaypoints = config.waypointRows.length - projectedWaypoints.length;
        return config.projected;
      }

      function fitTrackView(config, plotW, plotH) {
        const points = projectTrack(config);
        if (!points.length) {
          config.mapView = { cx: 0, cy: 0, metersPerPx: 2 };
          config.defaultMapView = { ...config.mapView };
          return;
        }
        const preferred = points.some((point) => point.kind === "pos") ? points.filter((point) => point.kind === "pos") : points.filter((point) => point.kind === "wp");
        const viewPoints = preferred.length ? preferred : points;
        const minX = Math.min(...viewPoints.map((point) => point.x));
        const maxX = Math.max(...viewPoints.map((point) => point.x));
        const minY = Math.min(...viewPoints.map((point) => point.y));
        const maxY = Math.max(...viewPoints.map((point) => point.y));
        const spanX = Math.max(maxX - minX, 80);
        const spanY = Math.max(maxY - minY, 80);
        const rawMetersPerPx = Math.max(spanX / Math.max(1, plotW), spanY / Math.max(1, plotH)) * 1.12;
        const metersPerPx = Math.min(Math.max(rawMetersPerPx, 0.35), 20);
        config.mapView = { cx: (minX + maxX) / 2, cy: (minY + maxY) / 2, metersPerPx };
        config.defaultMapView = { ...config.mapView };
      }

      function resetTrackScale(config) {
        if (config.defaultMapView) config.mapView = { ...config.defaultMapView };
      }

      function zoomTrack(config, factor, anchorX, anchorY, plot) {
        if (!config.mapView) return;
        const beforeX = config.mapView.cx + (anchorX - (plot.left + plot.width / 2)) * config.mapView.metersPerPx;
        const beforeY = config.mapView.cy - (anchorY - (plot.top + plot.height / 2)) * config.mapView.metersPerPx;
        config.mapView.metersPerPx = Math.max(config.mapView.metersPerPx * factor, 0.01);
        config.mapView.cx = beforeX - (anchorX - (plot.left + plot.width / 2)) * config.mapView.metersPerPx;
        config.mapView.cy = beforeY + (anchorY - (plot.top + plot.height / 2)) * config.mapView.metersPerPx;
      }

      function drawTrackChart(config) {
        const canvas = document.querySelector(`#${config.id}`);
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = Math.max(1, Math.floor(rect.width * dpr));
        canvas.height = Math.max(1, Math.floor(rect.height * dpr));
        ctx.scale(dpr, dpr);
        const width = rect.width;
        const height = rect.height;
        const pad = { left: 28, right: 16, top: 22, bottom: 28 };
        const plot = { left: pad.left, top: pad.top, width: width - pad.left - pad.right, height: height - pad.top - pad.bottom };
        if (!config.mapView) fitTrackView(config, plot.width, plot.height);

        const projected = projectTrack(config);
        const posPoints = projected.filter((point) => point.kind === "pos" && point.time_s >= state.range.start && point.time_s <= state.range.end);
        const wpPoints = projected.filter((point) => point.kind === "wp");
        const omittedWaypoints = config.omittedWaypoints || 0;
        const sx = (x) => plot.left + plot.width / 2 + (x - config.mapView.cx) / config.mapView.metersPerPx;
        const sy = (y) => plot.top + plot.height / 2 - (y - config.mapView.cy) / config.mapView.metersPerPx;

        ctx.clearRect(0, 0, width, height);
        ctx.strokeStyle = "#d7ded6";
        ctx.lineWidth = 1;
        const gridMeters = Math.pow(10, Math.floor(Math.log10(config.mapView.metersPerPx * 90)));
        const gridStep = gridMeters < config.mapView.metersPerPx * 42 ? gridMeters * 2 : gridMeters;
        const leftWorld = config.mapView.cx - (plot.width / 2) * config.mapView.metersPerPx;
        const rightWorld = config.mapView.cx + (plot.width / 2) * config.mapView.metersPerPx;
        const bottomWorld = config.mapView.cy - (plot.height / 2) * config.mapView.metersPerPx;
        const topWorld = config.mapView.cy + (plot.height / 2) * config.mapView.metersPerPx;
        for (let x = Math.floor(leftWorld / gridStep) * gridStep; x <= rightWorld; x += gridStep) {
          ctx.beginPath();
          ctx.moveTo(sx(x), plot.top);
          ctx.lineTo(sx(x), plot.top + plot.height);
          ctx.stroke();
        }
        for (let y = Math.floor(bottomWorld / gridStep) * gridStep; y <= topWorld; y += gridStep) {
          ctx.beginPath();
          ctx.moveTo(plot.left, sy(y));
          ctx.lineTo(plot.left + plot.width, sy(y));
          ctx.stroke();
        }

        ctx.save();
        ctx.beginPath();
        ctx.rect(plot.left, plot.top, plot.width, plot.height);
        ctx.clip();
        ctx.strokeStyle = colors.gold;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        wpPoints.forEach((point, index) => {
          if (index === 0) ctx.moveTo(sx(point.x), sy(point.y));
          else ctx.lineTo(sx(point.x), sy(point.y));
        });
        ctx.stroke();

        ctx.strokeStyle = colors.green;
        ctx.lineWidth = 2.3;
        ctx.beginPath();
        downsample(posPoints).forEach((point, index) => {
          if (index === 0) ctx.moveTo(sx(point.x), sy(point.y));
          else ctx.lineTo(sx(point.x), sy(point.y));
        });
        ctx.stroke();

        ctx.fillStyle = colors.gold;
        wpPoints.forEach((point) => {
          ctx.beginPath();
          ctx.arc(sx(point.x), sy(point.y), 3, 0, Math.PI * 2);
          ctx.fill();
        });
        const highlighted = wpPoints.find((point) => Number(point.row?.index) === state.highlightedWaypointIndex);
        if (highlighted) {
          const hx = sx(highlighted.x);
          const hy = sy(highlighted.y);
          ctx.strokeStyle = colors.red;
          ctx.fillStyle = colors.red;
          ctx.lineWidth = 2.8;
          ctx.beginPath();
          ctx.arc(hx, hy, 10, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillText(`#${highlighted.row.index} ${highlighted.row.command_name}`, hx + 12, hy - 8);
        }
        ctx.restore();

        ctx.strokeStyle = "#17211d";
        ctx.strokeRect(plot.left, plot.top, plot.width, plot.height);
        ctx.fillStyle = "#607068";
        ctx.font = canvasFont(12);
        ctx.fillText(`grid ${fmt.format(gridStep)} m`, plot.left, height - 8);
        document.querySelector(`#${config.id}-readout`).textContent = `${fmt.format(state.range.start)}s..${fmt.format(state.range.end)}s 内 POS 点: ${posPoints.length} | 航点: ${wpPoints.length}${omittedWaypoints ? `, 过滤 ${omittedWaypoints} 个无效/远端点` : ""} | 等比例 ${fmt.format(config.mapView.metersPerPx)} m/px`;
      }

      function renderLegend(config) {
        const node = document.querySelector(`#${config.id}-legend`);
        if (!node || config.type === "track") return;
        state.hidden[config.id] ||= {};
        node.innerHTML = config.series
          .map(
            (seriesItem) => `<label><input type="checkbox" data-chart-id="${config.id}" data-label="${escapeHtml(seriesItem.label)}" ${state.hidden[config.id][seriesItem.label] ? "" : "checked"}><span class="swatch" style="background:${seriesItem.color}"></span>${escapeHtml(seriesItem.label)}</label>`,
          )
          .join("");
        node.querySelectorAll("input").forEach((input) => {
          input.addEventListener("change", () => {
            state.hidden[input.dataset.chartId][input.dataset.label] = !input.checked;
            renderAllCharts();
          });
        });
      }

      function prepareChartScale(config) {
        if (config.type === "line") {
          config.defaultYView = yRangeForSeries(config.series);
          resetLineScale(config);
        }
      }

      function bindScaleControls(config) {
        const reset = document.querySelector(`[data-scale-reset="${config.id}"]`);
        const zoomIn = document.querySelector(`[data-scale-in="${config.id}"]`);
        const zoomOut = document.querySelector(`[data-scale-out="${config.id}"]`);
        const hClear = document.querySelector(`[data-href-clear="${config.id}"]`);
        if (!reset || !zoomIn || !zoomOut || config.controlsBound) return;
        config.controlsBound = true;
        if (config.type === "track") {
          reset.textContent = "Reset map";
          zoomIn.textContent = "Map +";
          zoomOut.textContent = "Map -";
          hClear?.remove();
        } else {
          reset.textContent = "Reset Y";
          zoomIn.textContent = "Y +";
          zoomOut.textContent = "Y -";
        }
        reset.addEventListener("click", () => {
          if (config.type === "track") resetTrackScale(config);
          else resetLineScale(config);
          renderAllCharts();
        });
        zoomIn.addEventListener("click", () => {
          if (config.type === "track") {
            config.mapView.metersPerPx = Math.max(config.mapView.metersPerPx * 0.82, 0.01);
          } else {
            zoomLineY(config, 0.82);
          }
          renderAllCharts();
        });
        zoomOut.addEventListener("click", () => {
          if (config.type === "track") config.mapView.metersPerPx *= 1.22;
          else zoomLineY(config, 1.22);
          renderAllCharts();
        });
        hClear?.addEventListener("click", () => {
          state.hRefs[config.id] = [];
          renderAllCharts();
        });
      }

      function renderAllCharts() {
        for (const config of charts.values()) {
          if (config.type === "track") drawTrackChart(config);
          else drawLineChart(config);
        }
      }

      function bindChartEvents(config) {
        const canvas = document.querySelector(`#${config.id}`);
        if (!canvas || config.bound) return;
        config.bound = true;
        const pointers = new Map();
        const pointerPair = () => [...pointers.values()].slice(0, 2);
        const pairMetrics = () => {
          const [a, b] = pointerPair();
          if (!a || !b) return null;
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          return {
            dx: Math.max(Math.abs(dx), 8),
            dy: Math.max(Math.abs(dy), 8),
            distance: Math.max(Math.hypot(dx, dy), 8),
            cx: (a.x + b.x) / 2,
            cy: (a.y + b.y) / 2,
          };
        };
        canvas.addEventListener("wheel", (event) => {
          event.preventDefault();
          const rect = canvas.getBoundingClientRect();
          if (config.type === "track") {
            const pad = { left: 28, right: 16, top: 22, bottom: 28 };
            const plot = { left: pad.left, top: pad.top, width: rect.width - pad.left - pad.right, height: rect.height - pad.top - pad.bottom };
            zoomTrack(config, event.deltaY < 0 ? 0.82 : 1.22, event.clientX - rect.left, event.clientY - rect.top, plot);
            drawTrackChart(config);
            return;
          }
          if (event.shiftKey) {
            const pad = { left: 52, right: 16, top: 38, bottom: 34 };
            const plotH = rect.height - pad.top - pad.bottom;
            const anchorRatio = Math.max(0, Math.min(1, (event.clientY - rect.top - pad.top) / Math.max(1, plotH)));
            zoomLineY(config, event.deltaY < 0 ? 0.82 : 1.22, anchorRatio);
            drawLineChart(config);
            return;
          }
          const ratio = (event.clientX - rect.left) / rect.width;
          const anchor = state.range.start + (state.range.end - state.range.start) * ratio;
          const factor = event.deltaY < 0 ? 0.82 : 1.22;
          const width = (state.range.end - state.range.start) * factor;
          setRange(anchor - width * ratio, anchor + width * (1 - ratio), "wheel");
        }, { passive: false });
        canvas.addEventListener("pointerdown", (event) => {
          canvas.setPointerCapture(event.pointerId);
          pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
          if (pointers.size >= 2) {
            const metrics = pairMetrics();
            const rect = canvas.getBoundingClientRect();
            state.dragging = null;
            if (config.type === "track") {
              state.pinch = {
                chartId: config.id,
                type: "map-pinch",
                distance: metrics.distance,
                mapView: { ...config.mapView },
              };
            } else {
              const centerRatioX = (metrics.cx - rect.left) / rect.width;
              const pad = { left: 52, right: 16, top: 38, bottom: 34 };
              const plotH = rect.height - pad.top - pad.bottom;
              const centerRatioY = Math.max(0, Math.min(1, (metrics.cy - rect.top - pad.top) / Math.max(1, plotH)));
              const xSpan = state.range.end - state.range.start;
              const ySpan = config.yView.maxY - config.yView.minY;
              state.pinch = {
                chartId: config.id,
                type: "plot-pinch",
                dx: metrics.dx,
                dy: metrics.dy,
                centerRatioX,
                centerRatioY,
                centerTime: state.range.start + xSpan * centerRatioX,
                centerY: config.yView.maxY - ySpan * centerRatioY,
                xSpan,
                ySpan,
              };
            }
            return;
          }
          if (config.type === "track") {
            state.dragging = { chartId: config.id, type: "map", x: event.clientX, y: event.clientY, cx: config.mapView.cx, cy: config.mapView.cy };
          } else {
            const rect = canvas.getBoundingClientRect();
            const { pad, plotW, plotH } = linePlot(rect);
            const localX = event.clientX - rect.left;
            const localY = event.clientY - rect.top;
            const yScaleForRef = (value) => pad.top + (1 - (value - config.yView.minY) / (config.yView.maxY - config.yView.minY)) * plotH;
            const xScaleForRef = (value) => pad.left + ((value - state.range.start) / (state.range.end - state.range.start)) * plotW;
            if (localX <= pad.left && localY >= pad.top && localY <= pad.top + plotH) {
              state.hRefs[config.id] ||= [];
              let index = nearestIndexByPixel(state.hRefs[config.id], yScaleForRef, localY);
              if (index < 0) {
                state.hRefs[config.id].push(yFromCanvas(config, localY, rect));
                index = state.hRefs[config.id].length - 1;
              }
              state.dragging = { chartId: config.id, type: "h-ref", index, moved: true };
              renderAllCharts();
              return;
            }
            if (localY >= pad.top + plotH && localX >= pad.left && localX <= pad.left + plotW) {
              let index = nearestIndexByPixel(state.timeRefs, xScaleForRef, localX);
              if (index < 0) {
                state.timeRefs.push(timeFromCanvas(localX, rect));
                index = state.timeRefs.length - 1;
              }
              state.dragging = { chartId: config.id, type: "time-ref", index, moved: true };
              renderAllCharts();
              return;
            }
            state.dragging = {
              chartId: config.id,
              type: "plot",
              x: event.clientX,
              y: event.clientY,
              start: state.range.start,
              end: state.range.end,
              minY: config.yView.minY,
              maxY: config.yView.maxY,
            };
          }
        });
        canvas.addEventListener("pointermove", (event) => {
          if (pointers.has(event.pointerId)) pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
          const rect = canvas.getBoundingClientRect();
          if (state.pinch?.chartId === config.id && pointers.size >= 2) {
            const metrics = pairMetrics();
            if (!metrics) return;
            state.skipClick = config.id;
            if (state.pinch.type === "map-pinch") {
              config.mapView = { ...state.pinch.mapView };
              config.mapView.metersPerPx = Math.max(state.pinch.mapView.metersPerPx * (state.pinch.distance / metrics.distance), 0.01);
              drawTrackChart(config);
            } else if (state.pinch.type === "plot-pinch") {
              const nextXSpan = Math.max(state.pinch.xSpan * (state.pinch.dx / metrics.dx), 0.25);
              const nextYSpan = Math.max(state.pinch.ySpan * (state.pinch.dy / metrics.dy), 1e-9);
              config.yView = {
                minY: state.pinch.centerY - (1 - state.pinch.centerRatioY) * nextYSpan,
                maxY: state.pinch.centerY + state.pinch.centerRatioY * nextYSpan,
              };
              setRange(
                state.pinch.centerTime - nextXSpan * state.pinch.centerRatioX,
                state.pinch.centerTime + nextXSpan * (1 - state.pinch.centerRatioX),
                "pinch",
              );
            }
            return;
          }
          if (state.dragging?.chartId === config.id && state.dragging.type === "map") {
            const dx = event.clientX - state.dragging.x;
            const dy = event.clientY - state.dragging.y;
            state.dragging.moved ||= Math.abs(dx) + Math.abs(dy) > 4;
            config.mapView.cx = state.dragging.cx - dx * config.mapView.metersPerPx;
            config.mapView.cy = state.dragging.cy + dy * config.mapView.metersPerPx;
            drawTrackChart(config);
            return;
          }
          const time = state.range.start + ((event.clientX - rect.left) / rect.width) * (state.range.end - state.range.start);
          if (state.dragging?.chartId === config.id && state.dragging.type === "h-ref") {
            state.hRefs[config.id][state.dragging.index] = yFromCanvas(config, event.clientY - rect.top, rect);
            state.dragging.moved = true;
            renderAllCharts();
          } else if (state.dragging?.chartId === config.id && state.dragging.type === "time-ref") {
            state.timeRefs[state.dragging.index] = timeFromCanvas(event.clientX - rect.left, rect);
            state.dragging.moved = true;
            renderAllCharts();
          } else if (state.dragging?.chartId === config.id && state.dragging.type === "plot") {
            const pad = { left: 52, right: 16, top: 38, bottom: 34 };
            const plotH = rect.height - pad.top - pad.bottom;
            const dx = event.clientX - state.dragging.x;
            const dy = event.clientY - state.dragging.y;
            state.dragging.moved ||= Math.abs(dx) + Math.abs(dy) > 4;
            const dt = (-dx / rect.width) * (state.dragging.end - state.dragging.start);
            const span = state.dragging.maxY - state.dragging.minY;
            const yDelta = (dy / Math.max(1, plotH)) * span;
            config.yView = { minY: state.dragging.minY + yDelta, maxY: state.dragging.maxY + yDelta };
            setRange(state.dragging.start + dt, state.dragging.end + dt, "pan");
          } else if (config.type !== "track") {
            state.hover[config.id] = { time };
            drawLineChart(config);
          }
        });
        function endPointer(event) {
          pointers.delete(event.pointerId);
          const moved = state.dragging?.moved || state.pinch?.chartId === config.id;
          state.dragging = null;
          if (state.pinch?.chartId === config.id) state.pinch = null;
          if (moved) {
            state.skipClick = config.id;
            setTimeout(() => {
              if (state.skipClick === config.id) state.skipClick = null;
            }, 0);
          }
          if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
        }

        canvas.addEventListener("pointerup", endPointer);
        canvas.addEventListener("pointercancel", endPointer);
        canvas.addEventListener("pointerleave", (event) => {
          if (event.pointerType !== "touch") pointers.delete(event.pointerId);
          state.dragging = null;
          if (!pointers.size && state.pinch?.chartId === config.id) state.pinch = null;
          if (!state.pinned[config.id]) {
            delete state.hover[config.id];
            renderAllCharts();
          }
        });
        canvas.addEventListener("click", (event) => {
          if (config.type === "track") return;
          if (state.skipClick === config.id) {
            state.skipClick = null;
            return;
          }
          const rect = canvas.getBoundingClientRect();
          const time = state.range.start + ((event.clientX - rect.left) / rect.width) * (state.range.end - state.range.start);
          state.pinned[config.id] = { time };
          setInspectorTime(time);
        });
        canvas.addEventListener("dblclick", () => {
          delete state.pinned[config.id];
          renderAllCharts();
        });
      }

      function buildDataCatalog(groups) {
        const catalog = {};
        for (const group of groups) {
          for (const [messageName, rows] of Object.entries(group.messages || {})) {
            if (!Array.isArray(rows) || !rows.length) continue;
            catalog[messageName] = rows;
          }
        }
        return catalog;
      }

      function numericFields(rows) {
        const fields = new Set();
        for (const row of rows.slice(0, 250)) {
          for (const [key, value] of Object.entries(row)) {
            if (key === "TimeUS" || key === "time_s") continue;
            if (finite(Number(value))) fields.add(key);
          }
        }
        return [...fields].sort();
      }

      function bindCustomChartControls(catalog) {
        const messageSelect = document.querySelector("#custom-message");
        const fieldSelect = document.querySelector("#custom-field");
        const addButton = document.querySelector("#custom-add");
        const clearButton = document.querySelector("#custom-clear");
        if (!messageSelect || !fieldSelect || !addButton || !clearButton) return;
        const messages = Object.keys(catalog).sort();
        messageSelect.innerHTML = messages.map((name) => `<option value="${name}">${name} (${catalog[name].length})</option>`).join("");
        const refreshFields = () => {
          const rows = catalog[messageSelect.value] || [];
          const fields = numericFields(rows);
          fieldSelect.innerHTML = fields.map((field) => `<option value="${field}">${field}</option>`).join("");
        };
        messageSelect.addEventListener("change", refreshFields);
        refreshFields();
        addButton.addEventListener("click", () => {
          const messageName = messageSelect.value;
          const fieldName = fieldSelect.value;
          if (!messageName || !fieldName) return;
          const config = charts.get("custom-chart");
          const palette = [colors.blue, colors.green, colors.red, colors.gold, colors.violet, colors.teal, colors.gray];
          config.series.push(series(catalog[messageName], fieldName, palette[config.series.length % palette.length], `${messageName}.${fieldName}`));
          config.defaultYView = yRangeForSeries(config.series);
          resetLineScale(config);
          renderLegend(config);
          renderAllCharts();
        });
        clearButton.addEventListener("click", () => {
          const config = charts.get("custom-chart");
          config.series = [];
          state.hidden[config.id] = {};
          state.hRefs[config.id] = [];
          config.defaultYView = yRangeForSeries(config.series);
          resetLineScale(config);
          renderLegend(config);
          renderAllCharts();
        });
      }

      function bindWaypointButtons() {
        document.querySelectorAll("[data-wp-index]").forEach((button) => {
          button.addEventListener("click", () => {
            state.highlightedWaypointIndex = Number(button.dataset.wpIndex);
            document.querySelectorAll("[data-wp-index]").forEach((item) => {
              item.classList.toggle("active", Number(item.dataset.wpIndex) === state.highlightedWaypointIndex);
            });
            renderAllCharts();
          });
        });
      }

      function registerCharts(configs) {
        charts.clear();
        for (const config of configs) {
          prepareChartScale(config);
          charts.set(config.id, config);
          renderLegend(config);
          bindScaleControls(config);
          bindChartEvents(config);
        }
        renderAllCharts();
      }

              { key: "time_s", label: "time_s", format: (v) => fmt.format(v) },

              { key: "alt", label: "Alt", format: (v) => fmt.format(v) },
            ], 12)}<h3>Recent messages</h3>${table(events.messages.MSG.slice(-8), [
              { key: "time_s", label: "time_s", format: (v) => fmt.format(v) },
              { key: "Message", label: "Message" },
            ], 8)}`,
          ),
          layer(

            chartPanel("track-chart"),
            `<h3>Track bounds</h3><div class="note">Lat ${stats(track.messages.POS, "Lat")}<br>Lng ${stats(track.messages.POS, "Lng")}<br>Alt ${stats(track.messages.POS, "Alt")}</div><h3>Waypoints</h3><div class="table-scroll">${table(summary.waypoints, [
              { key: "index", label: "#" },
              { key: "command_name", label: "Command", html: (row) => `<button class="wp-button ${state.highlightedWaypointIndex === row.index ? "active" : ""}" data-wp-index="${row.index}">${escapeHtml(row.command_name)}</button>` },

              { key: "lon", label: "Lon", format: (v) => fmt.format(v) },
              { key: "alt", label: "Alt", format: (v) => fmt.format(v) },
            ], null)}</div>`,
          ),
          layer(
            2,
            "L1 Navigation",
            "横向误差、目标滚转、实际滚转。",
            chartPanel("l1-chart"),
            `<h3>L1 data</h3><div class="note">NTUN.Dist ${stats(navigation.messages.NTUN, "Dist")} m<br>NTUN.XT ${stats(navigation.messages.NTUN, "XT")} m<br>CTUN.NavRoll ${stats(navigation.messages.CTUN, "NavRoll")} deg</div>${renderLayerParams(summary, "l1")}`,
          ),
          layer(
            3,
            "TECS Energy",
            "高度、速度、俯仰、油门需求。",
            chartPanel("tecs-chart"),
            `<h3>TECS rate</h3><div class="note">TECS records: ${tecs.messages.TECS.length}<br>TEC2 records: ${tecs.messages.TEC2.length}<br>ARSP records: ${tecs.messages.ARSP.length}</div>${renderLayerParams(summary, "tecs")}`,
          ),
          layer(
            4,
            "Attitude / Rate",
            "姿态目标、实际姿态、Rate PID。",
            `${chartPanel("att-chart")}<div style="height:12px"></div>${chartPanel("pid-chart", true)}`,
            `<h3>Rate PID availability</h3><div class="note">PIDR ${pid.messages.PIDR.length}<br>PIDP ${pid.messages.PIDP.length}<br>PIDY ${pid.messages.PIDY.length}</div>${renderLayerParams(summary, "attitude")}`,
          ),
          layer(
            5,
            "Motion / IMU",
            "IMU 加速度、角速度、振动、EKF 速度。",
            chartPanel("motion-chart"),
            `<h3>Motion records</h3><div class="note">IMU ${motion.messages.IMU.length}<br>VIBE ${motion.messages.VIBE.length}<br>XKF1 ${motion.messages.XKF1.length}<br>XKF2 ${motion.messages.XKF2.length}<br>RATE ${motion.messages.RATE.length}</div>${renderLayerParams(summary, "motion")}`,
          ),
          layer(
            6,
            "I/O Outputs",
            "RC 输入和 PWM 输出。",
            chartPanel("io-chart"),
            `<h3>Output ranges</h3><div class="note">C1 ${stats(io.messages.RCOU, "C1")}<br>C2 ${stats(io.messages.RCOU, "C2")}<br>C3 ${stats(io.messages.RCOU, "C3")}<br>C4 ${stats(io.messages.RCOU, "C4")}</div>${renderLayerParams(summary, "io")}`,
          ),
          layer(
            7,
            "Custom Data",
            "任意消息字段临时绘图。",
            chartPanel("custom-chart"),
            `<div class="custom-controls"><h3>Build custom chart</h3><label>Message<select id="custom-message"></select></label><label>Numeric field<select id="custom-field"></select></label><button id="custom-add">Add curve</button><button id="custom-clear">Clear custom chart</button></div>`,
          ),
        ].join("");

        document.querySelectorAll("[data-toggle-layer]").forEach((button) => {
          button.addEventListener("click", () => {
            const section = document.querySelector(`[data-layer="${button.dataset.toggleLayer}"]`);
            section.classList.toggle("collapsed");
            button.textContent = section.classList.contains("collapsed") ? "展开" : "收起";
            renderAllCharts();
          });
        });
        bindWaypointButtons();

        registerCharts([
          {
            id: "alt-chart",
            type: "line",
            yLabel: "m",
            series: [
              series(track.messages.POS, "RelHomeAlt", colors.green, "RelHomeAlt"),
              { label: "Waypoint Alt", color: colors.gold, points: summary.waypoints.filter((w) => w.alt).map((w, i) => ({ x: state.fullRange.start + i * 8, y: Number(w.alt), row: w })) },
            ],
          },
          { id: "track-chart", type: "track", posRows: track.messages.POS, waypointRows: summary.waypoints },
          {
            id: "l1-chart",
            type: "line",
            yLabel: "deg / m",
            series: [
              series(navigation.messages.CTUN, "NavRoll", colors.blue, "NavRoll"),
              series(navigation.messages.CTUN, "Roll", colors.green, "Roll"),
              series(navigation.messages.NTUN, "XT", colors.red, "XT"),
              series(navigation.messages.NTUN, "Dist", colors.violet, "Dist"),
            ],
          },
          {
            id: "tecs-chart",
            type: "line",
            yLabel: "m / mps",
            series: [
              series(tecs.messages.TECS, "hdem", colors.blue, "hdem"),
              series(tecs.messages.TECS, "h", colors.green, "h"),
              series(tecs.messages.TECS, "spdem", colors.gold, "spdem"),
              series(tecs.messages.TECS, "sp", colors.red, "sp"),
              series(tecs.messages.ARSP, "Airspeed", colors.violet, "ARSP"),
            ],
          },
          {
            id: "att-chart",
            type: "line",
            yLabel: "deg",
            series: [
              series(attitude.messages.ATT, "DesRoll", colors.blue, "DesRoll"),
              series(attitude.messages.ATT, "Roll", colors.green, "Roll"),
              series(attitude.messages.ATT, "DesPitch", colors.gold, "DesPitch"),
              series(attitude.messages.ATT, "Pitch", colors.red, "Pitch"),
            ],
          },
          {
            id: "pid-chart",
            type: "line",
            yLabel: "rate err",
            series: [
              series(pid.messages.PIDR, "Err", colors.blue, "PIDR Err"),
              series(pid.messages.PIDP, "Err", colors.red, "PIDP Err"),
              series(pid.messages.PIDY, "Err", colors.violet, "PIDY Err"),
            ],
          },
          {
            id: "motion-chart",
            type: "line",
            yLabel: "accel / gyro / mps",
            series: [
              series(motion.messages.IMU, "AccX", colors.blue, "IMU AccX"),
              series(motion.messages.IMU, "AccY", colors.green, "IMU AccY"),
              series(motion.messages.IMU, "AccZ", colors.red, "IMU AccZ"),
              series(motion.messages.IMU, "GyrX", colors.gold, "IMU GyrX"),
              series(motion.messages.IMU, "GyrY", colors.violet, "IMU GyrY"),
              series(motion.messages.IMU, "GyrZ", colors.teal, "IMU GyrZ"),
              series(motion.messages.VIBE, "VibeX", colors.gray, "VIBE X"),
              series(motion.messages.VIBE, "VibeY", colors.blue, "VIBE Y"),
              series(motion.messages.VIBE, "VibeZ", colors.gold, "VIBE Z"),
              series(motion.messages.XKF1, "VN", colors.green, "EKF VN"),
              series(motion.messages.XKF1, "VE", colors.red, "EKF VE"),
              series(motion.messages.XKF1, "VD", colors.violet, "EKF VD"),
            ],
          },
          {
            id: "io-chart",
            type: "line",
            yLabel: "PWM",
            series: [
              series(io.messages.RCOU, "C1", colors.blue, "RCOU C1"),
              series(io.messages.RCOU, "C2", colors.green, "RCOU C2"),
              series(io.messages.RCOU, "C3", colors.gold, "RCOU C3"),
              series(io.messages.RCOU, "C4", colors.red, "RCOU C4"),
              series(io.messages.RCIN, "C1", colors.gray, "RCIN C1"),
            ],
          },
          { id: "custom-chart", type: "line", yLabel: "custom", series: [] },
        ]);
        bindCustomChartControls(buildDataCatalog([track, mission, attitude, navigation, tecs, pid, motion, io, events]));
        window.addEventListener("resize", renderAllCharts);
      }

      main().catch((error) => {
        document.querySelector("#app").innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
      });
    </script>
  </body>
</html>
