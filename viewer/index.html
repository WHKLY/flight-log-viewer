<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flight Log Viewer</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #17211d;
        --muted: #607068;
        --soft: #eef2ec;
        --paper: #f7f8f2;
        --panel: #ffffff;
        --line: #d7ded6;
        --green: #0f6a55;
        --blue: #246b93;
        --red: #a13d31;
        --gold: #9a6b16;
        --violet: #67509a;
        --shadow: 0 18px 52px rgba(23, 33, 29, 0.08);
        --canvas: #fbfcf8;
        --mode-text: #10211b;
        --mode-auto: rgba(245, 158, 11, 0.34);
        --mode-stabilize: rgba(36, 107, 147, 0.26);
        --mode-manual: rgba(161, 61, 49, 0.24);
        --mode-other: rgba(103, 80, 154, 0.22);
        --zero-line: rgba(161, 61, 49, 0.72);
        --mode-transition: rgba(23, 33, 29, 0.5);
        --custom-h-ref: rgba(154, 107, 22, 0.88);
        --custom-time-ref: rgba(36, 107, 147, 0.88);
        --inspector-time: rgba(18, 128, 106, 0.95);
      }

      * {
        box-sizing: border-box;
      }

      body {
        --font-scale: 1;
        margin: 0;
        background:
          radial-gradient(circle at 8% 0%, rgba(15, 106, 85, 0.14), transparent 28%),
          linear-gradient(120deg, rgba(36, 107, 147, 0.1), transparent 36%),
          linear-gradient(315deg, rgba(154, 107, 22, 0.13), transparent 40%),
          var(--paper);
        color: var(--ink);
        font-family: "Avenir Next", "Gill Sans", "Trebuchet MS", sans-serif;
        font-size: calc(15px * var(--font-scale));
      }

      body.font-compact {
        --font-scale: 0.9;
      }

      body.font-large {
        --font-scale: 1.14;
      }

      main {
        display: grid;
        gap: 14px;
        grid-template-columns: minmax(208px, 232px) minmax(0, 1fr);
        margin: 0 auto;
        max-width: 1500px;
        padding: 18px 16px 48px;
      }

      .control-panel {
        align-self: start;
        display: grid;
        gap: 12px;
        max-height: calc(100dvh - 36px);
        max-width: 232px;
        min-width: 0;
        overflow: auto;
        padding-right: 2px;
        position: sticky;
        scrollbar-width: thin;
        top: 18px;
        width: 100%;
      }

      .control-panel > *,
      .toolbar *,
      .inspector *,
      .metric * {
        min-width: 0;
        max-width: 100%;
      }

      .viewer-panel {
        min-width: 0;
      }

      main.controls-collapsed {
        grid-template-columns: 42px minmax(0, 1fr);
      }

      main.controls-collapsed .control-panel > :not(.control-strip) {
        display: none;
      }

      .control-strip {
        align-items: center;
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
        display: flex;
        gap: 8px;
        justify-content: space-between;
        padding: 8px;
      }

      .control-title {
        color: var(--muted);
        font-size: calc(12px * var(--font-scale));
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        writing-mode: vertical-rl;
      }

      main:not(.controls-collapsed) .control-title {
        writing-mode: horizontal-tb;
      }

      header {
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
        display: grid;
        gap: 8px;
        padding: 12px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(calc(21px * var(--font-scale)), 4vw, calc(30px * var(--font-scale)));
        letter-spacing: -0.03em;
      }

      h2 {
        font-size: calc(20px * var(--font-scale));
      }

      h3 {
        font-size: calc(15px * var(--font-scale));
      }

      p,
      td,
      th,
      li,
      label {
        color: var(--muted);
      }

      code {
        background: var(--soft);
        border-radius: 4px;
        padding: 2px 5px;
      }

      button {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--ink);
        cursor: pointer;
        font: inherit;
        padding: 7px 12px;
      }

      button.active {
        background: var(--green);
        border-color: var(--green);
        color: #fff;
      }

      .metrics {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin: 0;
      }

      .metric {
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px;
        box-shadow: var(--shadow);
      }

      .metric p {
        font-size: calc(11px * var(--font-scale));
      }

      .metric strong {
        display: block;
        color: var(--green);
        font-size: calc(16px * var(--font-scale));
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .notice,
      .toolbar,
      .param-search,
      .inspector {
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: var(--shadow);
        margin-bottom: 0;
        padding: 12px;
      }

      .toolbar,
      .param-search {
        display: grid;
        gap: 10px;
      }

      .param-search input {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--ink);
        font: inherit;
        min-width: 0;
        padding: 7px 10px;
        width: 100%;
      }

      .param-results {
        border: 1px solid var(--line);
        border-radius: 8px;
        display: grid;
        gap: 5px;
        max-height: 240px;
        overflow: auto;
        padding: 7px;
        scrollbar-width: thin;
      }

      .param-search-row {
        display: grid;
        gap: 4px;
        grid-template-columns: minmax(110px, 0.9fr) minmax(0, 1.1fr);
        min-width: 340px;
      }

      .param-search-row code,
      .param-search-row span,
      .param-search-row small {
        overflow: auto;
        scrollbar-width: thin;
        white-space: nowrap;
      }

      .param-search-row small {
        color: var(--muted);
        grid-column: 1 / -1;
      }

      .toolbar-row,
      .mode-buttons,
      .chart-actions {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .range-text {
        color: var(--muted);
        font-size: calc(13px * var(--font-scale));
      }

      .layer {
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: var(--shadow);
        margin-top: 0;
        overflow: hidden;
      }

      .layer-head {
        align-items: center;
        display: grid;
        gap: 10px;
        grid-template-columns: 1fr auto auto;
        padding: 11px 14px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(90deg, rgba(15, 106, 85, 0.09), rgba(255, 255, 255, 0));
      }

      .layer-head p {
        font-size: calc(13px * var(--font-scale));
        max-width: 820px;
      }

      .layer-index {
        color: var(--muted);
        font-size: calc(12px * var(--font-scale));
        font-weight: 700;
      }

      .layer-toggle {
        padding: 5px 10px;
      }

      .layer.collapsed .layer-body {
        display: none;
      }

      .layer-body {
        display: grid;
        grid-template-columns: minmax(0, 1.7fr) minmax(240px, 0.45fr);
        gap: 14px;
        padding: 14px;
      }

      .panel {
        min-width: 0;
      }

      .panel + .panel {
        border-left: 1px solid var(--line);
        padding-left: 14px;
      }

      .chart-shell {
        position: relative;
      }

      canvas {
        display: block;
        width: 100%;
        height: 380px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--canvas);
        touch-action: none;
      }

      .small canvas {
        height: 310px;
      }

      .readout {
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid var(--line);
        border-radius: 8px;
        bottom: 8px;
        box-shadow: 0 8px 24px rgba(23, 33, 29, 0.08);
        color: var(--ink);
        font-size: 12px;
        left: 8px;
        max-width: min(92%, 680px);
        padding: 7px 8px;
        position: absolute;
      }

      .readout:empty {
        display: none;
      }

      header,
      .toolbar,
      .param-search,
      .metric,
      .notice,
      .note,
      .readout,
      .inspector-card,
      .layer-head,
      td,
      th {
        overflow: auto;
        scrollbar-width: thin;
      }

      header { max-height: 150px; }
      .toolbar { max-height: 260px; }
      .metric { max-height: 84px; }
      .note { max-height: 210px; }
      .layer-head { max-height: 130px; }
      .readout { max-height: 140px; }

      td,
      th {
        max-width: 220px;
        white-space: nowrap;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        margin-top: 8px;
        font-size: calc(13px * var(--font-scale));
      }

      .chart-control-bar {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }

      .chart-control-bar button,
      .custom-controls button,
      .custom-controls select {
        font-size: 12px;
        padding: 5px 9px;
      }

      .custom-controls select {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--ink);
      }

      .table-scroll {
        border: 1px solid var(--line);
        border-radius: 8px;
        max-height: 330px;
        overflow: auto;
      }

      .table-scroll table {
        min-width: 100%;
      }

      .param-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        display: grid;
        gap: 6px;
        max-height: 260px;
        overflow: auto;
        padding: 8px;
        scrollbar-width: thin;
      }

      .param-row {
        display: grid;
        gap: 4px;
        grid-template-columns: minmax(96px, 0.9fr) minmax(0, 1.1fr);
        min-width: 260px;
      }

      .param-row code,
      .param-row span {
        overflow: auto;
        scrollbar-width: thin;
        white-space: nowrap;
      }

      .custom-controls {
        display: grid;
        gap: 8px;
      }

      .inspector {
        display: grid;
        gap: 10px;
      }

      .inspector-card {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        padding: 10px;
      }

      .inspector-head {
        align-items: center;
        display: flex;
        gap: 8px;
        justify-content: space-between;
      }

      .inspector-head h3,
      .inspector-card h3 {
        margin-bottom: 0;
      }

      .inspector-actions {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .inspector-actions button {
        font-size: calc(12px * var(--font-scale));
        padding: 5px 9px;
      }

      .inspector-grid {
        display: grid;
        gap: 6px;
      }

      .kv-grid {
        display: grid;
        gap: 6px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-top: 8px;
      }

      .kv {
        background: var(--soft);
        border-radius: 8px;
        padding: 7px;
      }

      .kv span {
        color: var(--muted);
        display: block;
        font-size: calc(11px * var(--font-scale));
      }

      .kv strong {
        color: var(--ink);
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .inspector-row {
        align-items: start;
        border-top: 1px solid var(--line);
        display: grid;
        gap: 6px;
        grid-template-columns: minmax(82px, 0.9fr) minmax(0, 1.1fr);
        padding-top: 6px;
      }

      .inspector-row:first-child {
        border-top: 0;
        padding-top: 0;
      }

      .inspector-row small {
        color: var(--muted);
        grid-column: 1 / -1;
      }

      .mini-list {
        display: flex;
        flex-wrap: nowrap;
        gap: 5px;
        margin-top: 7px;
        overflow: auto;
        scrollbar-width: thin;
      }

      .mini-list code {
        font-size: calc(11px * var(--font-scale));
      }

      .inspector-collapsed .inspector-body {
        display: none;
      }

      .inspector-card.chain-collapsed .chain-body {
        display: none;
      }

      .chain-body {
        max-height: 360px;
        overflow: auto;
        padding-top: 8px;
        scrollbar-width: thin;
      }

      .inspector-row strong,
      .inspector-row span,
      .inspector-row small,
      .kv strong,
      .mini-list {
        overflow: auto;
        scrollbar-width: thin;
      }

      .inspector-row strong,
      .inspector-row span,
      .inspector-row small {
        white-space: nowrap;
      }

      .status-pill {
        border-radius: 999px;
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        margin-left: 4px;
        padding: 2px 6px;
        text-transform: uppercase;
      }

      .status-direct { background: rgba(15, 106, 85, 0.14); color: var(--green); }
      .status-derived { background: rgba(154, 107, 22, 0.18); color: var(--gold); }
      .status-missing { background: rgba(161, 61, 49, 0.14); color: var(--red); }

      .custom-controls label {
        display: grid;
        gap: 4px;
      }

      .wp-button {
        border-radius: 6px;
        padding: 4px 7px;
        text-align: left;
      }

      .wp-button.active {
        background: var(--gold);
        border-color: var(--gold);
        color: #1d1404;
      }

      .legend label {
        align-items: center;
        display: inline-flex;
        gap: 5px;
      }

      .swatch {
        border-radius: 2px;
        display: inline-block;
        height: 10px;
        width: 10px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 7px 4px;
        text-align: left;
        vertical-align: top;
      }

      th {
        color: var(--ink);
      }

      .stack {
        display: grid;
        gap: 10px;
        align-content: start;
      }

      .note {
        background: var(--soft);
        border-radius: 8px;
        padding: 10px;
        font-size: 13px;
      }

      .error {
        color: var(--red);
        background: #fff4f0;
        border: 1px solid #e6beb5;
        border-radius: 8px;
        padding: 12px;
      }


      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #edf4ef;
          --muted: #b7c6bd;
          --soft: #1d2a24;
          --paper: #0e1512;
          --panel: #121d18;
          --line: #32443b;
          --green: #44d0a8;
          --blue: #73c7f1;
          --red: #ff9387;
          --gold: #f2c36b;
          --violet: #c5b0ff;
          --shadow: 0 18px 52px rgba(0, 0, 0, 0.28);
          --canvas: #101914;
          --mode-text: #f7fff9;
          --mode-auto: rgba(245, 158, 11, 0.46);
          --mode-stabilize: rgba(56, 189, 248, 0.36);
          --mode-manual: rgba(248, 113, 113, 0.36);
          --mode-other: rgba(167, 139, 250, 0.34);
          --zero-line: rgba(255, 147, 135, 0.82);
          --mode-transition: rgba(247, 255, 249, 0.62);
          --custom-h-ref: rgba(242, 195, 107, 0.92);
          --custom-time-ref: rgba(115, 199, 241, 0.92);
          --inspector-time: rgba(68, 208, 168, 0.96);
        }

        body {
          background:
            radial-gradient(circle at 8% 0%, rgba(68, 208, 168, 0.14), transparent 28%),
            linear-gradient(120deg, rgba(115, 199, 241, 0.1), transparent 36%),
            linear-gradient(315deg, rgba(242, 195, 107, 0.12), transparent 40%),
            var(--paper);
        }

        header,
        .control-strip,
        .metric,
        .notice,
        .toolbar,
        .layer,
        .readout {
          background: rgba(18, 29, 24, 0.94);
        }

        button {
          background: #17241e;
          color: var(--ink);
        }
      }

      @media (max-width: 860px) {
        main {
          grid-template-columns: 1fr;
        }

        .control-panel {
          max-height: none;
          overflow: visible;
          position: static;
        }

        .layer-head,
        .layer-body {
          display: grid;
          grid-template-columns: 1fr;
        }

        .panel + .panel {
          border-left: 0;
          border-top: 1px solid var(--line);
          padding-left: 0;
          padding-top: 14px;
        }

        canvas {
          height: 320px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <aside class="control-panel">
        <div class="control-strip"><span class="control-title">Controls</span><button id="toggle-controls">Hide</button></div>
        <header>
          <h1>Flight Log Viewer</h1>
          <p>按控制层级查看日志、任务、参数和输出。</p>
        </header>
        <div class="metrics" id="metrics"></div>
        <div id="param-search"></div>
        <div id="timeline-toolbar"></div>
        <div id="time-inspector"></div>
      </aside>
      <section class="viewer-panel">
        <div id="app"></div>
      </section>
    </main>

    <script>
      const colors = {
        green: "#0f6a55",
        blue: "#246b93",
        red: "#a13d31",
        gold: "#9a6b16",
        violet: "#67509a",
        gray: "#7b8780",
        teal: "#12806a",
      };

      const fmt = new Intl.NumberFormat("en-US", { maximumFractionDigits: 3 });
      const motionMessageNames = [
        "IMU", "IMU2", "IMU3", "ACC", "ACC2", "ACC3", "GYR", "GYR2", "GYR3", "VIBE", "RATE",
        "XKF0", "XKF1", "XKF2", "XKF3", "XKF4", "XKF5", "XKFD", "XKFM", "XKFS", "XKT", "XKTV", "XKV1", "XKV2", "XKY0", "XKY1",
        "NKF0", "NKF1", "NKF2", "NKF3", "NKF4", "NKF5",
      ];
      const missionMessageNames = ["CMD", "MAVC", "EV", "TERR", "ORGN"];
      const mavCmdNames = {
        16: "NAV_WAYPOINT",
        17: "NAV_LOITER_UNLIM",
        18: "NAV_LOITER_TURNS",
        19: "NAV_LOITER_TIME",
        20: "NAV_RETURN_TO_LAUNCH",
        21: "NAV_LAND",
        22: "NAV_TAKEOFF",
        82: "NAV_SPLINE_WAYPOINT",
        177: "DO_JUMP",
        178: "DO_CHANGE_SPEED",
        183: "DO_SET_SERVO",
        184: "DO_REPEAT_SERVO",
        189: "CONDITION_DISTANCE",
        201: "DO_SET_ROI",
        206: "DO_SET_CAM_TRIGG_DIST",
        600: "DO_SET_RESUME_REPEAT_DIST",
      };
      const state = {
        fullRange: { start: 0, end: 1 },
        range: { start: 0, end: 1 },
        activeMode: "all",
        hidden: {},
        hover: {},
        pinned: {},
        hRefs: {},
        timeRefs: [],
        highlightedWaypointIndex: null,
        inspectorTime: null,
        inspectorCollapsed: false,
        inspectorChainCollapsed: {},
        fontScale: "normal",
        paramQuery: "",
        dragging: null,
        pinch: null,
        skipClick: null,
      };
      const charts = new Map();
      let modeData = { segments: [] };
      let inspectorContext = null;

      async function loadJson(path) {
        const response = await fetch(path);
        if (!response.ok) throw new Error(`${path} not found`);
        return response.json();
      }

      async function loadJsonOptional(path) {
        try {
          return await loadJson(path);
        } catch (_error) {
          return null;
        }
      }

      function defaultSummary() {
        return {
          counts: { files: 0, parameters: 0, control_parameters: 0, waypoints: 0 },
          files: [],
          selected_files: { param: null, waypoints: null, bin_logs: [], tlogs: [], rlogs: [] },
          duplicate_groups: {},
          params: {},
          control_params: {},
          waypoints: [],
        };
      }

      function withMessages(data, names) {
        const messages = {};
        for (const name of names) messages[name] = data?.messages?.[name] || [];
        return { source_file: data?.source_file || null, messages };
      }

      function defaultManifest() {
        return {
          source: { source_file: null, target_counts: {}, time_range: null },
          compatibility: { log_firmware: null, parser_schema: "not loaded", mode_map_source: "not loaded", explanation_source: "not loaded", notes: [] },
          groups: {},
        };
      }

      function rangeFromLoadedGroups(groups) {
        const values = [];
        for (const group of groups) {
          for (const rows of Object.values(group.messages || {})) {
            for (const row of rows) if (finite(Number(row.time_s))) values.push(Number(row.time_s));
          }
        }
        if (!values.length) return { start_s: 0, end_s: 1 };
        const start = Math.min(...values);
        const end = Math.max(...values);
        return start === end ? { start_s: start, end_s: start + 1 } : { start_s: start, end_s: end };
      }

      function metric(label, value) {
        return `<div class="metric"><p>${label}</p><strong title="${escapeHtml(value)}">${escapeHtml(value)}</strong></div>`;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      const layerParameterMap = {
        l1: [
          ["NAVL1_PERIOD", "turn scale"],
          ["NAVL1_DAMPING", "damping"],
          ["NAVL1_XTRACK_I", "xtrack I"],
          ["NAVL1_LIM_BANK", "bank limit"],
          ["ROLL_LIMIT_DEG", "roll cap"],
        ],
        tecs: [
          ["TECS_TIME_CONST", "response"],
          ["TECS_SPDWEIGHT", "speed/height"],

      const controlChains = [

          params: ["INS_GYRO_FILTER", "INS_ACCEL_FILTER", "INS_HNTCH_ENABLE", "INS_NOTCH_ENABLE", "EK3_ENABLE", "EK3_IMU_MASK", "AHRS_EKF_TYPE", "VIBE_ENABLE"],
          values: [
